<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Game Hub</title>
<style>
:root{--bg:#06060e;--border:rgba(255,255,255,.1);--text:#f2f0ff;--muted:#8b87a8;--a:#a78bfa;--b:#6366f1;--c:#22d3ee;--d:#f472b6;--glow:rgba(167,139,250,.45);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
body.season-halloween{--a:#ff8c42;--b:#9b30ff;--c:#ffb347;--d:#22c55e;--glow:rgba(255,140,66,.45);--bg:#0a0610}
body.season-winter{--a:#93c5fd;--b:#60a5fa;--c:#e0f2fe;--d:#a5b4fc;--glow:rgba(147,197,253,.4);--bg:#050810}
body.season-spring{--a:#86efac;--b:#4ade80;--c:#f9a8d4;--d:#a7f3d0;--glow:rgba(134,239,172,.4);--bg:#060a08}
body.season-summer{--a:#fbbf24;--b:#f59e0b;--c:#38bdf8;--d:#fb923c;--glow:rgba(251,191,36,.4);--bg:#08060a}
body.season-autumn{--a:#fb923c;--b:#ea580c;--c:#fbbf24;--d:#c2410c;--glow:rgba(251,146,60,.45);--bg:#0a0705}
body.season-christmas{--a:#ef4444;--b:#22c55e;--c:#fbbf24;--d:#f87171;--glow:rgba(239,68,68,.4);--bg:#08050a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:orbFloat 18s ease-in-out infinite alternate}
.bg .o1{width:420px;height:420px;background:var(--a);top:-120px;right:-80px}
.bg .o2{width:360px;height:360px;background:var(--b);bottom:10%;left:-100px;animation-delay:-4s}
.bg .o3{width:280px;height:280px;background:var(--c);top:40%;left:40%;opacity:.18;animation-delay:-8s}
.bg .o4{width:200px;height:200px;background:var(--d);bottom:-40px;right:15%;opacity:.2}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-50px) scale(1.15)}}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,black 20%,transparent 75%)}
.bg .spark{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:sparkle 4s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:.7;transform:scale(1.5)}}
#clock{position:fixed;top:14px;left:16px;z-index:200;font:600 12px/1.35 ui-monospace,monospace;color:var(--muted);background:rgba(0,0,0,.35);border:1px solid var(--border);backdrop-filter:blur(10px);padding:8px 12px;border-radius:12px;letter-spacing:.02em;pointer-events:none}
#clock .time{color:var(--text);font-size:14px;font-weight:700}
#clock .date{opacity:.85;margin-top:2px}
#topProgress{position:fixed;top:0;left:0;height:2.5px;width:0;z-index:300;background:linear-gradient(90deg,var(--a),var(--c),var(--d),var(--a));background-size:200% 100%;box-shadow:0 0 16px var(--glow);transition:width .4s var(--out);pointer-events:none}
#scrollProgress{position:fixed;top:0;left:0;height:2.5px;width:0;z-index:301;background:linear-gradient(90deg,var(--c),var(--a),var(--d));box-shadow:0 0 12px var(--glow);pointer-events:none}
.content{position:relative;max-width:1100px;margin:0 auto;padding:40px 18px 64px;z-index:1}
.hero{position:relative;text-align:center;margin-bottom:28px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#cubeCanvas{position:absolute;inset:-40px -50px 0;width:calc(100% + 100px);height:calc(100% + 50px);z-index:0;cursor:grab}
#cubeCanvas:active{cursor:grabbing}
.hero h1{position:relative;z-index:2;font-size:clamp(42px,9vw,68px);font-weight:900;letter-spacing:-2.5px;background:linear-gradient(125deg,#fff 10%,var(--a) 35%,var(--c) 55%,var(--d) 80%,#fff 95%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px var(--glow));pointer-events:none}
.hero p{position:relative;z-index:2;color:var(--muted);margin-top:8px;pointer-events:none}
.hero-meta{position:relative;z-index:2;display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;color:var(--a);background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{position:relative;overflow:hidden;padding:10px 18px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);color:#d4d0ff;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;transition:transform .3s var(--spring),background .2s}
.btn:hover{transform:translateY(-2px);background:rgba(167,139,250,.2)}
.btn:active{transform:scale(.95)}
.search{width:min(360px,100%);position:relative}
.search input{width:100%;padding:12px 18px 12px 44px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:14px;outline:none}
.search input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(167,139,250,.22)}
.search::before{content:"⌕";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.tag{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.tag:hover{color:#fff;background:rgba(255,255,255,.08)}
.tag.on{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(99,102,241,.3));color:#fff;border-color:rgba(167,139,250,.6);box-shadow:0 0 16px var(--glow)}
.cat{margin-bottom:22px}
.cat-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.04);cursor:pointer;transition:background .2s}
.cat-h:hover{background:rgba(167,139,250,.1)}
.chev{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(167,139,250,.15);color:var(--a);font-size:11px;transition:transform .3s}
.cat.closed .chev{transform:rotate(-90deg)}
.cat-t{font-weight:700;font-size:15px;flex:1;text-align:left}
.cat-n{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(167,139,250,.2);color:var(--a)}
.cat-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s,opacity .3s;opacity:1}
.cat.closed .cat-b{grid-template-rows:0fr;opacity:0;pointer-events:none}
.cat-bi{overflow:hidden;padding-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}
.game{position:relative;padding:22px 18px 18px;min-height:150px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));cursor:pointer;overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s,border-color .25s}
.game:hover{transform:translateY(-8px) scale(1.04);border-color:rgba(167,139,250,.45);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 35px rgba(167,139,250,.2)}
.game.dead{opacity:.45;filter:grayscale(.8);cursor:not-allowed}
.icon{display:grid;place-items:center;width:52px;height:52px;margin-bottom:14px;border-radius:16px;background:linear-gradient(145deg,var(--b),var(--a));font-size:24px;box-shadow:0 6px 20px rgba(99,102,241,.35)}
.name{font-weight:800;font-size:15px}
.path{margin-top:5px;color:var(--muted);font-size:10px;font-family:ui-monospace,monospace}
.play{position:absolute;top:14px;right:14px;font-size:9px;font-weight:800;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:rgba(167,139,250,.25);color:#e0d9ff;opacity:0;transition:opacity .2s}
.game:hover .play{opacity:1}
.views-badge{position:absolute;bottom:14px;right:14px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;font-family:ui-monospace,monospace;pointer-events:none}
.game:hover .views-badge{color:var(--a);border-color:rgba(167,139,250,.35)}
#featuredRoot{margin-bottom:28px}
.featured-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.featured-head h2{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.featured-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.feat-card{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px;min-height:220px;cursor:pointer;transition:transform .3s var(--spring),box-shadow .3s}
.feat-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 35px var(--glow)}
.feat-slides{position:absolute;inset:0;background:#0a0a14}
.feat-slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.feat-slides img.on{opacity:1}
.feat-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,14,.8) 0%,rgba(6,6,14,.3) 45%,transparent 100%)}
.feat-body{position:relative;padding:28px 24px;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px;gap:8px}
.feat-badge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;align-self:flex-start}
.feat-title{font-size:clamp(22px,4vw,32px);font-weight:900}
.feat-sub{color:rgba(226,222,255,.8);font-size:12px}
.feat-play{align-self:flex-start;margin-top:6px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(167,139,250,.3);color:#fff;font-weight:700;font-size:12px}
.feat-dots{position:absolute;bottom:14px;right:16px;display:flex;gap:6px}
.feat-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.feat-dots span.on{background:#fff}
.mbg{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,12,.75);backdrop-filter:blur(16px)}
.mbg.on{display:flex}
.modal{background:linear-gradient(165deg,#14121f,#0e0c16);border:1px solid rgba(167,139,250,.25);border-radius:24px;padding:32px 28px;max-width:460px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal h2{font-size:22px;font-weight:800;margin-bottom:14px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.modal p,.modal a{color:var(--muted);font-size:14px;line-height:1.65}
.modal a{color:var(--a)}
.modal .x{float:right;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);font-size:18px;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:10px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.tab.on{background:rgba(167,139,250,.25);color:#fff}
.log{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.log strong{color:var(--text)}
.admin-btn{margin-top:16px;width:100%}
.admin-gate,.admin-panel{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.admin-gate label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.admin-gate input[type=password],.admin-gate input[type=email],.admin-panel select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:14px;outline:none;margin-bottom:10px}
.admin-err{color:#f87171;font-size:12px;margin-bottom:8px;display:none}
.admin-err.on{display:block}
.admin-ok{color:#4ade80;font-size:12px;margin-bottom:8px;display:none}
.admin-ok.on{display:block}
.admin-list{max-height:180px;overflow:auto;margin:10px 0 14px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.2)}
.admin-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.admin-item .nm{flex:1;font-weight:700}
.admin-item .rm{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
.admin-add-box{display:none;margin-top:12px;padding:14px;border-radius:14px;border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.08)}
.admin-add-box.on{display:block}
.admin-actions{display:flex;gap:8px;margin-top:10px}
.admin-actions .btn{flex:1;justify-content:center}
#gameDetailModal.mbg .modal{max-width:560px;padding:0;overflow:hidden}
.gd-hero{position:relative;height:200px;background:#0a0a14;overflow:hidden}
.gd-hero img{width:100%;height:100%;object-fit:cover}
.gd-hero .gd-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,12,22,.95) 0%,transparent 60%)}
.gd-body{padding:20px 24px 28px}
.gd-title{font-size:24px;font-weight:900;margin-bottom:4px}
.gd-path{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-bottom:14px}
.gd-photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.gd-photos img{height:72px;border-radius:10px;border:1px solid var(--border);cursor:pointer;flex-shrink:0}
.gd-photos img:hover{border-color:var(--a)}
.gd-actions{display:flex;gap:10px;flex-wrap:wrap}
.gd-play{flex:1;justify-content:center;padding:14px 20px;font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));border:none;color:#fff;border-radius:14px}
.gd-play:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(167,139,250,.4)}
.gd-video-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.gd-video-box label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.gd-video-box video,.gd-video-box iframe{width:100%;border-radius:12px;margin-top:8px;max-height:240px;background:#000}
.gd-close{position:absolute;top:12px;right:12px;z-index:5;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px}
.admin-previews{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.admin-previews img{height:56px;border-radius:8px;border:1px solid var(--border)}
</style>
</head>
<body>

<div class="bg">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
  <div class="grid"></div>
  <div class="spark" style="left:15%;top:25%"></div>
  <div class="spark" style="left:50%;top:35%"></div>
  <div class="spark" style="left:80%;top:65%"></div>
  <div id="seasonFx"></div>
</div>
<div id="clock"><div class="time" id="clockTime">--:--:--</div><div class="date" id="clockDate">---</div></div>
<div id="topProgress"></div>
<div id="scrollProgress"></div>

<div class="content">
  <div class="hero">
    <canvas id="cubeCanvas" title="Click & fling cubes!"></canvas>
    <h1>Game Hub</h1>
    <p>Pick a game and play · Press ` for Matrix Mode</p>
    <div class="hero-meta">
      <span class="pill"><span class="dot"></span><span>v4.0.0</span></span>
      <span class="pill" id="season" style="display:none"></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="search"><input id="search" type="search" placeholder="Search games..." autocomplete="off"/></div>
    <button class="btn" id="refresh" title="Refresh">↻</button>
    <button class="btn" id="aboutBtn">About</button>
    <button class="btn" id="logsBtn">Logs</button>
  </div>

  <div id="featuredRoot"></div>
  <div class="tags" id="tags"></div>
  <div id="root"></div>
</div>

<!-- About Modal -->
<div class="mbg" id="aboutModal">
  <div class="modal">
    <button class="x" id="aboutX">×</button>
    <h2>About</h2>
    <p>Game Hub is a collection of browser games. Click any card to play.</p>
    <p>Press the <strong>`</strong> key for Matrix Mode.</p>
    <p style="margin-top:12px">Made for fun · <a href="https://github.com/Victorxd21/hello21.github.io" target="_blank">Source</a></p>
    <button class="btn admin-btn" type="button" id="adminOpenBtn">Admin</button>
    <div class="admin-gate" id="adminGate" style="display:none">
      <label>Admin email</label>
      <input type="email" id="adminPass" placeholder="admin@example.com" autocomplete="username"/>
      <div class="admin-err" id="adminErr">Wrong credentials</div>
      <div class="admin-actions">
        <button class="btn" type="button" id="adminUnlockBtn">Unlock</button>
        <button class="btn" type="button" id="adminCancelGate">Cancel</button>
      </div>
    </div>
    <div class="admin-panel" id="adminPanel" style="display:none">
      <div class="admin-ok" id="adminOk"></div>
      <div class="admin-err" id="adminPanelErr"></div>
      <div class="admin-setup" id="adminSetup"></div>
      <div class="admin-list" id="adminList"><div style="padding:12px;color:var(--muted);font-size:12px">Loading…</div></div>
      <button class="btn" type="button" id="adminAddBtn" style="width:100%;justify-content:center">+ Add featured game</button>
      <div class="admin-add-box" id="adminAddBox">
        <select id="adminGameSelect"><option value="">Select a game…</option></select>
        <label style="display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600">Photos (1–5)</label>
        <input type="file" id="adminFiles" accept="image/*" multiple style="width:100%;margin:0 0 8px;font-size:12px;color:var(--muted)"/>
        <div class="admin-previews" id="adminPreviews"></div>
        <label style="display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600">Showcase video (optional)</label>
        <input type="file" id="adminVideo" accept="video/mp4,video/webm,video/ogg,.mp4,.webm" style="width:100%;margin:0 0 6px;font-size:12px;color:var(--muted)"/>
        <input type="url" id="adminVideoUrl" placeholder="or paste YouTube / video URL" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:13px;margin-bottom:8px"/>
        <div class="admin-actions">
          <button class="btn" type="button" id="adminSubmitFeat">Submit</button>
          <button class="btn" type="button" id="adminCancelAdd">Cancel</button>
        </div>
      </div>
      <button class="btn" type="button" id="adminLockBtn" style="width:100%;justify-content:center;margin-top:12px">Lock admin</button>
    </div>
  </div>
</div>

<!-- Logs Modal -->
<div class="mbg" id="logsModal">
  <div class="modal">
    <button class="x" id="logsX">×</button>
    <h2>Logs</h2>
    <div class="tabs">
      <button class="tab on" data-t="hub">Hub updates</button>
      <button class="tab" data-t="games">Games</button>
    </div>
    <div id="logHub"></div>
    <div id="logGames" style="display:none"></div>
  </div>
</div>

<!-- Game Detail Modal -->
<div class="mbg" id="gameDetailModal">
  <div class="modal" style="position:relative">
    <button class="gd-close" id="gdClose">×</button>
    <div class="gd-hero" id="gdHero"><div class="gd-grad"></div></div>
    <div class="gd-body">
      <div class="gd-title" id="gdTitle">Game</div>
      <div class="gd-path" id="gdPath"></div>
      <div class="gd-photos" id="gdPhotos"></div>
      <div class="gd-actions">
        <button class="btn gd-play" id="gdPlay">▶ Play now</button>
      </div>
      <div class="gd-video-box" id="gdVideoBox" style="display:none">
        <label>Showcase video</label>
        <div id="gdVideoPreview"></div>
      </div>
    </div>
  </div>
</div>

<script src="hub-core.js?v=3.9.0"></script>
<script src="featured-admin.js?v=4.0.0"></script>
<script src="options.js?v=3.7.1" defer></script>
<script src="chat.js?v=2.0.0" defer></script>
</body>
</html>
