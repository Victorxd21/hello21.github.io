<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101923" />
    <title>Game Hub</title>
    <meta name="description" content="Browse, discover, and play a rich collection of 2D and 3D browser games, with interactive physics, game guides, categories, themes, and instant gameplay." />
    <meta property="og:title" content="Game Hub" />
    <meta property="og:description" content="Browse, discover, and play a rich collection of 2D and 3D browser games, with interactive physics, game guides, categories, themes, and instant gameplay." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/game-hub-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/game-hub-icon.svg" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Development server entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static Production Fallback (for GitHub Pages serving directly from repository root) -->
    <script>
      (function() {
        var fallbackLoaded = false;
        function loadFallback() {
          if (fallbackLoaded) return;
          var root = document.getElementById('root');
          if (root && root.children && root.children.length > 0) return;
          fallbackLoaded = true;

          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/assets/index.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './dist/assets/index.js';
          document.body.appendChild(script);
        }

        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.includes('main.tsx')) ||
            (event.message && (event.message.includes('main.tsx') || event.message.includes('MIME type') || event.message.includes('Failed to resolve module')))
          )) {
            loadFallback();
          }
        }, true);

        setTimeout(function() {
          loadFallback();
        }, 700);
      })();
    </script>
  </body>
</html>
