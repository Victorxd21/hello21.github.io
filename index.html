<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>hello</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Click to enter overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }

    #overlay span {
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 2vw;
      letter-spacing: 0.3em;
      opacity: 0.4;
    }

    /* ── Hello text ── */
    #hello {
      position: relative;
      z-index: 1;
      color: #fff;
      font-size: 10vw;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.15em;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.2s ease, transform 1.2s ease;
      user-select: none;
    }

    #hello.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Image flash ── */
    #flash-img {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }

    #flash-img.pop {
      animation: fadeInOut 1.2s ease forwards;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="overlay"><span>click anywhere</span></div>
  <div id="hello">hello</div>
  <img id="flash-img" src="" alt="" />

  <script>
    // ── CONFIG ──────────────────────────────────────────
    const SOUND_FOLDER  = 'sounds/';
    const IMAGE_FOLDER  = 'images/';
    const SOUND_PREFIX  = 'sound';
    const IMAGE_PREFIX  = 'image';
    const SOUND_COUNT   = 10;      // change to however many files you have
    const SOUND_GAP_MS  = 500;     // gap between sounds
    const TEXT_DELAY_MS = 2000;    // delay before hello appears
    // ────────────────────────────────────────────────────

    const helloEl  = document.getElementById('hello');
    const flashImg = document.getElementById('flash-img');
    const overlay  = document.getElementById('overlay');

    // Preload sounds
    const sounds = [];
    for (let i = 1; i <= SOUND_COUNT; i++) {
      const a = new Audio(`${SOUND_FOLDER}${SOUND_PREFIX}${i}.mp3`);
      a.preload = 'auto';
      sounds.push(a);
    }

    // Show image and fade it out
    function showImage(num) {
      flashImg.src = `${IMAGE_FOLDER}${IMAGE_PREFIX}${num}.png`;
      flashImg.classList.remove('pop');
      void flashImg.offsetWidth; // force reflow so animation resets
      flashImg.classList.add('pop');
    }

    // Play sounds in order, show matching image when each sound ends
    function playSoundsInOrder(i = 0) {
      if (i >= sounds.length) return;

      const audio = sounds[i];
      const num   = i + 1;

      audio.play().catch(() => {});

      audio.onended = () => {
        showImage(num);
        setTimeout(() => playSoundsInOrder(i + 1), SOUND_GAP_MS);
      };

      audio.onerror = () => {
        setTimeout(() => playSoundsInOrder(i + 1), SOUND_GAP_MS);
      };
    }

    // Click overlay -> remove it -> wait -> hello appears + sounds start
    overlay.addEventListener('click', () => {
      overlay.remove();
      setTimeout(() => {
        helloEl.classList.add('visible');
        playSoundsInOrder();
      }, TEXT_DELAY_MS);
    });
  </script>
</body>
</html>
