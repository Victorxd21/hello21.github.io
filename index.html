<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Phone: Code Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            background: #0f172a;
        }
        .retro-shadow {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
        }
        .retro-shadow:active {
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-900 overflow-hidden">

    <!-- LOBBY / HOME SCREEN -->
    <div id="lobbyScreen" class="max-w-md w-full bg-slate-800/90 backdrop-blur-md border-4 border-indigo-500 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <div class="inline-block bg-indigo-600/30 p-2.5 rounded-full border-2 border-indigo-400 animate-float">
            <i class="fa-solid fa-paintbrush text-4xl text-yellow-400"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-pink-400">GARTIC PHONE</h1>
            <p class="text-xs text-slate-300 mt-1">Draw, guess, and laugh together!</p>
        </div>

        <!-- Setup Panel -->
        <div class="space-y-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-700 text-left">
            <div>
                <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Your Nickname</label>
                <input type="text" id="playerNameInput" maxlength="12" placeholder="Doodler" class="w-full bg-slate-800 border-2 border-slate-600 rounded-xl px-4 py-2 text-center text-base font-bold text-yellow-300 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="pt-2 border-t border-slate-800">
                <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Join with 4-Digit Code</label>
                <div class="flex space-x-2">
                    <input type="text" id="roomCodeInput" maxlength="4" placeholder="e.g. 4829" class="w-2/3 bg-slate-800 border-2 border-slate-600 rounded-xl px-3 py-2 text-center text-lg font-mono font-bold text-yellow-300 tracking-widest focus:outline-none focus:border-indigo-500 transition">
                    <button id="joinCodeBtn" class="w-1/3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-xs retro-shadow transition">
                        Join Room
                    </button>
                </div>
            </div>
        </div>

        <div>
            <button id="createRoomBtn" class="w-full bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-2xl text-base retro-shadow transition transform active:scale-95">
                <i class="fa-solid fa-plus mr-2"></i> Create New Private Lobby
            </button>
        </div>
    </div>

    <!-- WAITING ROOM SCREEN -->
    <div id="waitingScreen" class="hidden max-w-md w-full bg-slate-800/90 backdrop-blur-md border-4 border-indigo-500 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <div class="flex justify-between items-center bg-slate-900/80 px-4 py-3 rounded-2xl border border-slate-700">
            <span class="text-xs text-slate-400">Room Code: <span id="displayRoomId" class="font-mono text-yellow-300 font-bold text-base tracking-widest">----</span></span>
            <span class="text-xs bg-yellow-500/20 text-yellow-300 px-3 py-1 rounded-full font-bold animate-pulse">Waiting...</span>
        </div>

        <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-700 text-left">
            <div class="text-xs font-semibold text-slate-300 mb-2">Players in Room (<span id="waitingPlayerCount">0</span>/8)</div>
            <div id="waitingPlayersList" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                <!-- Populated via JS -->
            </div>
        </div>

        <button id="startMatchBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-6 rounded-2xl text-base retro-shadow transition transform active:scale-95">
            <i class="fa-solid fa-play mr-2"></i> Start Game Now
        </button>
    </div>

    <!-- GAME PHASE 1: WRITE PROMPT -->
    <div id="writePhaseScreen" class="hidden max-w-lg w-full bg-slate-800/90 backdrop-blur-md border-4 border-purple-500 rounded-3xl p-6 shadow-2xl text-center space-y-5">
        <div class="text-sm font-semibold text-purple-300 uppercase tracking-wider">Step 1: Write a Secret Sentence</div>
        <p class="text-xs text-slate-300">Write something funny or weird for someone else to draw!</p>
        <input type="text" id="promptInput" maxlength="60" placeholder="e.g. A cat astronaut eating space pizza" class="w-full bg-slate-900 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-lg font-bold text-yellow-300 focus:outline-none focus:border-purple-500 transition">
        <button id="submitPromptBtn" class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold py-3 rounded-2xl text-base retro-shadow transition">
            Submit Prompt <i class="fa-solid fa-check ml-1"></i>
        </button>
    </div>

    <!-- GAME PHASE 2: DRAWING CANVAS -->
    <div id="drawPhaseScreen" class="hidden max-w-2xl w-full bg-slate-800/90 backdrop-blur-md border-4 border-pink-500 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-pink-300 uppercase tracking-wider">Step 2: Draw This!</span>
            <span id="promptToDrawText" class="text-sm font-bold text-yellow-300 bg-slate-900 px-3 py-1 rounded-xl border border-slate-700">---</span>
        </div>

        <div class="relative bg-white rounded-2xl overflow-hidden border-4 border-slate-700 shadow-inner flex justify-center">
            <canvas id="paintCanvas" width="520" height="340" class="cursor-crosshair bg-white"></canvas>
        </div>

        <div class="flex justify-between items-center">
            <div class="flex space-x-2">
                <button onclick="setBrushColor('#0f172a')" class="w-8 h-8 rounded-full bg-slate-900 border-2 border-white shadow"></button>
                <button onclick="setBrushColor('#ef4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-white shadow"></button>
                <button onclick="setBrushColor('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white shadow"></button>
                <button onclick="setBrushColor('#10b981')" class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-white shadow"></button>
                <button onclick="setBrushColor('#ec4899')" class="w-8 h-8 rounded-full bg-pink-500 border-2 border-white shadow"></button>
                <button onclick="clearCanvas()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-bold">Clear</button>
            </div>
            <button id="submitDrawingBtn" class="bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm retro-shadow transition">
                Done Drawing <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- GAME PHASE 3: GUESSING SCREEN -->
    <div id="guessPhaseScreen" class="hidden max-w-lg w-full bg-slate-800/90 backdrop-blur-md border-4 border-indigo-500 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <div class="text-sm font-semibold text-indigo-300 uppercase tracking-wider">Step 3: What is this drawing?</div>
        <div class="bg-white p-2 rounded-2xl border-4 border-slate-700 inline-block shadow">
            <img id="guessImageDisplay" class="max-h-56 mx-auto rounded-lg" alt="Drawing to guess">
        </div>
        <input type="text" id="guessInput" maxlength="60" placeholder="Type your guess here..." class="w-full bg-slate-900 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-lg font-bold text-yellow-300 focus:outline-none focus:border-indigo-500 transition">
        <button id="submitGuessBtn" class="w-full bg-gradient-to-r from-indigo-500 to-teal-600 hover:from-indigo-600 hover:to-teal-700 text-white font-bold py-3 rounded-2xl text-base retro-shadow transition">
            Submit Guess <i class="fa-solid fa-check ml-1"></i>
        </button>
    </div>

    <!-- GAME PHASE 4: ALBUM / REEL REVEAL -->
    <div id="revealPhaseScreen" class="hidden max-w-lg w-full bg-slate-800/90 backdrop-blur-md border-4 border-yellow-500 rounded-3xl p-6 shadow-2xl text-center space-y-5">
        <div class="text-sm font-semibold text-yellow-400 uppercase tracking-wider">🎉 Story Reveal Reel 🎉</div>
        <div id="storyReelContainer" class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 space-y-3 min-h-[200px] flex flex-col items-center justify-center max-h-72 overflow-y-auto">
            <!-- Dynamically populated step cards -->
        </div>
        <button onclick="location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl text-base retro-shadow transition">
            Play Again <i class="fa-solid fa-rotate ml-1"></i>
        </button>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://degilckgjfdnekszsbry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ym_oqKIyxwk7ixxCvwNCmA_w2VtnpdP';
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Supabase init error:", e);
        }

        let playerId = 'user_' + Math.random().toString(36).substring(2, 9);
        let playerName = 'Doodler';
        let roomId = null;
        let channel = null;
        let players = {};
        let gameDeck = []; 
        let currentStepIndex = 0;

        function showScreen(screenId) {
            ['lobbyScreen', 'waitingScreen', 'writePhaseScreen', 'drawPhaseScreen', 'guessPhaseScreen', 'revealPhaseScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function getUserName() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            if (nameInput) playerName = nameInput;
        }

        // Create a new room with a random 4-digit code
        document.getElementById('createRoomBtn').addEventListener('click', async () => {
            getUserName();
            roomId = Math.floor(1000 + Math.random() * 9000).toString(); // 4 digit code e.g. "5821"

            if (supabaseClient) {
                await supabaseClient.from('rooms').insert([{ id: roomId, status: 'waiting', players_count: 1 }]);
            }

            showScreen('waitingScreen');
            document.getElementById('displayRoomId').innerText = roomId;
            setupRealtimeChannel();
        });

        // Join a room using the 4-digit code input
        document.getElementById('joinCodeBtn').addEventListener('click', async () => {
            getUserName();
            const codeInput = document.getElementById('roomCodeInput').value.trim();
            
            if (codeInput.length !== 4) {
                alert("Please enter a valid 4-digit room code.");
                return;
            }

            roomId = codeInput;

            if (supabaseClient) {
                let { data, error } = await supabaseClient.from('rooms').select('*').eq('id', roomId).single();
                if (error || !data) {
                    alert("Room not found! Check the code or create a new room.");
                    return;
                }
                await supabaseClient.from('rooms').update({ players_count: data.players_count + 1 }).eq('id', roomId);
            }

            showScreen('waitingScreen');
            document.getElementById('displayRoomId').innerText = roomId;
            setupRealtimeChannel();
        });

        function setupRealtimeChannel() {
            channel = supabaseClient.channel('room_' + roomId, {
                config: { broadcast: { self: false } }
            });

            channel.on('broadcast', { event: 'player_sync' }, payload => {
                players[payload.payload.id] = payload.payload;
                updateWaitingUI();
            });

            channel.on('broadcast', { event: 'start_game' }, payload => {
                gameDeck = payload.payload.deck;
                beginGameSequence();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    players[playerId] = { id: playerId, name: playerName };
                    updateWaitingUI();

                    setInterval(() => {
                        if (channel) {
                            channel.send({ type: 'broadcast', event: 'player_sync', payload: { id: playerId, name: playerName } });
                        }
                    }, 1500);
                }
            });
        }

        function updateWaitingUI() {
            let count = Object.keys(players).length;
            document.getElementById('waitingPlayerCount').innerText = count;
            let html = '';
            for (let id in players) {
                html += `<div class="bg-slate-800 p-2 rounded-xl border border-slate-700 text-xs font-bold text-white flex justify-between items-center">
                    <span><i class="fa-solid fa-user text-indigo-400 mr-2"></i> ${players[id].name}</span>
                    <span class="text-green-400 text-[10px]">Ready</span>
                </div>`;
            }
            document.getElementById('waitingPlayersList').innerHTML = html;
        }

        document.getElementById('startMatchBtn').addEventListener('click', async () => {
            let playerList = Object.values(players);
            let deck = playerList.map(p => ({ ownerId: p.id, ownerName: p.name, type: 'prompt', content: '' }));
            
            if (supabaseClient) {
                await supabaseClient.from('rooms').update({ status: 'playing' }).eq('id', roomId);
            }

            if (channel) {
                channel.send({ type: 'broadcast', event: 'start_game', payload: { deck } });
            }
            gameDeck = deck;
            beginGameSequence();
        });

        function beginGameSequence() {
            currentStepIndex = 0;
            showScreen('writePhaseScreen');
        }

        document.getElementById('submitPromptBtn').addEventListener('click', () => {
            const val = document.getElementById('promptInput').value.trim();
            if (!val) return alert("Please type a prompt first!");
            
            let myItem = gameDeck.find(item => item.ownerId === playerId);
            if (myItem) myItem.content = val;

            document.getElementById('writePhaseScreen').classList.add('hidden');
            setupDrawingPhase();
        });

        const paintCanvas = document.getElementById('paintCanvas');
        const pCtx = paintCanvas.getContext('2d');
        let isDrawing = false;
        let brushColor = '#0f172a';

        function setBrushColor(col) { brushColor = col; }
        function clearCanvas() { pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height); pCtx.fillStyle = '#ffffff'; pCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height); }

        pCtx.fillStyle = '#ffffff';
        pCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);

        paintCanvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        paintCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = paintCanvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            pCtx.fillStyle = brushColor;
            pCtx.beginPath();
            pCtx.arc(x, y, 6, 0, Math.PI * 2);
            pCtx.fill();
        });

        function setupDrawingPhase() {
            showScreen('drawPhaseScreen');
            clearCanvas();
            let playerIds = Object.keys(players);
            let myIdx = playerIds.indexOf(playerId);
            let targetIdx = (myIdx + currentStepIndex) % playerIds.length;
            let targetItem = gameDeck[targetIdx];
            
            document.getElementById('promptToDrawText').innerText = targetItem ? targetItem.content : "Draw something cool!";
        }

        document.getElementById('submitDrawingBtn').addEventListener('click', () => {
            const dataUrl = paintCanvas.toDataURL();
            let playerIds = Object.keys(players);
            let myIdx = playerIds.indexOf(playerId);
            let targetIdx = (myIdx + currentStepIndex) % playerIds.length;
            
            gameDeck[targetIdx].content = dataUrl;
            gameDeck[targetIdx].type = 'drawing';

            document.getElementById('drawPhaseScreen').classList.add('hidden');
            setupGuessingPhase();
        });

        function setupGuessingPhase() {
            showScreen('guessPhaseScreen');
            let playerIds = Object.keys(players);
            let myIdx = playerIds.indexOf(playerId);
            let targetIdx = (myIdx + currentStepIndex + 1) % playerIds.length;
            let targetItem = gameDeck[targetIdx];

            if (targetItem && targetItem.type === 'drawing') {
                document.getElementById('guessImageDisplay').src = targetItem.content;
            }
            document.getElementById('guessInput').value = '';
        }

        document.getElementById('submitGuessBtn').addEventListener('click', () => {
            const val = document.getElementById('guessInput').value.trim();
            if (!val) return alert("Please type a guess!");

            let playerIds = Object.keys(players);
            let myIdx = playerIds.indexOf(playerId);
            let targetIdx = (myIdx + currentStepIndex + 1) % playerIds.length;

            gameDeck[targetIdx].content = val;
            gameDeck[targetIdx].type = 'guess';

            currentStepIndex++;
            if (currentStepIndex >= playerIds.length - 1) {
                showRevealPhase();
            } else {
                setupDrawingPhase();
            }
        });

        function showRevealPhase() {
            showScreen('revealPhaseScreen');
            let container = document.getElementById('storyReelContainer');
            let html = '';
            gameDeck.forEach((item, idx) => {
                html += `<div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-left">
                    <div class="text-[10px] text-purple-300 font-bold mb-1">${item.ownerName}'s Chain</div>`;
                if (idx % 2 === 0) {
                    html += `<div class="text-xs text-yellow-300 font-bold">"${item.content}"</div>`;
                } else {
                    html += `<img src="${item.content}" class="max-h-32 mx-auto rounded-lg border border-slate-600">`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
