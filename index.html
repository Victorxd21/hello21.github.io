<title>Game Hub</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 20% 20%, #25254a 0%, transparent 35%),
            radial-gradient(circle at 80% 80%, #171735 0%, transparent 40%),
            #080810;
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    header {
        position: relative;
        padding: 70px 30px 50px;
        text-align: center;
    }

    .badge {
        display: inline-block;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(120, 120, 255, 0.12);
        border: 1px solid rgba(140, 140, 255, 0.25);
        color: #aaaaff;
        font-size: 13px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: clamp(45px, 8vw, 85px);
        font-weight: 900;
        letter-spacing: -4px;
        background: linear-gradient(90deg, #ffffff, #aaaaff, #ffffff);
        background-size: 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient 5s linear infinite;
    }

    @keyframes gradient {
        0% {
            background-position: 0%;
        }

        100% {
            background-position: 200%;
        }
    }

    .subtitle {
        margin-top: 15px;
        color: #89899a;
        font-size: 16px;
    }

    main {
        position: relative;
        width: min(1200px, calc(100% - 40px));
        margin: auto;
        padding-bottom: 80px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .games-count {
        color: #858597;
        font-size: 14px;
    }

    .refresh {
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .refresh:hover {
        background: rgba(255,255,255,0.1);
        transform: translateY(-2px);
    }

    #games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
    }

    .game {
        position: relative;
        min-height: 150px;
        padding: 24px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.045);
        backdrop-filter: blur(12px);
        cursor: pointer;
        overflow: hidden;
        transition:
            transform 0.25s ease,
            border-color 0.25s ease,
            background 0.25s ease;
    }

    .game::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        background: #6d5dfc;
        filter: blur(80px);
        opacity: 0;
        top: -80px;
        right: -80px;
        transition: 0.3s;
    }

    .game:hover {
        transform: translateY(-6px);
        border-color: rgba(140,140,255,0.4);
        background: rgba(255,255,255,0.075);
    }

    .game:hover::before {
        opacity: 0.3;
    }

    .game-icon {
        width: 45px;
        height: 45px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6d5dfc, #9b8cff);
        font-size: 21px;
        margin-bottom: 18px;
        box-shadow: 0 8px 30px rgba(109,93,252,0.25);
    }

    .game-name {
        position: relative;
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 7px;
        word-break: break-word;
    }

    .game-file {
        position: relative;
        color: #777789;
        font-size: 12px;
    }

    .loading {
        grid-column: 1 / -1;
        text-align: center;
        padding: 70px 20px;
        color: #777789;
    }

    .spinner {
        width: 35px;
        height: 35px;
        border: 3px solid rgba(255,255,255,0.08);
        border-top-color: #8b7cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 18px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .error {
        grid-column: 1 / -1;
        padding: 30px;
        border-radius: 15px;
        background: rgba(255,70,70,0.08);
        border: 1px solid rgba(255,70,70,0.2);
        color: #ff9b9b;
        text-align: center;
    }

    footer {
        position: relative;
        text-align: center;
        color: #555566;
        font-size: 12px;
        padding: 30px;
    }

    @media (max-width: 600px) {
        header {
            padding-top: 45px;
        }

        h1 {
            letter-spacing: -2px;
        }

        main {
            width: min(100% - 25px, 1200px);
        }

        #games {
            grid-template-columns: 1fr;
        }
    }
</style>

```
<h1>GAME HUB</h1>

<p class="subtitle">
    Pick a game and start playing.
</p>
```

</header>

<main>

```
<div class="topbar">
    <div class="games-count" id="gameCount">
        Loading games...
    </div>

    <button class="refresh" onclick="loadGames()">
        ↻ Refresh
    </button>
</div>

<div id="games">
    <div class="loading">
        <div class="spinner"></div>
        Loading games...
    </div>
</div>
```

</main>

<footer>
    Games are loaded automatically from the <b>/games</b> folder.
</footer>

<script>

async function loadGames() {

    const gamesContainer = document.getElementById("games");
    const gameCount = document.getElementById("gameCount");

    gamesContainer.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading games...
        </div>
    `;

    gameCount.textContent = "Loading games...";

    try {

        /*
            Automatically figures out your GitHub username
            and repository from the GitHub Pages URL.
        */

        const hostname = window.location.hostname;
        const pathname = window.location.pathname;

        let owner;
        let repo;

        // Normal GitHub Pages:
        // username.github.io/repository/
        if (hostname.endsWith(".github.io")) {

            owner = hostname.split(".")[0];

            const parts = pathname
                .split("/")
                .filter(Boolean);

            repo = parts[0];

            // If the page is username.github.io directly
            if (!repo) {
                repo = `${owner}.github.io`;
            }

        } else {

            /*
                Custom domain fallback.

                If you're using a custom domain, put your
                GitHub repository details here.
            */

            owner = "YOUR_GITHUB_USERNAME";
            repo = "YOUR_REPOSITORY";
        }

        const apiURL =
            `https://api.github.com/repos/${owner}/${repo}/contents/games`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error(
                `GitHub API returned ${response.status}`
            );
        }

        const files = await response.json();

        const games = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".html")
        );

        gamesContainer.innerHTML = "";

        if (games.length === 0) {

            gamesContainer.innerHTML = `
                <div class="loading">
                    <div style="font-size:40px;margin-bottom:15px;">
                        🎮
                    </div>

                    <div>
                        No games found.
                    </div>

                    <div style="font-size:12px;margin-top:8px;">
                        Put some .html files inside the games folder.
                    </div>
                </div>
            `;

            gameCount.textContent = "0 games";

            return;
        }

        gameCount.textContent =
            `${games.length} game${games.length === 1 ? "" : "s"}`;

        games.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        games.forEach(file => {

            const card = document.createElement("div");

            card.className = "game";

            const gameName = file.name
                .replace(/\.html$/i, "")
                .replace(/[-_]/g, " ")
                .replace(/\b\w/g, char => char.toUpperCase());

            card.innerHTML = `
                <div class="game-icon">
                    🎮
                </div>

                <div class="game-name">
                    ${escapeHTML(gameName)}
                </div>

                <div class="game-file">
                    ${escapeHTML(file.name)}
                </div>
            `;

            card.addEventListener("click", () => {

                /*
                    Opens the game in a new tab/window.
                */

                window.open(
                    getGameURL(file.name),
                    "_blank"
                );

            });

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        gamesContainer.innerHTML = `
            <div class="error">
                <h3>Couldn't load the games 😭</h3>

                <p style="margin-top:10px;">
                    Make sure the repository is public and
                    the <b>games</b> folder exists.
                </p>

                <p style="margin-top:8px;font-size:12px;">
                    ${escapeHTML(error.message)}
                </p>
            </div>
        `;

        gameCount.textContent = "Error loading games";
    }
}


function getGameURL(filename) {

    const currentURL = new URL(window.location.href);

    let basePath = currentURL.pathname;

    /*
        Make sure we are pointing to:
        /games/filename.html
    */

    if (!basePath.endsWith("/")) {
        basePath += "/";
    }

    return new URL(
        `games/${encodeURIComponent(filename)}`,
        currentURL.origin + basePath
    ).href;
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// Load games when the page starts.
loadGames();

</script>

</body>
