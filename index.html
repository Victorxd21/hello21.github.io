<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Realtime Chat</title>
    <!-- Include Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .setup-screen, .chat-screen { display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none !important; }
        #chat-box { height: 350px; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .public-msg { background: #e2e8f0; align-self: flex-start; }
        .private-msg { background: #fed7aa; border-left: 4px solid #f97316; align-self: flex-start; }
        .my-msg { background: #dbeafe; align-self: flex-end; }
        .controls { display: flex; gap: 10px; }
        input, select, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Supabase Chat Room</h2>

    <!-- STEP 1: Login / Set Name -->
    <div id="setupScreen" class="setup-screen">
        <p>Enter your chat name to join:</p>
        <input type="text" id="usernameInput" placeholder="Your Name...">
        <button onclick="joinChat()">Join Chat</button>
    </div>

    <!-- STEP 2: The Chat Interface -->
    <div id="chatScreen" class="chat-screen hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="welcomeUser" style="font-weight: bold; color: #333;"></span>
            <span style="font-size: 12px; color: #666;">Messages stay saved!</span>
        </div>

        <div id="chat-box"></div>

        <div class="controls">
            <select id="recipientSelect">
                <option value="public">Everyone (Public)</option>
            </select>
            <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1;" onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let myName = '';

    function joinChat() {
        const input = document.getElementById('usernameInput').value.trim();
        if (!input) {
            alert('Please enter a name!');
            return;
        }
        myName = input;
        document.getElementById('welcomeUser').innerText = `Logged in as: ${myName}`;
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('chatScreen').classList.remove('hidden');

        loadOldMessages();
        subscribeToChat();
        loadActiveUsers(); // Optional helper to list users
    }

    // Load past messages from Supabase database
    async function loadOldMessages() {
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error('Error loading messages:', error);
            return;
        }

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = ''; // clear
        data.forEach(msg => displayMessage(msg));
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Listen live for new messages coming in
    function subscribeToChat() {
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                displayMessage(payload.new);
                const chatBox = document.getElementById('chat-box');
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .subscribe();
    }

    // Send a message (Public or Private)
    async function sendMessage() {
        const messageText = document.getElementById('messageInput').value.trim();
        const recipient = document.getElementById('recipientSelect').value;

        if (!messageText) return;

        const { error } = await supabaseClient
            .from('messages')
            .insert([
                { 
                    sender: myName, 
                    recipient: recipient === 'public' ? null : recipient, 
                    message: messageText 
                }
            ]);

        if (error) {
            alert('Error sending message: ' + error.message);
        } else {
            document.getElementById('messageInput').value = '';
        }
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // Render messages onto the screen (filtering private messages properly)
    function displayMessage(data) {
        // If it's a private message, only show it if I am the sender or the recipient
        if (data.recipient && data.recipient !== myName && data.sender !== myName) {
            return; 
        }

        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.classList.add('message');

        let isMine = (data.sender === myName);
        let isPrivate = data.recipient !== null;

        if (isMine) {
            div.classList.add('my-msg');
            div.innerHTML = `<strong>You${isPrivate ? ' (Whisper to ' + data.recipient + ')' : ''}:</strong> ${escapeHtml(data.message)}`;
        } else {
            if (isPrivate) {
                div.classList.add('private-msg');
                div.innerHTML = `<strong>[Private] ${escapeHtml(data.sender)}:</strong> ${escapeHtml(data.message)}`;
            } else {
                div.classList.add('public-msg');
                div.innerHTML = `<strong>${escapeHtml(data.sender)}:</strong> ${escapeHtml(data.message)}`;
            }
        }

        chatBox.appendChild(div);

        // Dynamically add sender to recipient dropdown if they aren't there yet
        updateRecipientList(data.sender);
    }

    function updateRecipientList(name) {
        if (name === myName) return;
        const select = document.getElementById('recipientSelect');
        let exists = false;
        for (let i = 0; i < select.options.length; i++) {
            if (select.options[i].value === name) exists = true;
        }
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = `Whisper to ${name}`;
            select.appendChild(opt);
        }
    }

    // Simple security helper to prevent HTML injection/XSS attacks
    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
