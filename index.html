<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101923" />
    <title>Game Hub</title>
    <meta name="description" content="Browse, discover, and play a rich collection of 2D and 3D browser games, with interactive physics, game guides, categories, themes, and instant gameplay." />
    <meta property="og:title" content="Game Hub" />
    <meta property="og:description" content="Browse, discover, and play a rich collection of 2D and 3D browser games, with interactive physics, game guides, categories, themes, and instant gameplay." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./game-hub-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./game-hub-icon.svg" />

    <!-- Trailing slash normalization for GitHub Pages project subpaths -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Development entry (Vite dev server compiles this dynamically in local development) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Production fallback (Loads pre-built bundle when served statically from GitHub Pages branch root) -->
    <script>
      (function() {
        if (window.__hub_prod_initialized__) return;

        function initProdBundle() {
          if (window.__hub_prod_initialized__) return;
          var root = document.getElementById('root');
          // If already rendered by Vite dev server, exit
          if (root && root.children && root.children.length > 0) return;
          // If Vite dev client is present, do not interfere
          if (window.__vite_plugin_react_preamble_installed__) return;

          window.__hub_prod_initialized__ = true;

          // Load compiled CSS if not already attached
          if (!document.getElementById('hub-bundle-css')) {
            var link = document.createElement('link');
            link.id = 'hub-bundle-css';
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = './assets/index.css';
            document.head.appendChild(link);
          }

          // Load compiled JS module
          var script = document.createElement('script');
          script.id = 'hub-bundle-js';
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }

        // On GitHub Pages, loading /src/main.tsx fails immediately because GitHub Pages serves static files without compiling TSX
        window.addEventListener('error', function() {
          initProdBundle();
        }, true);

        // Immediate check for static host environments (github.io or non-vite ports)
        var host = window.location.hostname || '';
        if (host.includes('github.io') || window.location.protocol === 'file:') {
          setTimeout(initProdBundle, 40);
        } else {
          setTimeout(initProdBundle, 350);
        }
      })();
    </script>
  </body>
</html>
