<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Hub</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080810;color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:50px 50px}.content{position:relative;max-width:1100px;margin:auto;padding:70px 20px 40px}.settings{position:fixed;top:16px;left:16px;padding:12px;border:1px solid #fff2;border-radius:12px;background:#ffffff12;font-size:20px}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(36px,7vw,54px);background:linear-gradient(135deg,#fff,#a99bff);color:transparent;background-clip:text}.hero p{color:#999;margin:10px 0 25px}.toolbar{text-align:center;color:#999;margin-bottom:28px}.refresh{margin-left:10px;padding:9px 15px;border:1px solid #fff2;border-radius:10px;background:#ffffff0d;color:#d0c7ff;cursor:pointer}.status{text-align:center;color:#999;padding:40px}.category{margin:0 0 32px}.category-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:19px;font-weight:700}.category-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d5dfc,#9b8cff)}.count{color:#777;font-size:13px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.game{padding:20px;min-height:135px;border:1px solid #fff2;border-radius:18px;background:#ffffff0b;cursor:pointer;transition:.2s}.game:hover{transform:translateY(-3px);border-color:#9b8cff}.icon{display:grid;place-items:center;width:44px;height:44px;margin-bottom:12px;border-radius:12px;background:linear-gradient(135deg,#6d5dfc,#9b8cff);font-size:22px}.name{font-weight:700;font-size:17px}.path{margin-top:5px;color:#777;font-size:11px}footer{text-align:center;color:#555;margin-top:30px;font-size:12px}</style></head><body><button class="settings">⚙️</button><main class="content"><header class="hero"><h1>Game Hub</h1><p>Pick a game and play</p></header><div class="toolbar"><span id="count">Loading games...</span><button class="refresh" onclick="loadGames()">↻ Refresh</button></div><div id="games"><div class="status">Loading games...</div></div><footer>Games load from the /games folder.</footer></main><script>const OWNER='Victorxd21',REPO='hello21.github.io';const fallback=[['Games','🎮',null,[['Royale','royale.html'],['Snake','snake.html'],['Werewolf','werewolf.html']]],['Cat Game','🐱','cat-game',[['CatUP','catUP.html']]],['Garticphone','✏️','garticphone',[['Garticphone','index.html']]],['Jetpack Joyride','🚀','jetpack-joyride',[['Jetpack Joyride','index.html']]],['Live Earth','🌍','live-earth',[['Live Earth','index.html']]],['Party Race','🏁','party-race',[['Party Race','index.html']]],['Rocket League','⚽','rocket-league',[['Rocket League','index.html']]],['SlitherIO','🐍','slitherIO',[['SlitherIO','index.html']]],['Storm Chaser','⛈️','storm-chaser',[['Storm Chaser','index.html']]],['Voxel World','🧱','voxel-world',[['Voxel World','index.html']]]];const hidden=new Set(['game-art','images','sounds','assets','pics','music','heads']);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function url(folder,file){return'games/'+(folder?encodeURIComponent(folder)+'/':'')+encodeURIComponent(file)}function draw(groups,offline=false){const root=document.getElementById('games');root.innerHTML='';let total=0;groups.forEach(([title,icon,folder,games])=>{total+=games.length;const section=document.createElement('section');section.className='category';section.innerHTML='<div class="category-title"><span class="category-icon">'+icon+'</span><span>'+esc(title)+' <span class="count">('+games.length+')</span></span></div><div class="grid"></div>';const grid=section.querySelector('.grid');games.forEach(([name,file])=>{const card=document.createElement('article');card.className='game';card.innerHTML='<div class="icon">'+icon+'</div><div class="name">'+esc(name)+'</div><div class="path">'+esc(folder?folder+'/'+file:file)+'</div>';card.onclick=()=>location.href=url(folder,file);grid.appendChild(card)});root.appendChild(section)});document.getElementById('count').textContent=total+' games'+(offline?' (offline list)':'')}async function apiGroups(){const response=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/games',{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('GitHub API '+response.status);const items=await response.json(),groups=[],root=[];for(const item of items){if(item.type==='file'&&/\.html$/i.test(item.name))root.push([item.name.replace(/\.html$/i,'').replace(/[-_]/g,' '),item.name]);if(item.type==='dir'&&!hidden.has(item.name.toLowerCase())){const r=await fetch(item.url);if(!r.ok)continue;const files=await r.json(),html=files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name));if(html.length)groups.push([item.name.replace(/[-_]/g,' '),'📁',item.name,html.map(f=>[f.name.replace(/\.html$/i,'').replace(/[-_]/g,' '),f.name])])}}if(root.length)groups.unshift(['Games','🎮',null,root]);return groups}async function loadGames(){document.getElementById('games').innerHTML='<div class="status">Loading games...</div>';try{draw(await apiGroups())}catch(error){console.warn(error);draw(fallback,true)}}loadGames();</script></body></html>
