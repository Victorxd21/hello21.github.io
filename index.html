<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io: Global Server</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            background: #0f172a;
            overflow: hidden;
        }
        .retro-shadow {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
        }
        .retro-shadow:active {
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
            transform: translateY(4px);
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col items-center justify-center bg-slate-950">

    <!-- START MENU SCREEN -->
    <div id="menuScreen" class="absolute z-20 max-w-sm w-full bg-slate-900/90 backdrop-blur-md border-4 border-emerald-500 rounded-3xl p-6 shadow-2xl text-center space-y-5">
        <div class="inline-block bg-emerald-600/30 p-3 rounded-full border-2 border-emerald-400 animate-bounce">
            <i class="fa-solid fa-worm text-5xl text-emerald-400"></i>
        </div>
        <div>
            <h1 class="text-3xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-teal-400">SLITHER GLOBAL</h1>
            <p class="text-xs text-slate-300 mt-1">Collide into other worms to destroy them! Grow thick and long.</p>
        </div>

        <div class="space-y-3 bg-slate-800/60 p-4 rounded-2xl border border-slate-700 text-left">
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Your Worm Name</label>
            <input type="text" id="playerNameInput" maxlength="12" value="SlitherPro" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-2.5 text-center text-lg font-bold text-emerald-300 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <button id="playBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-2xl text-lg retro-shadow transition transform active:scale-95">
            <i class="fa-solid fa-play mr-2"></i> Play Live
        </button>
    </div>

    <!-- HUD OVERLAY -->
    <div id="hud" class="hidden absolute top-4 left-4 z-10 pointer-events-none flex flex-col space-y-2">
        <div class="bg-slate-900/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-2xl shadow-lg">
            <div class="text-[10px] uppercase font-bold text-slate-400">Length / Score</div>
            <div id="scoreDisplay" class="text-2xl font-extrabold text-emerald-400 font-mono">10</div>
        </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard" class="hidden absolute top-4 right-4 z-10 pointer-events-none bg-slate-900/80 backdrop-blur border border-slate-700 p-3 rounded-2xl shadow-lg w-48">
        <div class="text-xs font-bold text-teal-400 border-b border-slate-700 pb-1 mb-2"><i class="fa-solid fa-trophy mr-1"></i> Top Worms</div>
        <div id="leaderboardList" class="space-y-1 text-xs text-slate-300 font-mono"></div>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" class="block w-full h-full cursor-crosshair"></canvas>

    <!-- GAME SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://degilckgjfdnekszsbry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ym_oqKIyxwk7ixxCvwNCmA_w2VtnpdP';
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Supabase init error:", e);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 3000; 
        let playerId = 'worm_' + Math.random().toString(36).substring(2, 9);
        let playerName = 'SlitherPro';
        let globalChannel = null;

        let me = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            angle: 0,
            speed: 3.5,
            trail: [],
            score: 10,
            color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')
        };

        let remotePlayers = {}; 
        let foodPellets = [];   
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let gameActive = false;

        // Synchronized deterministic food generation using a fixed PRNG seed so all players have identical food positions
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        for(let i=0; i<400; i++) {
            foodPellets.push({
                id: 'food_' + i,
                x: seededRandom(i * 3 + 1) * WORLD_SIZE,
                y: seededRandom(i * 3 + 2) * WORLD_SIZE,
                color: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'][Math.floor(seededRandom(i * 3 + 3) * 5)]
            });
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            const val = document.getElementById('playerNameInput').value.trim();
            if(val) playerName = val;

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('leaderboard').classList.remove('hidden');

            respawnPlayer();
            initGlobalMultiplayer();
            gameActive = true;
            requestAnimationFrame(gameLoop);
        });

        function respawnPlayer() {
            me.x = 500 + Math.random() * (WORLD_SIZE - 1000);
            me.y = 500 + Math.random() * (WORLD_SIZE - 1000);
            me.score = 10;
            me.trail = [];
            for(let i=0; i<me.score*4; i++) {
                me.trail.push({ x: me.x, y: me.y });
            }
            document.getElementById('scoreDisplay').innerText = me.score;
        }

        function initGlobalMultiplayer() {
            if (!supabaseClient) return;

            globalChannel = supabaseClient.channel('global_slither_room_v2', {
                config: { broadcast: { self: false } }
            });

            globalChannel.on('broadcast', { event: 'worm_sync' }, payload => {
                remotePlayers[payload.payload.id] = payload.payload;
            });

            globalChannel.on('broadcast', { event: 'food_eaten' }, payload => {
                // Remove eaten food pellet globally if someone else ate it
                let idx = foodPellets.findIndex(f => f.id === payload.payload.foodId);
                if(idx !== -1) {
                    foodPellets[idx].x = payload.payload.newX;
                    foodPellets[idx].y = payload.payload.newY;
                }
            });

            globalChannel.subscribe(status => {
                if(status === 'SUBSCRIBED') {
                    setInterval(() => {
                        if(!gameActive) return;
                        globalChannel.send({
                            type: 'broadcast',
                            event: 'worm_sync',
                            payload: {
                                id: playerId,
                                name: playerName,
                                x: me.x,
                                y: me.y,
                                trail: me.trail,
                                score: me.score,
                                color: me.color
                            }
                        });
                    }, 50);
                }
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let dx = mouseX - centerX;
            let dy = mouseY - centerY;
            if (Math.hypot(dx, dy) > 5) {
                me.angle = Math.atan2(dy, dx);
            }

            me.x += Math.cos(me.angle) * me.speed;
            me.y += Math.sin(me.angle) * me.speed;

            me.x = Math.max(20, Math.min(WORLD_SIZE - 20, me.x));
            me.y = Math.max(20, Math.min(WORLD_SIZE - 20, me.y));

            // Width scales with score up to a maximum limit
            let currentWidth = Math.min(22, 10 + Math.floor(me.score / 15));

            me.trail.unshift({ x: me.x, y: me.y });
            let maxTrailLength = me.score * 4;
            while(me.trail.length > maxTrailLength) {
                me.trail.pop();
            }

            // Food collision check
            for (let i = 0; i < foodPellets.length; i++) {
                let f = foodPellets[i];
                let dist = Math.hypot(me.x - f.x, me.y - f.y);
                if (dist < currentWidth + 6) {
                    me.score += 1;
                    document.getElementById('scoreDisplay').innerText = me.score;
                    
                    // Reposition food and broadcast to others
                    let newX = Math.random() * WORLD_SIZE;
                    let newY = Math.random() * WORLD_SIZE;
                    f.x = newX;
                    f.y = newY;

                    if(globalChannel) {
                        globalChannel.send({
                            type: 'broadcast',
                            event: 'food_eaten',
                            payload: { foodId: f.id, newX: newX, newY: newY }
                        });
                    }
                }
            }

            // Combat Check: Check if local snake head collides with any remote player's body trail
            for (let id in remotePlayers) {
                let p = remotePlayers[id];
                if (p.trail && p.trail.length > 5) {
                    let remoteWidth = Math.min(22, 10 + Math.floor(p.score / 15));
                    for (let tIdx = 4; tIdx < p.trail.length; tIdx += 2) {
                        let segment = p.trail[tIdx];
                        let hitDist = Math.hypot(me.x - segment.x, me.y - segment.y);
                        if (hitDist < currentWidth + remoteWidth - 4) {
                            // Crash detected! You died.
                            alert("Oops! You crashed into " + p.name + "'s body!");
                            respawnPlayer();
                            break;
                        }
                    }
                }
            }

            // Render Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX - me.x, centerY - me.y);

            // Grid background
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            let gridSize = 80;
            let startX = Math.floor((me.x - centerX) / gridSize) * gridSize;
            let startY = Math.floor((me.y - centerY) / gridSize) * gridSize;
            for (let x = startX; x < startX + canvas.width + gridSize * 2; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, me.y - centerY - 100); ctx.lineTo(x, me.y + centerY + canvas.height); ctx.stroke();
            }
            for (let y = startY; y < startY + canvas.height + gridSize * 2; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(me.x - centerX - 100, y); ctx.lineTo(me.x + centerX + canvas.width, y); ctx.stroke();
            }

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Draw Shared Food Pellets
            foodPellets.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Remote Players (With synchronized width & color)
            for (let id in remotePlayers) {
                let p = remotePlayers[id];
                if (p.trail && p.trail.length > 0) {
                    let rWidth = Math.min(22, 10 + Math.floor(p.score / 15));
                    p.trail.forEach((t) => {
                        ctx.fillStyle = p.color || '#3b82f6';
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, rWidth, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Fredoka';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name + ` (${p.score})`, p.x, p.y - (rWidth + 8));
                }
            }

            // Draw Local Player Body Trail
            me.trail.forEach((t) => {
                ctx.fillStyle = me.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, currentWidth, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Local Head
            ctx.fillStyle = me.color;
            ctx.beginPath();
            ctx.arc(me.x, me.y, currentWidth + 2, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(me.x + Math.cos(me.angle - 0.4) * (currentWidth*0.6), me.y + Math.sin(me.angle - 0.4) * (currentWidth*0.6), 4, 0, Math.PI * 2);
            ctx.arc(me.x + Math.cos(me.angle + 0.4) * (currentWidth*0.6), me.y + Math.sin(me.angle + 0.4) * (currentWidth*0.6), 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            updateLeaderboardUI();
            requestAnimationFrame(gameLoop);
        }

        function updateLeaderboardUI() {
            let allWorms = [{ name: playerName, score: me.score }];
            for(let id in remotePlayers) {
                allWorms.push({ name: remotePlayers[id].name, score: remotePlayers[id].score || 10 });
            }
            allWorms.sort((a,b) => b.score - a.score);

            let html = '';
            allWorms.slice(0, 5).forEach((w, idx) => {
                html += `<div class="flex justify-between"><span>#${idx+1} ${w.name}</span><span class="font-bold text-emerald-400">${w.score}</span></div>`;
            });
            document.getElementById('leaderboardList').innerHTML = html;
        }
    </script>
</body>
</html>
