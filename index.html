<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>hello</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Click to enter overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }

    #overlay span {
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 2vw;
      letter-spacing: 0.3em;
      opacity: 0.4;
    }

    /* ── Center stack (hello + input box) ── */
    #center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* ── Hello text ── */
    #hello {
      color: #fff;
      font-size: 10vw;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.15em;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.2s ease, transform 1.2s ease;
      user-select: none;
    }

    #hello.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Input box wrapper ── */
    #input-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translateY(-120vh);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #input-wrap.slide-in {
      transform: translateY(0);
    }

    #input-wrap.slide-out {
      transform: translateY(120vh);
    }

    #input-box {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 1.1vw;
      padding: 12px 20px;
      width: 420px;
      outline: none;
      letter-spacing: 0.05em;
    }

    #input-box::placeholder {
      color: rgba(255,255,255,0.3);
    }

    #input-tip {
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      font-size: 0.75vw;
      letter-spacing: 0.15em;
    }

    /* ── Image flash ── */
    #flash-img {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }

    #flash-img.pop {
      animation: fadeInOut 1.2s ease forwards;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="overlay"><span>click anywhere</span></div>

  <div id="center">
    <div id="hello">hello</div>
    <div id="input-wrap">
      <input id="input-box" type="text" placeholder="Do not actually write your credit card information" />
      <span id="input-tip">to confirm press enter</span>
    </div>
  </div>

  <img id="flash-img" src="" alt="" />

  <script>
    // ── CONFIG ──────────────────────────────────────────
    const SOUND_FOLDER    = 'sounds/';
    const IMAGE_FOLDER    = 'images/';
    const SOUND_PREFIX    = 'sound';
    const IMAGE_PREFIX    = 'image';
    const SOUND_COUNT     = 10;    // total number of sounds
    const SOUND_GAP_MS    = 500;   // gap between sounds
    const TEXT_DELAY_MS   = 2000;  // delay before hello appears
    const INPUT_AFTER     = 6;     // show input box after this sound number ends
    const INPUT_DELAY_MS  = 4000;  // delay after sound6 ends before box slides in
    // ────────────────────────────────────────────────────

    const helloEl   = document.getElementById('hello');
    const flashImg  = document.getElementById('flash-img');
    const overlay   = document.getElementById('overlay');
    const inputWrap = document.getElementById('input-wrap');
    const inputBox  = document.getElementById('input-box');

    // Preload sounds
    const sounds = [];
    for (let i = 1; i <= SOUND_COUNT; i++) {
      const a = new Audio(`${SOUND_FOLDER}${SOUND_PREFIX}${i}.mp3`);
      a.preload = 'auto';
      sounds.push(a);
    }

    // Show image and fade it out
    function showImage(num) {
      flashImg.src = `${IMAGE_FOLDER}${IMAGE_PREFIX}${num}.png`;
      flashImg.classList.remove('pop');
      void flashImg.offsetWidth;
      flashImg.classList.add('pop');
    }

    // Play sounds in order; pause at INPUT_AFTER for the input box
    function playSoundsInOrder(i = 0) {
      if (i >= sounds.length) return;

      const audio = sounds[i];
      const num   = i + 1;

      audio.play().catch(() => {});

      audio.addEventListener('ended', () => {
        showImage(num);

        if (num === INPUT_AFTER) {
          setTimeout(() => {
            inputWrap.classList.add('slide-in');
            inputBox.focus();

            function onEnter(e) {
              if (e.key === 'Enter' && inputBox.value.trim() !== '') {
                inputBox.removeEventListener('keydown', onEnter);
                inputWrap.classList.remove('slide-in');
                inputWrap.classList.add('slide-out');
                setTimeout(() => playSoundsInOrder(i + 1), 900);
              }
            }
            inputBox.addEventListener('keydown', onEnter);
          }, INPUT_DELAY_MS);

        } else {
          setTimeout(() => playSoundsInOrder(i + 1), SOUND_GAP_MS);
        }
      }, { once: true });

      audio.addEventListener('error', () => {
        setTimeout(() => playSoundsInOrder(i + 1), SOUND_GAP_MS);
      }, { once: true });
    }

    // Click overlay -> remove it -> wait -> hello + sounds start
    overlay.addEventListener('click', () => {
      overlay.remove();
      setTimeout(() => {
        helloEl.classList.add('visible');
        playSoundsInOrder();
      }, TEXT_DELAY_MS);
    });
  </script>
</body>
</html>
