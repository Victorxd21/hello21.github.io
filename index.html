<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Pro Chat with AI, Voice & Reactions</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Marked.js for Markdown parsing & Highlight.js for code blocks -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="setupScreen" class="setup-overlay">
        <div class="setup-box">
            <h2 id="authTitle" style="color: white; margin-top: 0; text-align: center;">Welcome Back</h2>
            <div id="authErrorBanner" class="error-banner"></div>
            <div class="tab-toggles">
                <button type="button" id="signinTabBtn" class="tab-btn active" onclick="switchAuthMode('signin')">Sign In</button>
                <button type="button" id="signupTabBtn" class="tab-btn" onclick="switchAuthMode('signup')">Sign Up</button>
            </div>
            <input type="text" id="usernameInput" placeholder="Username..." onkeypress="checkAuthEnter(event)">
            <input type="password" id="passwordInput" placeholder="Password..." onkeypress="checkAuthEnter(event)">
            <div id="signupAvatarSection" class="hidden" style="display: flex; flex-direction: column; gap: 5px;">
                <div style="font-size: 13px; color: #949ba4;">Profile Picture (Optional):</div>
                <input type="file" id="avatarFileInput" accept="image/*" style="background: #383a40; color: #dbdee1; padding: 8px; font-size: 12px;">
            </div>
            <button type="button" class="send-btn" id="authSubmitBtn" onclick="handleAuth()">Sign In</button>
        </div>
    </div>

    <!-- PROFILE SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: white; margin-top: 0;">User Settings</h2>
            <div id="settingsErrorBanner" class="error-banner"></div>
            <div style="font-size: 13px; color: #949ba4;">Change Display Name:</div>
            <input type="text" id="settingsUsernameInput" placeholder="New username...">
            <div style="font-size: 13px; color: #949ba4;">Change Profile Picture:</div>
            <input type="file" id="settingsAvatarInput" accept="image/*" style="background: #383a40; color: #dbdee1; padding: 8px; font-size: 12px;">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" class="send-btn" style="flex: 1; background: #248046;" onclick="saveProfileSettings()">Save Changes</button>
                <button type="button" class="send-btn" style="flex: 1; background: #4e5058;" onclick="toggleSettingsModal(false)">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ADMIN MANAGEMENT MODAL -->
    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal-box" style="width: 420px;">
            <h2 style="color: white; margin-top: 0;">🛡️ Owner & Admin Control Panel</h2>
            <div id="adminModalError" class="error-banner"></div>
            <div style="font-size: 13px; color: #949ba4;">Select User to Manage:</div>
            <select id="adminTargetUserSelect" style="background: #383a40; color: white; padding: 10px; border-radius: 4px; border: none;" onchange="loadTargetUserData()">
                <option value="">-- Choose User --</option>
            </select>
            <div style="font-size: 13px; color: #949ba4; margin-top: 5px;">New Display Name:</div>
            <input type="text" id="adminNewUsernameInput" placeholder="New username...">
            <div style="font-size: 13px; color: #949ba4; margin-top: 5px;">Reset Password:</div>
            <input type="password" id="adminNewPasswordInput" placeholder="New password (leave blank)...">
            <div style="font-size: 13px; color: #949ba4; margin-top: 5px;">Custom Role Badge:</div>
            <input type="text" id="adminRoleInput" placeholder="e.g., VIP, Mod, Developer...">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" class="send-btn" style="flex: 1; background: #248046;" onclick="adminSaveUserChanges()">Save</button>
                <button type="button" class="send-btn" style="flex: 1; background: #da373c;" onclick="adminDeleteUser()">Delete</button>
                <button type="button" class="send-btn" style="flex: 1; background: #4e5058;" onclick="toggleAdminModal(false)">Close</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appContainer" class="app-container hidden">
        <!-- Sidebar Channels & DMs -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>💬 Community</span>
            </div>
            <div id="channelList" class="channel-list">
                <div class="section-title">Channels</div>
                <div id="publicChannelsContainer"></div>
                <div class="section-title" style="margin-top: 10px;">Direct Messages</div>
                <div id="dmChannelsContainer"></div>
            </div>

            <div id="adminSidebarPanel" class="admin-sidebar-panel hidden">
                <span style="font-size: 11px; font-weight: bold; color: #f2ba33;" id="panelTitleLabel">ADMIN CONTROLS</span>
                <input type="text" id="newChannelInput" placeholder="New channel name..." onkeypress="checkChannelEnter(event)">
                <button type="button" onclick="createChannel()">+ Create Channel</button>
                <button type="button" style="background: #5865f2;" onclick="toggleAdminModal(true)">⚙️ Manage Users</button>
            </div>

            <div class="user-panel">
                <div class="user-info-pill">
                    <div id="sidebarUserAvatarContainer"></div>
                    <div style="display: flex; flex-direction: column; overflow: hidden;">
                        <span id="sidebarUserName" style="font-size: 13px; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
                        <span style="font-size: 11px; color: #23a55a;">Online</span>
                    </div>
                </div>
                <button type="button" class="settings-gear-btn" title="User Settings" onclick="toggleSettingsModal(true)">⚙️</button>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-main">
            <div class="chat-header">
                <span id="currentChannelTitle"># general</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="searchInput" placeholder="Search messages..." oninput="handleSearchInput()" style="padding: 6px 12px; font-size: 13px; width: 200px;">
                </div>
            </div>

            <div id="chat-box"></div>

            <div class="controls">
                <div id="typingIndicator" class="typing-indicator"></div>
                <div class="controls-row">
                    <label class="file-upload-btn" title="Upload Image">
                        📁 <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImageMessage(event)">
                    </label>
                    <button type="button" id="recordVoiceBtn" class="file-upload-btn" title="Record Voice Note" onclick="toggleVoiceRecording()">🎤</button>
                    <input type="text" id="messageInput" placeholder="Type Markdown, paste image link, or @AI... (/announcement [text])" oninput="handleTypingInput()" onkeypress="checkMessageEnter(event)">
                    <button type="button" class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <!-- Online Members Sidebar -->
        <div class="members-sidebar" id="membersList">
            <h4 style="font-size: 12px; color: #949ba4; margin: 0 0 8px 0;">ONLINE — 0</h4>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
