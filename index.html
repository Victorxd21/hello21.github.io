<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #25254a 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #171735 0%, transparent 40%),
                #080810;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        header {
            position: relative;
            padding: 60px 24px 40px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(120, 120, 255, 0.12);
            border: 1px solid rgba(140, 140, 255, 0.25);
            color: #aaaaff;
            font-size: 13px;
            margin-bottom: 18px;
        }
        h1 {
            font-size: clamp(40px, 7vw, 72px);
            font-weight: 900;
            letter-spacing: -3px;
            background: linear-gradient(90deg, #ffffff, #aaaaff, #ffffff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 5s linear infinite;
        }
        @keyframes gradient {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }
        .subtitle {
            margin-top: 12px;
            color: #89899a;
            font-size: 15px;
        }
        main {
            position: relative;
            width: min(1100px, calc(100% - 32px));
            margin: auto;
            padding-bottom: 70px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        .games-count { color: #858597; font-size: 14px; }
        .refresh {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .refresh:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        .category { margin-bottom: 40px; }
        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .category-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #6d5dfc, #9b8cff);
            box-shadow: 0 8px 24px rgba(109, 93, 252, 0.25);
            font-size: 17px;
        }
        .category-name {
            font-size: 20px;
            font-weight: 800;
            text-transform: capitalize;
        }
        .category-count {
            color: #666677;
            font-size: 12px;
            margin-left: 4px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .game {
            position: relative;
            min-height: 130px;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.09);
            background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(14px);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .game::before {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            background: #6d5dfc;
            filter: blur(80px);
            opacity: 0;
            top: -70px;
            right: -70px;
            transition: 0.3s;
        }
        .game:hover {
            transform: translateY(-4px);
            border-color: rgba(140,140,255,0.45);
            box-shadow: 0 14px 36px rgba(0,0,0,0.35), 0 0 0 1px rgba(140,140,255,0.12);
        }
        .game:hover::before { opacity: 0.28; }
        .game-icon {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6d5dfc, #9b8cff);
            font-size: 20px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(109, 93, 252, 0.25);
        }
        .game-name {
            position: relative;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .game-file {
            position: relative;
            color: #777789;
            font-size: 11px;
            word-break: break-word;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #777789;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: #8b7cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            padding: 28px;
            border-radius: 14px;
            background: rgba(255,70,70,0.08);
            border: 1px solid rgba(255,70,70,0.2);
            color: #ff9b9b;
            text-align: center;
        }
        footer {
            position: relative;
            text-align: center;
            color: #555566;
            font-size: 12px;
            padding: 28px;
        }
        @media (max-width: 600px) {
            header { padding-top: 40px; }
            h1 { letter-spacing: -2px; }
            .games-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header>
    <div class="badge">🎮 GITHUB GAME HUB</div>
    <h1>GAME HUB</h1>
    <p class="subtitle">Pick a game and start playing.</p>
</header>
<main>
    <div class="topbar">
        <div class="games-count" id="gameCount">Loading games...</div>
        <button class="refresh" onclick="loadGames()">↻ Refresh</button>
    </div>
    <div id="games">
        <div class="loading"><div class="spinner"></div>Loading games...</div>
    </div>
</main>
<footer>Games are loaded automatically from the <b>/games</b> folder.</footer>
<script>
const HIDDEN_FOLDERS = new Set(["heads", "images", "sounds", "assets"]);
const HIDDEN_ROOT_FILES = new Set(["test.html"]);

async function loadGames() {
    const gamesContainer = document.getElementById("games");
    const gameCount = document.getElementById("gameCount");
    gamesContainer.innerHTML = `<div class="loading"><div class="spinner"></div>Loading games...</div>`;
    gameCount.textContent = "Loading games...";

    try {
        const hostname = window.location.hostname;
        const pathname = window.location.pathname;
        let owner, repo;

        if (hostname.endsWith(".github.io")) {
            owner = hostname.split(".")[0];
            const parts = pathname.split("/").filter(Boolean);
            repo = parts[0] || `${owner}.github.io`;
        } else {
            owner = "Victorxd21";
            repo = "hello21.github.io";
        }

        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`);
        if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
        const files = await response.json();

        const rootGames = files.filter(f =>
            f.type === "file" &&
            f.name.toLowerCase().endsWith(".html") &&
            !HIDDEN_ROOT_FILES.has(f.name.toLowerCase())
        );

        const folders = files.filter(f =>
            f.type === "dir" && !HIDDEN_FOLDERS.has(f.name.toLowerCase())
        );

        let totalGames = rootGames.length;
        const categories = [];

        if (rootGames.length > 0) {
            categories.push({ name: "Games", icon: "🎮", games: rootGames });
        }

        for (const folder of folders) {
            try {
                const folderResponse = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/games/${encodeURIComponent(folder.name)}`
                );
                if (!folderResponse.ok) continue;
                const folderFiles = await folderResponse.json();
                const folderGames = folderFiles.filter(f =>
                    f.type === "file" && f.name.toLowerCase().endsWith(".html")
                );
                if (folderGames.length === 0) continue;
                totalGames += folderGames.length;
                categories.push({
                    name: folder.name,
                    icon: getCategoryIcon(folder.name),
                    games: folderGames,
                    folder: folder.name
                });
            } catch (e) {
                console.error(e);
            }
        }

        if (totalGames === 0) {
            gamesContainer.innerHTML = `<div class="loading"><div style="font-size:40px;margin-bottom:12px">🎮</div><div>No games found.</div></div>`;
            gameCount.textContent = "0 games";
            return;
        }

        gameCount.textContent = `${totalGames} game${totalGames === 1 ? "" : "s"}`;

        categories.sort((a, b) => {
            if (a.name === "Games") return -1;
            if (b.name === "Games") return 1;
            return a.name.localeCompare(b.name);
        });

        gamesContainer.innerHTML = "";
        for (const category of categories) {
            gamesContainer.appendChild(createCategory(category));
        }
    } catch (error) {
        console.error(error);
        gamesContainer.innerHTML = `<div class="error">Failed to load games.<br><small>${escapeHTML(String(error.message || error))}</small></div>`;
        gameCount.textContent = "Error";
    }
}

function createCategory(category) {
    const section = document.createElement("div");
    section.className = "category";

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `
        <div class="category-icon">${category.icon}</div>
        <div class="category-name">${escapeHTML(formatName(category.name))}<span class="category-count">(${category.games.length})</span></div>
    `;

    const grid = document.createElement("div");
    grid.className = "games-grid";

    const sorted = [...category.games].sort((a, b) => a.name.localeCompare(b.name));
    sorted.forEach(file => grid.appendChild(createGameCard(file, category.folder)));

    section.appendChild(header);
    section.appendChild(grid);
    return section;
}

function createGameCard(file, folder) {
    const card = document.createElement("div");
    card.className = "game";

    let gameName = file.name.replace(/\.html$/i, "").replace(/[-_]/g, " ");
    if (folder && file.name.toLowerCase() === "index.html") {
        gameName = folder.replace(/[-_]/g, " ");
    }
    gameName = formatName(gameName);

    const displayPath = folder ? `${folder}/${file.name}` : file.name;
    const icon = getGameIcon(gameName, folder);

    card.innerHTML = `
        <div class="game-icon">${icon}</div>
        <div class="game-name">${escapeHTML(gameName)}</div>
        <div class="game-file">${escapeHTML(displayPath)}</div>
    `;

    card.onclick = () => {
        window.location.href = getGameURL(file, folder);
    };

    return card;
}

function getGameURL(file, folder) {
    const currentURL = new URL(window.location.href);
    let basePath = currentURL.pathname;
    if (basePath.endsWith("index.html")) basePath = basePath.slice(0, -10);
    if (!basePath.endsWith("/")) basePath += "/";

    let gamePath;
    if (folder) {
        gamePath = `games/${encodeURIComponent(folder)}/${encodeURIComponent(file.name)}`;
    } else {
        gamePath = `games/${encodeURIComponent(file.name)}`;
    }
    return new URL(gamePath, currentURL.origin + basePath).href;
}

function formatName(name) {
    const cleaned = name.replace(/[-_]/g, " ").replace(/\s+/g, " ").trim();
    const aliases = {
        "agar io": "Agar.io",
        "agario": "Agar.io",
        "slither io": "Slither.io",
        "slitherio": "Slither.io",
        "cat up": "Cat UP",
        "catup": "Cat UP",
        "gartic": "Gartic Phone",
        "garticphone": "Gartic Phone",
        "royale": "Battle Royale",
        "werewolf": "Werewolf"
    };
    const key = cleaned.toLowerCase();
    if (aliases[key]) return aliases[key];
    return cleaned.replace(/\b\w/g, c => c.toUpperCase());
}

function getGameIcon(gameName, folder) {
    const n = (gameName + " " + (folder || "")).toLowerCase();
    if (n.includes("slither")) return "🐍";
    if (n.includes("snake")) return "🟩";
    if (n.includes("agar")) return "🟡";
    if (n.includes("royale") || n.includes("battle")) return "⚔️";
    if (n.includes("werewolf") || n.includes("wolf")) return "🐺";
    if (n.includes("cat")) return "🐱";
    if (n.includes("gartic") || n.includes("draw")) return "✏️";
    if (n.includes("phone")) return "📱";
    return "🎮";
}

function getCategoryIcon(folderName) {
    const name = folderName.toLowerCase();
    if (name.includes("horror")) return "👻";
    if (name.includes("action")) return "⚔️";
    if (name.includes("arcade")) return "🕹️";
    if (name.includes("cat")) return "🐱";
    if (name.includes("gartic") || name.includes("draw")) return "✏️";
    if (name.includes("slither")) return "🐍";
    if (name.includes("puzzle")) return "🧩";
    return "📁";
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

loadGames();
</script>
</body>
</html>
