<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#080810;color:#fff;min-height:100vh;overflow-x:hidden}#bgLayer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.35}#bgOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(37,37,74,.5),transparent 40%),radial-gradient(circle at 80% 80%,rgba(23,23,53,.8),transparent 50%)}body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px}.content{position:relative;z-index:3}.hero{text-align:center;padding:72px 20px 28px}.hero h1{font-size:clamp(32px,6vw,52px);font-weight:900;background:linear-gradient(135deg,#fff 20%,#9b8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:#8b8b9e;margin-top:10px}.toolbar{display:flex;gap:12px;justify-content:center;align-items:center;padding:0 20px 24px}.games-count{color:#858597}.refresh{padding:8px 14px;border-radius:10px;border:1px solid #ffffff1f;background:#ffffff0f;color:#c4b5fd;cursor:pointer}#games{max-width:1100px;margin:auto;padding:0 20px 60px}.category{margin-bottom:32px}.category-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}.category-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#9b8cff);font-size:18px}.category-name{font-size:18px;font-weight:700}.category-count{color:#6b6b80;font-size:13px;margin-left:6px}.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.game{min-height:130px;padding:20px;border-radius:18px;border:1px solid #ffffff17;background:linear-gradient(160deg,#ffffff12,#ffffff08);backdrop-filter:blur(8px);cursor:pointer;transition:.3s}.game:hover{transform:translateY(-4px);border-color:#8c8cff73;box-shadow:0 14px 36px #00000059}.game-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#9b8cff);font-size:20px;margin-bottom:12px}.game-icon img{width:100%;height:100%;object-fit:cover}.game.has-art{padding:0;min-height:160px;display:flex;flex-direction:column}.game-banner{width:100%;height:88px;background:#ffffff0a center/cover;border-radius:18px 18px 0 0}.game-body{padding:12px 16px 16px;display:flex;gap:12px;align-items:center}.game.has-art .game-icon{margin:0;width:48px;height:48px}.game-meta{flex:1;min-width:0}.game-name{font-size:17px;font-weight:700;margin-bottom:6px}.game-file{color:#777789;font-size:11px}.loading,.error{text-align:center;padding:40px;color:#8b8b9e}.spinner{width:32px;height:32px;border:3px solid #ffffff1a;border-top-color:#9b8cff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;padding:20px;color:#555;font-size:12px}
</style></head><body><div id="bgLayer"></div><div id="bgOverlay"></div><div class="content"><header class="hero"><h1>Game Hub</h1><p>Pick a game and play</p></header><div class="toolbar"><div class="games-count" id="gameCount">Loading games...</div><button class="refresh" onclick="loadGames()">↻ Refresh</button></div><main id="games"><div class="loading"><div class="spinner"></div>Loading games...</div></main><footer>Games load from the <b>/games</b> folder.</footer></div><script src="game-art/data.js"></script><script>
const HIDDEN_FOLDERS=new Set(['heads','game-art','images','sounds','assets','pics','music']);const HIDDEN_ROOT_FILES=new Set(['test.html','test.txt']);
const escapeHTML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const formatName=n=>n.replace(/\b\w/g,c=>c.toUpperCase());
function getRepoInfo(){const h=location.hostname;if(h.endsWith('.github.io')){const owner=h.split('.')[0],parts=location.pathname.split('/').filter(Boolean).filter(p=>p.toLowerCase()!=='index.html');return{owner,repo:parts[0]||owner+'.github.io'}}return{owner:'Victorxd21',repo:'hello21.github.io'}}
async function loadGames(){const out=document.getElementById('games'),count=document.getElementById('gameCount');out.innerHTML='<div class="loading"><div class="spinner"></div>Loading games...</div>';try{let{owner,repo}=getRepoInfo(),r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`);if(!r.ok){owner='Victorxd21';repo='hello21.github.io';r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`)}if(!r.ok)throw Error('GitHub API '+r.status);const items=await r.json(),categories=[],root=[];for(const item of items){if(item.type==='file'&&/\.html$/i.test(item.name)&&!HIDDEN_ROOT_FILES.has(item.name.toLowerCase()))root.push(item);if(item.type==='dir'&&!HIDDEN_FOLDERS.has(item.name.toLowerCase())){const fr=await fetch(item.url);if(!fr.ok)continue;const files=await fr.json();const games=files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name));if(games.length)categories.push({name:item.name,folder:item.name,icon:getCategoryIcon(item.name),games})}}if(root.length)categories.unshift({name:'Games',folder:null,icon:'🎮',games:root});const total=categories.reduce((n,c)=>n+c.games.length,0);count.textContent=total+' game'+(total===1?'':'s');categories.sort((a,b)=>a.name==='Games'?-1:b.name==='Games'?1:a.name.localeCompare(b.name));out.innerHTML='';categories.forEach(c=>out.appendChild(createCategory(c)))}catch(e){out.innerHTML=`<div class="error">Failed to load games.<br><small>${escapeHTML(e.message)}</small></div>`;count.textContent='Error'}}
function createCategory(c){const section=document.createElement('section');section.className='category';section.innerHTML=`<div class="category-header"><div class="category-icon">${c.icon}</div><div class="category-name">${escapeHTML(formatName(c.name))}<span class="category-count">(${c.games.length})</span></div></div><div class="games-grid"></div>`;const grid=section.querySelector('.games-grid');c.games.sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>grid.appendChild(createGameCard(f,c.folder)));return section}
function createGameCard(file,folder){const card=document.createElement('div');card.className='game';let name=file.name.replace(/\.html$/i,'').replace(/[-_]/g,' ');if(folder&&file.name.toLowerCase()==='index.html')name=folder.replace(/[-_]/g,' ');name=formatName(name);const path=folder?folder+'/'+file.name:file.name,icon=getGameIcon(name,folder),key=(folder||name).toLowerCase().replace(/\s+/g,'-'),art=window.GAME_ART?.[folder]||window.GAME_ART?.[key],banner=art?.b||art?.banner,profile=art?.p||art?.profile;if(banner){card.classList.add('has-art');card.innerHTML=`<div class="game-banner" style="background-image:url('${banner}')"></div><div class="game-body"><div class="game-icon">${profile?`<img src="${profile}" alt="">`:icon}</div><div class="game-meta"><div class="game-name">${escapeHTML(name)}</div><div class="game-file">${escapeHTML(path)}</div></div></div>`}else card.innerHTML=`<div class="game-icon">${icon}</div><div class="game-name">${escapeHTML(name)}</div><div class="game-file">${escapeHTML(path)}</div>`;card.onclick=()=>{let base=location.href.split('#')[0];if(base.endsWith('index.html'))base=base.slice(0,-10);if(!base.endsWith('/'))base+='/';location.href=new URL(`games/${folder?encodeURIComponent(folder)+'/':''}${encodeURIComponent(file.name)}`,location.origin+base)};return card}
function getGameIcon(name,folder){const n=(name+' '+(folder||'')).toLowerCase();if(n.includes('voxel')||n.includes('world'))return'🧱';if(n.includes('jetpack')||n.includes('joyride'))return'🚀';if(n.includes('slither'))return'🐍';if(n.includes('snake'))return'🟩';if(n.includes('royale')||n.includes('battle'))return'⚔️';if(n.includes('werewolf')||n.includes('wolf'))return'🐺';if(n.includes('cat'))return'🐱';if(n.includes('gartic')||n.includes('draw'))return'✏️';if(n.includes('earth'))return'🌍';if(n.includes('storm'))return'⛈️';return'🎮'}function getCategoryIcon(n){return getGameIcon(n,n)}loadGames();
</script></body></html>
