<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>hello</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #hello {
      color: #fff;
      font-size: 10vw;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.15em;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 1s ease, transform 1s ease;
      user-select: none;
    }

    #hello.visible {
      opacity: 1;
      transform: scale(1);
    }

    #flash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    #flash img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    #flash.show {
      animation: flashAnim 0.6s ease forwards;
    }

    @keyframes flashAnim {
      0%   { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }

    #overlay span {
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 2vw;
      letter-spacing: 0.2em;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div id="overlay"><span>click anywhere</span></div>
  <div id="hello">hello</div>
  <div id="flash"><img id="flash-img" src="" alt="" /></div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    const SOUND_FOLDER  = 'sounds/';   // folder relative to index.html
    const IMAGE_FOLDER  = 'images/';   // folder relative to index.html
    const SOUND_PREFIX  = 'sound';     // files: sound1.mp3, sound2.mp3 …
    const IMAGE_PREFIX  = 'image';     // files: image1.png, image2.png …
    const SOUND_COUNT   = 10;          // how many sound/image files you have
    const SOUND_GAP_MS  = 500;         // 0.5 s gap between sounds
    const TEXT_DELAY_MS = 2000;        // 2 s before text appears
    // ────────────────────────────────────────────────────────

    const flashEl  = document.getElementById('flash');
    const flashImg = document.getElementById('flash-img');

    // Pre-load all audio objects
    const sounds = [];
    for (let i = 1; i <= SOUND_COUNT; i++) {
      const audio = new Audio(`${SOUND_FOLDER}${SOUND_PREFIX}${i}.mp3`);
      audio.preload = 'auto';
      sounds.push(audio);
    }

    // Flash the matching image on screen
    function flashImage(index) {
      flashImg.src = `${IMAGE_FOLDER}${IMAGE_PREFIX}${index}.png`;
      flashEl.classList.remove('show');
      // Force reflow so the animation restarts if it's already playing
      void flashEl.offsetWidth;
      flashEl.classList.add('show');
    }

    // Play sounds one by one; flash matching image when each one ends
    function playSoundsInOrder(index = 0) {
      if (index >= sounds.length) return;

      const audio    = sounds[index];
      const soundNum = index + 1; // sound1, sound2 …

      audio.play().catch(() => {});

      audio.onended = () => {
        flashImage(soundNum);
        setTimeout(() => playSoundsInOrder(index + 1), SOUND_GAP_MS);
      };

      audio.onerror = () => {
        setTimeout(() => playSoundsInOrder(index + 1), SOUND_GAP_MS);
      };
    }

    // Sequence: wait → show text → play sounds
    setTimeout(() => {
      document.getElementById('hello').classList.add('visible');
      playSoundsInOrder();
    }, TEXT_DELAY_MS);
  </script>
</body>
</html>
