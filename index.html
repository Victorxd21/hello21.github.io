<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#080810;color:#fff;min-height:100vh;overflow-x:hidden}
#bgLayer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;transition:opacity 1.2s ease;opacity:.35}
#bgOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(37,37,74,.5) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(23,23,53,.8) 0%,transparent 60%)}
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:50px 50px}
.content{position:relative;z-index:3}
#settingsBtn{position:fixed;top:16px;left:16px;z-index:50;width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}
.hero{text-align:center;padding:72px 20px 28px}
.hero h1{font-size:clamp(32px,6vw,52px);font-weight:900;background:linear-gradient(135deg,#fff 20%,#9b8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:#8b8b9e;margin-top:10px;font-size:15px}
.toolbar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 20px 24px}
.games-count{color:#858597;font-size:14px}
.refresh{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#c4b5fd;cursor:pointer;font-size:13px}
#games{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.category{margin-bottom:32px}
.category-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.category-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6d5dfc,#9b8cff);font-size:18px}
.category-name{font-size:18px;font-weight:700}
.category-count{color:#6b6b80;font-size:13px;margin-left:6px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.game{position:relative;min-height:130px;padding:20px;border-radius:18px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));backdrop-filter:blur(12px);cursor:pointer;transition:all .3s ease}
.game:hover{transform:translateY(-4px);border-color:rgba(140,140,255,.45);box-shadow:0 14px 36px rgba(0,0,0,.35)}
.game-icon{position:relative;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6d5dfc,#9b8cff);font-size:20px;margin-bottom:14px}
.game-icon img{width:100%;height:100%;object-fit:cover;display:block}
.game.has-art{padding:0;min-height:160px;display:flex;flex-direction:column}
.game-banner{width:100%;height:88px;background:rgba(255,255,255,.04) center/cover no-repeat;border-radius:18px 18px 0 0;position:relative}
.game-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,16,.85),transparent 70%);border-radius:18px 18px 0 0;pointer-events:none}
.game-body{padding:12px 16px 16px;display:flex;gap:12px;align-items:center;position:relative}
.game.has-art .game-icon{margin-bottom:0;width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.15);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.game.has-art .game-name{margin-bottom:2px}
.game.has-art .game-meta{flex:1;min-width:0}
.game-name{position:relative;font-size:17px;font-weight:700;margin-bottom:6px}
.game-file{position:relative;color:#777789;font-size:11px}
.loading,.error{text-align:center;padding:40px;color:#8b8b9e}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:#9b8cff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:20px;color:#555;font-size:12px}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgOverlay"></div>
<div class="content">
<button id="settingsBtn" title="Settings">⚙️</button>
<header class="hero">
  <h1>Game Hub</h1>
  <p>Pick a game and play</p>
</header>
<div class="toolbar">
  <div class="games-count" id="gameCount">Loading games...</div>
  <button class="refresh" onclick="loadGames()">↻ Refresh</button>
</div>
<main id="games"><div class="loading"><div class="spinner"></div>Loading games...</div></main>
<footer>Games load from the <b>/games</b> folder.</footer>
</div>
<audio id="bgMusic" preload="auto"></audio>
<script src="game-art/data.js"></script>
<script>
const HIDDEN_FOLDERS=new Set(["heads","game-art","images","sounds","assets","pics","music"]);
const HIDDEN_ROOT_FILES=new Set(["test.html"]);
function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function formatName(n){return n.replace(/\b\w/g,c=>c.toUpperCase())}
function getRepoInfo(){
  const h=location.hostname;
  if(h.endsWith(".github.io")){
    const owner=h.split(".")[0];
    const parts=location.pathname.split("/").filter(Boolean).filter(p=>p.toLowerCase()!=="index.html");
    let repo=owner+".github.io";
    if(parts[0]) repo=parts[0];
    return{owner,repo};
  }
  return{owner:"Victorxd21",repo:"hello21.github.io"};
}
async function loadGames(){
  const gamesContainer=document.getElementById("games"),gameCount=document.getElementById("gameCount");
  gamesContainer.innerHTML=`<div class="loading"><div class="spinner"></div>Loading games...</div>`;
  gameCount.textContent="Loading games...";
  try{
    let {owner,repo}=getRepoInfo();
    let response=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`);
    if(!response.ok){
      owner="Victorxd21";
      repo="hello21.github.io";
      response=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`);
    }
    if(!response.ok) throw new Error("GitHub API "+response.status);
    const items=await response.json();
    const categories=[];
    const rootGames=[];
    for(const item of items){
      if(item.type==="file"&&/\.html$/i.test(item.name)&&!HIDDEN_ROOT_FILES.has(item.name.toLowerCase())) rootGames.push(item);
      if(item.type==="dir"&&!HIDDEN_FOLDERS.has(item.name.toLowerCase())){
        try{
          const fr=await fetch(item.url);
          if(!fr.ok) continue;
          const files=await fr.json();
          const games=files.filter(f=>f.type==="file"&&(/\.html$/i.test(f.name)));
          if(games.length) categories.push({name:item.name,folder:item.name,icon:getCategoryIcon(item.name),games});
        }catch(e){}
      }
    }
    if(rootGames.length) categories.unshift({name:"Games",folder:null,icon:"🎮",games:rootGames});
    const total=categories.reduce((s,c)=>s+c.games.length,0);
    gameCount.textContent=total+" game"+(total===1?"":"s");
    categories.sort((a,b)=>a.name==="Games"?-1:b.name==="Games"?1:a.name.localeCompare(b.name));
    gamesContainer.innerHTML="";
    for(const c of categories) gamesContainer.appendChild(createCategory(c));
  }catch(error){
    gamesContainer.innerHTML=`<div class="error">Failed to load games.<br><small>${escapeHTML(String(error.message||error))}</small></div>`;
    gameCount.textContent="Error";
  }
}
function createCategory(category){
  const section=document.createElement("div");
  section.className="category";
  const header=document.createElement("div");
  header.className="category-header";
  header.innerHTML=`<div class="category-icon">${category.icon}</div><div class="category-name">${escapeHTML(formatName(category.name))}<span class="category-count">(${category.games.length})</span></div>`;
  const grid=document.createElement("div");
  grid.className="games-grid";
  [...category.games].sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>grid.appendChild(createGameCard(f,category.folder)));
  section.appendChild(header);
  section.appendChild(grid);
  return section;
}
function getArtKey(gameName,folder){
  const raw=(folder||gameName||"").toLowerCase().replace(/\.html$/i,"").replace(/\s+/g,"-");
  const aliases={"slither-io":"slitherIO","slitherio":"slitherIO","gartic-phone":"garticphone","liveearth":"live-earth","stormchaser":"storm-chaser","catgame":"cat-game","jetpack-joyride":"jetpack-joyride","voxel-world":"voxel-world"};
  if(folder&&window.GAME_ART&&window.GAME_ART[folder]) return folder;
  if(aliases[raw]) return aliases[raw];
  if(window.GAME_ART&&window.GAME_ART[raw]) return raw;
  const keys=window.GAME_ART?Object.keys(window.GAME_ART):[];
  for(const k of keys){ if(raw.includes(k.toLowerCase())||k.toLowerCase().includes(raw)) return k; }
  return folder||raw;
}
function artUrl(key,kind){
  if(!key) return null;
  if(window.GAME_ART&&window.GAME_ART[key]){
    const o=window.GAME_ART[key];
    const url=kind==="banner"?(o.b||o.banner):(o.p||o.profile);
    if(url) return url;
  }
  const base="game-art/"+encodeURIComponent(key)+"/";
  return base+(kind==="banner"?"banner.svg":"profile.svg");
}
function createGameCard(file,folder){
  const card=document.createElement("div");
  card.className="game";
  let gameName=file.name.replace(/\.html$/i,"").replace(/[-_]/g," ");
  if(folder&&file.name.toLowerCase()==="index.html") gameName=folder.replace(/[-_]/g," ");
  gameName=formatName(gameName);
  const displayPath=folder?folder+"/"+file.name:file.name;
  const artKey=getArtKey(gameName,folder);
  const banner=artUrl(artKey,"banner");
  const profile=artUrl(artKey,"profile");
  const iconHtml=profile?`<img src="${profile}" alt="" loading="lazy" onerror="this.remove()">`:getGameIcon(gameName,folder);
  if(banner){
    card.classList.add("has-art");
    card.innerHTML=`<div class="game-banner" style="background-image:url('${banner}')"></div><div class="game-body"><div class="game-icon">${iconHtml}</div><div class="game-meta"><div class="game-name">${escapeHTML(gameName)}</div><div class="game-file">${escapeHTML(displayPath)}</div></div></div>`;
  }else{
    card.innerHTML=`<div class="game-icon">${iconHtml}</div><div class="game-name">${escapeHTML(gameName)}</div><div class="game-file">${escapeHTML(displayPath)}</div>`;
  }
  card.onclick=()=>{location.href=getGameURL(file,folder)};
  return card;
}
function getGameURL(file,folder){
  const u=new URL(location.href);
  let base=u.pathname;
  if(base.endsWith("index.html")) base=base.slice(0,-10);
  if(!base.endsWith("/")) base+="/";
  const path=folder?`games/${encodeURIComponent(folder)}/${encodeURIComponent(file.name)}`:`games/${encodeURIComponent(file.name)}`;
  return new URL(path,u.origin+base).href;
}
function getGameIcon(gameName,folder){
  const n=(gameName+" "+(folder||"")).toLowerCase();
  if(n.includes("voxel")||n.includes("world")) return "🧱";
  if(n.includes("jetpack")||n.includes("joyride")) return "✈️";
  if(n.includes("slither"))return"🐍";
  if(n.includes("snake"))return"🟩";
  if(n.includes("royale")||n.includes("battle"))return"⚔️";
  if(n.includes("werewolf")||n.includes("wolf"))return"🐺";
  if(n.includes("cat"))return"🐱";
  if(n.includes("gartic")||n.includes("draw"))return"✏️";
  if(n.includes("earth"))return"🌍";
  if(n.includes("storm"))return"⛈️";
  return"🎮";
}
function getCategoryIcon(folderName){
  const n=folderName.toLowerCase();
  if(n.includes("voxel")||n.includes("world")) return "🧱";
  if(n.includes("jetpack")||n.includes("joyride")) return "✈️";
  if(n.includes("cat"))return"🐱";
  if(n.includes("gartic")||n.includes("draw"))return"✏️";
  if(n.includes("slither"))return"🐍";
  if(n.includes("earth"))return"🌍";
  if(n.includes("storm"))return"⛈️";
  return"📁";
}
loadGames();
</script>
</body>
</html>
