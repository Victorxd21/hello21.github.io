<body>

<header>

    <div class="badge">
        🎮 GITHUB GAME HUB
    </div>

    <h1>
        GAME HUB
    </h1>

    <p class="subtitle">
        Pick a game and start playing.
    </p>

</header>

<main>

    <div class="topbar">

        <div
            class="games-count"
            id="gameCount"
        >
            Loading games...
        </div>

        <button
            class="refresh"
            onclick="loadGames()"
        >
            ↻ Refresh
        </button>

    </div>

    <div id="games">

        <div class="loading">

            <div class="spinner"></div>

            Loading games...

        </div>

    </div>

</main>

<footer>

    Games are loaded automatically from
    the <b>/games</b> folder.

</footer>


<script>

/*
============================================================
GITHUB GAME HUB
============================================================

Supported structure:

games/
│
├── game1.html
├── game2.html
│
├── cat-game/
│   └── index.html
│
└── horror/
    ├── maze.html
    └── night.html

Root HTML files appear under "Games".

Folders become categories.

HTML files inside folders become games
inside that category.
============================================================
*/


async function loadGames() {

    const gamesContainer =
        document.getElementById("games");

    const gameCount =
        document.getElementById("gameCount");


    gamesContainer.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Loading games...

        </div>
    `;

    gameCount.textContent =
        "Loading games...";


    try {

        /*
        ================================================
        FIGURE OUT GITHUB OWNER + REPOSITORY
        ================================================
        */

        const hostname =
            window.location.hostname;

        const pathname =
            window.location.pathname;


        let owner;
        let repo;


        /*
        Normal GitHub Pages:

        username.github.io/repository/
        */

        if (
            hostname.endsWith(".github.io")
        ) {

            owner =
                hostname.split(".")[0];

            const parts =
                pathname
                    .split("/")
                    .filter(Boolean);


            repo =
                parts[0];


            /*
            User site:

            username.github.io
            */

            if (!repo) {

                repo =
                    `${owner}.github.io`;

            }

        } else {

            /*
            Custom domain fallback.

            Change these if necessary.
            */

            owner =
                "YOUR_GITHUB_USERNAME";

            repo =
                "YOUR_REPOSITORY";
        }


        /*
        ================================================
        GET /games CONTENTS
        ================================================
        */

        const gamesURL =
            `https://api.github.com/repos/${owner}/${repo}/contents/games`;


        const response =
            await fetch(gamesURL);


        if (!response.ok) {

            throw new Error(
                `GitHub API returned ${response.status}`
            );

        }


        const files =
            await response.json();


        /*
        ================================================
        SEPARATE FILES AND FOLDERS
        ================================================
        */

        const rootGames =
            files.filter(file =>

                file.type === "file" &&

                file.name
                    .toLowerCase()
                    .endsWith(".html")

            );


        const folders =
            files.filter(file =>

                file.type === "dir"

            );


        /*
        ================================================
        TOTAL GAME COUNT
        ================================================
        */

        let totalGames =
            rootGames.length;


        /*
        We don't know the games inside
        folders yet, so load those first.
        */

        const categories = [];


        /*
        ================================================
        ROOT GAMES CATEGORY
        ================================================
        */

        if (rootGames.length > 0) {

            categories.push({

                name: "Games",

                icon: "🎮",

                games: rootGames

            });

        }


        /*
        ================================================
        LOAD EVERY FOLDER
        ================================================
        */

        for (
            const folder of folders
        ) {

            try {

                const folderURL =
                    `https://api.github.com/repos/${owner}/${repo}/contents/games/${encodeURIComponent(folder.name)}`;


                const folderResponse =
                    await fetch(folderURL);


                if (!folderResponse.ok) {

                    console.warn(
                        `Couldn't read folder ${folder.name}`
                    );

                    continue;

                }


                const folderFiles =
                    await folderResponse.json();


                /*
                Find HTML files directly
                inside the category folder.
                */

                const folderGames =
                    folderFiles.filter(file =>

                        file.type === "file" &&

                        file.name
                            .toLowerCase()
                            .endsWith(".html")

                    );


                /*
                No HTML games in this folder.
                */

                if (
                    folderGames.length === 0
                ) {

                    continue;

                }


                totalGames +=
                    folderGames.length;


                categories.push({

                    name: folder.name,

                    icon: getCategoryIcon(
                        folder.name
                    ),

                    games: folderGames,

                    folder: folder.name

                });

            } catch (folderError) {

                console.error(
                    `Error loading folder ${folder.name}:`,
                    folderError
                );

            }

        }


        /*
        ================================================
        NOTHING FOUND
        ================================================
        */

        if (
            totalGames === 0
        ) {

            gamesContainer.innerHTML = `

                <div class="loading">

                    <div
                        style="
                            font-size:40px;
                            margin-bottom:15px;
                        "
                    >
                        🎮
                    </div>

                    <div>
                        No games found.
                    </div>

                    <div
                        style="
                            font-size:12px;
                            margin-top:8px;
                        "
                    >
                        Put .html games or game
                        folders inside /games.
                    </div>

                </div>

            `;

            gameCount.textContent =
                "0 games";

            return;

        }


        /*
        ================================================
        UPDATE COUNT
        ================================================
        */

        gameCount.textContent =
            `${totalGames} game${
                totalGames === 1
                    ? ""
                    : "s"
            }`;


        /*
        ================================================
        SORT CATEGORIES
        ================================================
        */

        categories.sort((a, b) => {

            /*
            Keep the main Games category
            at the top.
            */

            if (
                a.name === "Games"
            ) {
                return -1;
            }

            if (
                b.name === "Games"
            ) {
                return 1;
            }

            return a.name.localeCompare(
                b.name
            );

        });


        /*
        ================================================
        RENDER
        ================================================
        */

        gamesContainer.innerHTML = "";


        for (
            const category of categories
        ) {

            const categoryElement =
                createCategory(
                    category
                );


            gamesContainer.appendChild(
                categoryElement
            );

        }


    } catch (error) {

        console.error(error);


        gamesContainer.innerHTML = `

            <div class="error">

                <h3>
                    Couldn't load the games 😭
                </h3>

                <p
                    style="
                        margin-top:10px;
                    "
                >
                    Make sure the repository is
                    public and the
                    <b>games</b> folder exists.
                </p>

                <p
                    style="
                        margin-top:8px;
                        font-size:12px;
                    "
                >
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;


        gameCount.textContent =
            "Error loading games";

    }

}


/*
============================================================
CREATE CATEGORY
============================================================
*/

function createCategory(category) {

    const section =
        document.createElement("section");

    section.className =
        "category";


    /*
    CATEGORY HEADER
    */

    const header =
        document.createElement("div");

    header.className =
        "category-header";


    const icon =
        document.createElement("div");

    icon.className =
        "category-icon";

    icon.textContent =
        category.icon;


    const name =
        document.createElement("div");

    name.className =
        "category-name";

    name.textContent =
        formatName(category.name);


    const count =
        document.createElement("span");

    count.className =
        "category-count";

    count.textContent =
        `(${category.games.length})`;


    name.appendChild(count);

    header.appendChild(icon);
    header.appendChild(name);


    /*
    GAME GRID
    */

    const grid =
        document.createElement("div");

    grid.className =
        "games-grid";


    /*
    SORT GAMES
    */

    const sortedGames =
        [...category.games].sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name
                )
        );


    /*
    CREATE GAME CARDS
    */

    sortedGames.forEach(
        file => {

            const card =
                createGameCard(
                    file,
                    category.folder
                );

            grid.appendChild(card);

        }
    );


    section.appendChild(header);
    section.appendChild(grid);


    return section;

}


/*
============================================================
CREATE GAME CARD
============================================================
*/

function createGameCard(
    file,
    folder
) {

    const card =
        document.createElement("div");

    card.className =
        "game";


    /*
    GAME NAME
    */

    let gameName =
        file.name
            .replace(
                /\.html$/i,
                ""
            )
            .replace(
                /[-_]/g,
                " "
            );


    /*
    If the game is:

    folder/index.html

    use the folder name instead
    of displaying "Index".
    */

    if (
        folder &&
        file.name.toLowerCase() ===
        "index.html"
    ) {

        gameName =
            folder
                .replace(
                    /[-_]/g,
                    " "
                );

    }


    gameName =
        formatName(gameName);


    /*
    DISPLAY PATH
    */

    let displayPath;


    if (folder) {

        displayPath =
            `${folder}/${file.name}`;

    } else {

        displayPath =
            file.name;

    }


    /*
    CARD HTML
    */

    card.innerHTML = `

        <div class="game-icon">
            🎮
        </div>

        <div class="game-name">
            ${escapeHTML(
                gameName
            )}
        </div>

        <div class="game-file">
            ${escapeHTML(
                displayPath
            )}
        </div>

    `;


    /*
    CLICK GAME
    */

    card.addEventListener(
        "click",
        () => {

            const gameURL =
                getGameURL(
                    file,
                    folder
                );


            window.open(
                gameURL,
                "_blank"
            );

        }
    );


    return card;

}


/*
============================================================
GET GAME URL
============================================================
*/

function getGameURL(
    file,
    folder
) {

    const currentURL =
        new URL(
            window.location.href
        );


    let basePath =
        currentURL.pathname;


    /*
    Make sure the GameHub URL
    ends with /.
    */

    if (
        !basePath.endsWith("/")
    ) {

        basePath += "/";

    }


    let gamePath;


    /*
    Game inside a folder
    */

    if (folder) {

        gamePath =
            `games/${encodeURIComponent(folder)}/${encodeURIComponent(file.name)}`;

    } else {

        /*
        Game directly inside /games
        */

        gamePath =
            `games/${encodeURIComponent(file.name)}`;

    }


    return new URL(
        gamePath,
        currentURL.origin +
        basePath
    ).href;

}


/*
============================================================
FORMAT NAMES
============================================================
*/

function formatName(name) {

    return name
        .replace(
            /[-_]/g,
            " "
        )
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}


/*
============================================================
CATEGORY ICONS
============================================================
*/

function getCategoryIcon(
    folderName
) {

    const name =
        folderName.toLowerCase();


    if (
        name.includes("horror")
    ) {
        return "👻";
    }

    if (
        name.includes("action")
    ) {
        return "⚔️";
    }

    if (
        name.includes("arcade")
    ) {
        return "🕹️";
    }

    if (
        name.includes("multiplayer")
    ) {
        return "👥";
    }

    if (
        name.includes("2d")
    ) {
        return "🎨";
    }

    if (
        name.includes("puzzle")
    ) {
        return "🧩";
    }

    if (
        name.includes("rpg")
    ) {
        return "🧙";
    }

    if (
        name.includes("sport")
    ) {
        return "🏆";
    }

    if (
        name.includes("scary")
    ) {
        return "😈";
    }


    return "📁";

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/*
============================================================
START
============================================================
*/

loadGames();

</script>

</body>
</html>
