<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Discord-Style Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #313338; color: #dbdee1; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .app-container { display: flex; width: 100vw; height: 100vh; }
        .setup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .setup-box { background: #313338; padding: 30px; border-radius: 8px; width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        /* Sidebar */
        .sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; }
        .sidebar-header { padding: 20px; font-weight: bold; font-size: 16px; border-bottom: 2px solid #1f2023; color: white; display: flex; justify-content: space-between; align-items: center; }
        .channel-list { padding: 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
        .channel-item { display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .channel-btn { background: transparent; border: none; color: #949ba4; text-align: left; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 500; flex: 1; }
        .channel-btn:hover { background: #35373c; color: #dbdee1; }
        .channel-btn.active { background: #404249; color: white; }
        
        .del-channel-btn { background: transparent; color: #da373c; border: none; cursor: pointer; padding: 5px 8px; font-size: 14px; display: none; }
        .channel-item:hover .del-channel-btn { display: block; }

        /* User Profile Pill at Bottom of Sidebar */
        .user-panel { padding: 10px 15px; background: #232428; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2023; }
        .user-info-pill { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        .settings-gear-btn { background: transparent; border: none; color: #949ba4; cursor: pointer; font-size: 16px; padding: 5px; }
        .settings-gear-btn:hover { color: white; }

        /* Admin Controls in Sidebar */
        .admin-sidebar-panel { padding: 10px; border-top: 1px solid #1f2023; background: #232428; display: flex; flex-direction: column; gap: 8px; }
        .admin-sidebar-panel input { padding: 8px; font-size: 12px; }
        .admin-sidebar-panel button { background: #248046; color: white; font-size: 12px; padding: 8px; cursor: pointer; border-radius: 4px; border: none;}
        .admin-sidebar-panel button:hover { background: #1a6334; }

        /* Chat Main Area */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #313338; }
        .chat-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #1f2023; color: white; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: scroll; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        
        /* Members Sidebar */
        .members-sidebar { width: 220px; background: #2b2d31; border-left: 1px solid #1f2023; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 4px; font-size: 14px; color: #949ba4; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #23a55a; flex-shrink: 0; }

        /* Messages */
        .message { display: flex; gap: 12px; position: relative; padding-right: 50px; }
        .message-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        .message-body { display: flex; flex-direction: column; gap: 4px; word-break: break-word; flex: 1; }
        .message-content { background: #2b2d31; padding: 10px 14px; border-radius: 8px; max-width: 100%; display: inline-block; }
        .message-image { max-width: 300px; max-height: 300px; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }
        .admin-badge { background: #da373c; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }
        
        .controls { padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #313338; }
        .controls-row { display: flex; gap: 10px; }
        input, button { padding: 12px; font-size: 14px; border: none; border-radius: 4px; outline: none; }
        input[type="text"], input[type="password"] { background: #383a40; color: white; flex: 1; }
        button.send-btn { background: #5865f2; color: white; cursor: pointer; font-weight: bold; }
        button.send-btn:hover { background: #4752c4; }
        
        .file-upload-btn { background: #4e5058; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 16px; border-radius: 4px; font-weight: bold; }
        .file-upload-btn:hover { background: #6d6f78; }

        .typing-indicator { font-size: 12px; color: #949ba4; font-style: italic; height: 18px; }

        .delete-btn { position: absolute; right: 0; top: 0; background: #da373c; color: white; border: none; padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; display: none; }
        .message:hover .delete-btn { display: block; }
        
        /* Modal & Tabs */
        .tab-toggles { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; background: #2b2d31; color: #949ba4; border: none; padding: 8px 4px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .tab-btn.active { background: #5865f2; color: white; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: #313338; padding: 30px; border-radius: 8px; width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="setupScreen" class="setup-overlay">
        <div class="setup-box">
            <h2 id="authTitle" style="color: white; margin-top: 0; text-align: center;">Welcome Back</h2>
            
            <div class="tab-toggles">
                <button id="signinTabBtn" class="tab-btn active" onclick="switchAuthMode('signin')">Sign In</button>
                <button id="signupTabBtn" class="tab-btn" onclick="switchAuthMode('signup')">Sign Up</button>
                <button id="adminTabBtn" class="tab-btn" onclick="switchAuthMode('admin')">Admin</button>
            </div>

            <input type="text" id="usernameInput" placeholder="Username...">
            <input type="password" id="passwordInput" placeholder="Password...">
            
            <div id="signupAvatarSection" class="hidden" style="display: flex; flex-direction: column; gap: 5px;">
                <div style="font-size: 13px; color: #949ba4;">Profile Picture (Optional):</div>
                <input type="file" id="avatarFileInput" accept="image/*" style="background: #383a40; color: #dbdee1; padding: 8px; font-size: 12px;">
            </div>

            <button class="send-btn" id="authSubmitBtn" onclick="handleAuth()">Sign In</button>
        </div>
    </div>

    <!-- PROFILE SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: white; margin-top: 0;">User Settings</h2>
            <div style="font-size: 13px; color: #949ba4;">Change Display Name:</div>
            <input type="text" id="settingsUsernameInput" placeholder="New username...">
            
            <div style="font-size: 13px; color: #949ba4;">Change Profile Picture:</div>
            <input type="file" id="settingsAvatarInput" accept="image/*" style="background: #383a40; color: #dbdee1; padding: 8px; font-size: 12px;">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="send-btn" style="flex: 1; background: #248046;" onclick="saveProfileSettings()">Save Changes</button>
                <button class="send-btn" style="flex: 1; background: #4e5058;" onclick="toggleSettingsModal(false)">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appContainer" class="app-container hidden">
        <!-- Sidebar Channels -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>💬 Community</span>
            </div>
            
            <div id="channelList" class="channel-list">
                <!-- Dynamically loaded channels -->
            </div>

            <!-- Admin Channel Creation Panel -->
            <div id="adminSidebarPanel" class="admin-sidebar-panel hidden">
                <span style="font-size: 11px; font-weight: bold; color: #f2ba33;">ADMIN CONTROLS</span>
                <input type="text" id="newChannelInput" placeholder="New channel name...">
                <button onclick="createChannel()">+ Create Channel</button>
            </div>

            <!-- Discord Style User Footer Pill -->
            <div class="user-panel">
                <div class="user-info-pill">
                    <div id="sidebarUserAvatarContainer"></div>
                    <div style="display: flex; flex-direction: column; overflow: hidden;">
                        <span id="sidebarUserName" style="font-size: 13px; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
                        <span id="sidebarUserStatus" style="font-size: 11px; color: #23a55a;">Online</span>
                    </div>
                </div>
                <button class="settings-gear-btn" title="User Settings" onclick="toggleSettingsModal(true)">⚙️</button>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-main">
            <div class="chat-header">
                <span id="currentChannelTitle"># general</span>
            </div>

            <div id="chat-box"></div>

            <div class="controls">
                <div id="typingIndicator" class="typing-indicator"></div>
                <div class="controls-row">
                    <label class="file-upload-btn" title="Upload Image">
                        📁 <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImageMessage(event)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." oninput="handleTypingInput()" onkeypress="checkEnter(event)">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <!-- Online Members Sidebar -->
        <div class="members-sidebar" id="membersList">
            <h4 style="font-size: 12px; color: #949ba4; margin: 0 0 8px 0;">ONLINE — 0</h4>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://lusowdnrdgyisxosmbyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1c293ZG5yZGd5aXN4b3NtYnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzgxNTYsImV4cCI6MjA5MzE1NDE1Nn0._dd4uYmcdOKk3bBcQRije1jRbKEF7B4rh3WL7d5tIKQ';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let myName = '';
    let myAvatarUrl = '';
    let currentRoom = 'general';
    let isAdmin = false;
    let chatSubscription = null;
    let channelsSubscription = null;
    let presenceChannel = null;
    let typingChannel = null;
    let typingTimeout = null;

    let authMode = 'signin'; // 'signin', 'signup', or 'admin'

    function switchAuthMode(mode) {
        authMode = mode;
        const signinBtn = document.getElementById('signinTabBtn');
        const signupBtn = document.getElementById('signupTabBtn');
        const adminBtn = document.getElementById('adminTabBtn');
        const avatarSection = document.getElementById('signupAvatarSection');
        const submitBtn = document.getElementById('authSubmitBtn');
        const title = document.getElementById('authTitle');

        signinBtn.classList.remove('active');
        signupBtn.classList.remove('active');
        adminBtn.classList.remove('active');

        if (mode === 'signin') {
            signinBtn.classList.add('active');
            avatarSection.classList.add('hidden');
            submitBtn.innerText = 'Sign In';
            title.innerText = 'Welcome Back';
        } else if (mode === 'signup') {
            signupBtn.classList.add('active');
            avatarSection.classList.remove('hidden');
            submitBtn.innerText = 'Create Account';
            title.innerText = 'Create an Account';
        } else if (mode === 'admin') {
            adminBtn.classList.add('active');
            avatarSection.classList.add('hidden');
            submitBtn.innerText = 'Admin Login';
            title.innerText = 'Admin Portal';
        }
    }

    async function handleAuth() {
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        if (!username || !password) {
            alert('Please fill in both username and password!');
            return;
        }

        if (authMode === 'admin') {
            const { data, error } = await supabaseClient
                .from('admins')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('Invalid admin credentials!');
                return;
            }
            isAdmin = true;
            myName = username;
            myAvatarUrl = '';
        } else if (authMode === 'signup') {
            // Check if user exists
            const { data: existing } = await supabaseClient.from('profiles').select('*').eq('username', username).single();
            if (existing) {
                alert('Username already taken! Choose another or Sign In.');
                return;
            }

            const avatarFile = document.getElementById('avatarFileInput').files[0];
            if (avatarFile) {
                myAvatarUrl = await uploadAvatar(avatarFile, username);
            }

            const { error } = await supabaseClient.from('profiles').insert([{
                username: username,
                password: password,
                avatar_url: myAvatarUrl
            }]);

            if (error) {
                alert('Sign up failed: ' + error.message);
                return;
            }
            isAdmin = false;
            myName = username;
        } else if (authMode === 'signin') {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert('Invalid username or password!');
                return;
            }
            isAdmin = false;
            myName = data.username;
            myAvatarUrl = data.avatar_url || '';
        }

        initAppInterface();
    }

    async function uploadAvatar(file, targetName) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${targetName}_${Date.now()}.${fileExt}`;
        const { error } = await supabaseClient.storage.from('chat-files').upload(fileName, file);
        if (error) return '';
        const { data } = supabaseClient.storage.from('chat-files').getPublicUrl(fileName);
        return data.publicUrl;
    }

    function initAppInterface() {
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');

        updateSidebarUserPill();

        if (isAdmin) {
            document.getElementById('adminSidebarPanel').classList.remove('hidden');
        }

        loadChannels();
        subscribeToChannels();
        loadMessagesForRoom();
        subscribeToRoom();
        setupPresence();
        setupTypingChannel();
    }

    function updateSidebarUserPill() {
        document.getElementById('sidebarUserName').innerText = myName + (isAdmin ? ' (Admin)' : '');
        const avatarContainer = document.getElementById('sidebarUserAvatarContainer');
        const initial = myName.charAt(0).toUpperCase();
        avatarContainer.innerHTML = myAvatarUrl 
            ? `<img src="${myAvatarUrl}" class="sidebar-avatar">` 
            : `<div class="sidebar-avatar">${initial}</div>`;
    }

    function toggleSettingsModal(show) {
        const modal = document.getElementById('settingsModal');
        if (show) {
            document.getElementById('settingsUsernameInput').value = myName;
            modal.classList.remove('hidden');
        } else {
            modal.classList.add('hidden');
        }
    }

    async function saveProfileSettings() {
        const newName = document.getElementById('settingsUsernameInput').value.trim();
        const avatarFile = document.getElementById('settingsAvatarInput').files[0];
        let newAvatarUrl = myAvatarUrl;

        if (!newName) {
            alert('Username cannot be empty!');
            return;
        }

        if (avatarFile) {
            newAvatarUrl = await uploadAvatar(avatarFile, newName);
        }

        if (!isAdmin) {
            const { error } = await supabaseClient
                .from('profiles')
                .update({ username: newName, avatar_url: newAvatarUrl })
                .eq('username', myName);

            if (error) {
                alert('Failed to update profile: ' + error.message);
                return;
            }
        }

        myName = newName;
        myAvatarUrl = newAvatarUrl;
        updateSidebarUserPill();
        toggleSettingsModal(false);
        loadMessagesForRoom(); // Refresh chat avatars
    }

    async function loadChannels() {
        const { data, error } = await supabaseClient.from('channels').select('*').order('id', { ascending: true });
        if (error) return;
        renderChannels(data);
    }

    function renderChannels(channels) {
        const list = document.getElementById('channelList');
        list.innerHTML = '';

        channels.forEach(ch => {
            const item = document.createElement('div');
            item.className = 'channel-item';

            const btn = document.createElement('button');
            btn.className = `channel-btn ${ch.name === currentRoom ? 'active' : ''}`;
            btn.innerText = `# ${ch.name}`;
            btn.onclick = () => switchChannel(ch.name, btn);
            item.appendChild(btn);

            if (isAdmin) {
                const delBtn = document.createElement('button');
                delBtn.className = 'del-channel-btn';
                delBtn.innerText = '🗑️';
                delBtn.title = 'Delete Channel';
                delBtn.onclick = () => deleteChannel(ch.name);
                item.appendChild(delBtn);
            }

            list.appendChild(item);
        });
    }

    function subscribeToChannels() {
        channelsSubscription = supabaseClient
            .channel('public:channels')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, () => loadChannels())
            .subscribe();
    }

    async function createChannel() {
        let name = document.getElementById('newChannelInput').value.trim().toLowerCase();
        name = name.replace(/[^a-z0-9-_]/g, '');
        if (!name) return;

        const { error } = await supabaseClient.from('channels').insert([{ name }]);
        if (error) {
            alert('Could not create channel: ' + error.message);
        } else {
            document.getElementById('newChannelInput').value = '';
        }
    }

    async function deleteChannel(name) {
        if (name === 'general') {
            alert('You cannot delete the general channel!');
            return;
        }
        if (!confirm(`Are you sure you want to delete #${name}?`)) return;

        await supabaseClient.from('channels').delete().eq('name', name);
        if (currentRoom === name) {
            switchChannel('general', document.querySelector('.channel-btn'));
        }
    }

    function switchChannel(roomName, element) {
        currentRoom = roomName;
        document.getElementById('currentChannelTitle').innerText = `# ${roomName}`;
        document.getElementById('messageInput').placeholder = `Message #${roomName}...`;

        document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
        if (element) element.classList.add('active');

        if (chatSubscription) supabaseClient.removeChannel(chatSubscription);
        if (typingChannel) supabaseClient.removeChannel(typingChannel);

        loadMessagesForRoom();
        subscribeToRoom();
        setupTypingChannel();
    }

    async function loadMessagesForRoom() {
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .eq('room', currentRoom)
            .order('created_at', { ascending: true });

        if (error) return;

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        
        const { data: profiles } = await supabaseClient.from('profiles').select('*');
        const profileMap = {};
        if (profiles) {
            profiles.forEach(p => profileMap[p.username] = p.avatar_url);
        }

        data.forEach(msg => appendMessageToUI(msg, profileMap[msg.sender]));
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function subscribeToRoom() {
        chatSubscription = supabaseClient
            .channel(`room:${currentRoom}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${currentRoom}` }, async payload => {
                const { data: profile } = await supabaseClient.from('profiles').select('avatar_url').eq('username', payload.new.sender).single();
                appendMessageToUI(payload.new, profile ? profile.avatar_url : '');
                const chatBox = document.getElementById('chat-box');
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
                const el = document.getElementById(`msg-${payload.old.id}`);
                if (el) el.remove();
            })
            .subscribe();
    }

    async function sendMessage() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text) return;

        const { error } = await supabaseClient
            .from('messages')
            .insert([{ sender: myName, message: text, room: currentRoom, is_image: false }]);

        if (!error) {
            document.getElementById('messageInput').value = '';
        }
    }

    async function sendImageMessage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileExt = file.name.split('.').pop();
        const fileName = `img_${Date.now()}.${fileExt}`;

        const { error: uploadError } = await supabaseClient.storage.from('chat-files').upload(fileName, file);
        if (uploadError) {
            alert('Failed to upload image: ' + uploadError.message);
            return;
        }

        const { data } = supabaseClient.storage.from('chat-files').getPublicUrl(fileName);

        await supabaseClient.from('messages').insert([{
            sender: myName,
            message: data.publicUrl,
            room: currentRoom,
            is_image: true
        }]);
        event.target.value = '';
    }

    async function deleteMessage(id) {
        await supabaseClient.from('messages').delete().eq('id', id);
    }

    function appendMessageToUI(data, avatarUrl) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'message';
        div.id = `msg-${data.id}`;

        const isMessageAdmin = (data.sender.toLowerCase() === 'admin');
        const adminBadgeHtml = isMessageAdmin ? `<span class="admin-badge">ADMIN</span>` : '';
        const deleteBtnHtml = isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${data.id}')">Delete</button>` : '';

        const initial = data.sender.charAt(0).toUpperCase();
        const avatarHtml = avatarUrl 
            ? `<img src="${avatarUrl}" class="message-avatar">` 
            : `<div class="message-avatar">${initial}</div>`;

        let contentHtml = '';
        if (data.is_image) {
            contentHtml = `<img src="${escapeHtml(data.message)}" class="message-image" onclick="window.open(this.src)">`;
        } else {
            contentHtml = escapeHtml(data.message);
        }

        div.innerHTML = `
            ${avatarHtml}
            <div class="message-body">
                <div style="font-size: 13px; color: #949ba4;">
                    <b>${escapeHtml(data.sender)}</b> ${adminBadgeHtml}
                </div>
                <div class="message-content">
                    ${contentHtml}
                    ${deleteBtnHtml}
                </div>
            </div>
        `;
        chatBox.appendChild(div);
    }

    function setupTypingChannel() {
        typingChannel = supabaseClient.channel(`typing:${currentRoom}`);
        typingChannel
            .on('broadcast', { event: 'typing' }, payload => {
                if (payload.user !== myName) {
                    const typingDiv = document.getElementById('typingIndicator');
                    typingDiv.innerText = `${payload.user} is typing...`;
                    clearTimeout(window.typingTimer);
                    window.typingTimer = setTimeout(() => {
                        typingDiv.innerText = '';
                    }, 3000);
                }
            })
            .subscribe();
    }

    function handleTypingInput() {
        if (!typingChannel) return;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            typingChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { user: myName }
            });
        }, 300);
    }

    function setupPresence() {
        presenceChannel = supabaseClient.channel('online-users', {
            config: { presence: { key: myName } },
        });

        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                renderOnlineMembers(state);
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({ online_at: new Date().toISOString() });
                }
            });
    }

    function renderOnlineMembers(presenceState) {
        const membersList = document.getElementById('membersList');
        if (!membersList) return;
        
        const usernames = Object.keys(presenceState);
        membersList.innerHTML = `<h4 style="font-size: 12px; color: #949ba4; margin: 0 0 8px 0;">ONLINE — ${usernames.length}</h4>`;

        usernames.forEach(username => {
            const div = document.createElement('div');
            div.className = 'member-item';
            div.innerHTML = `<div class="status-dot"></div> <span>${escapeHtml(username)}</span>`;
            membersList.appendChild(div);
        });
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.toString().replace(/[&<>"']/g, m => map[m] || m);
    }
</script>

</body>
