<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UNO Multiplayer</title>
  <link rel="stylesheet" href="style.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="panel hero-panel">
        <div class="logo">UNO</div>
        <p class="subtitle">Multiplayer • Accurate Rules • Animations</p>
        <label for="nameInput">Your name</label>
        <input id="nameInput" maxlength="16" placeholder="Enter your name" autocomplete="off" />
        <div class="home-actions">
          <button id="createBtn" class="primary">Create Lobby</button>
          <div class="or">or</div>
          <div class="join-row">
            <input id="roomInput" maxlength="6" placeholder="ROOM CODE" autocomplete="off" />
            <button id="joinBtn">Join</button>
          </div>
        </div>
        <p id="homeStatus" class="status"></p>
      </div>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="screen">
      <div class="panel lobby-panel">
        <div class="topbar">
          <div>
            <div class="eyebrow">ROOM</div>
            <div id="roomCodeDisplay" class="room-code">-----</div>
          </div>
          <button id="copyRoomBtn">Copy Code</button>
        </div>
        <div class="lobby-grid">
          <div class="panel inner-panel">
            <h2>Players <span id="playerCount">0</span>/8</h2>
            <div id="playerList" class="player-list"></div>
          </div>
          <div class="panel inner-panel rules-panel">
            <h2>Rules</h2>
            <ul class="rules-list">
              <li>Match color or number</li>
              <li>Skip • Reverse • Draw 2</li>
              <li>Wild &amp; Wild Draw 4</li>
              <li>Call UNO with 1 card</li>
              <li>First to empty hand wins</li>
            </ul>
            <button id="startBtn" class="primary full">Start Game</button>
            <p id="lobbyStatus" class="status"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <div class="game-shell">
        <div class="game-topbar">
          <div class="room-mini">
            <span class="eyebrow">ROOM</span>
            <span id="gameRoomCode">-----</span>
          </div>
          <div id="turnIndicator" class="turn-indicator">Waiting…</div>
          <div id="directionBadge" class="direction-badge">↻</div>
        </div>

        <!-- Opponents -->
        <div id="opponents" class="opponents"></div>

        <!-- Center table -->
        <div class="table">
          <div class="piles">
            <div id="drawPile" class="pile draw-pile" title="Draw">
              <div class="card-back"></div>
              <span id="drawCount" class="pile-count">0</span>
            </div>
            <div id="discardPile" class="pile discard-pile">
              <!-- top card rendered here -->
            </div>
          </div>
          <div id="colorIndicator" class="color-indicator"></div>
          <div id="actionBanner" class="action-banner"></div>
        </div>

        <!-- Your hand -->
        <div class="hand-area">
          <div class="hand-header">
            <span>Your hand</span>
            <button id="unoBtn" class="uno-btn" disabled>UNO!</button>
            <button id="drawBtn" class="draw-btn" disabled>Draw</button>
          </div>
          <div id="hand" class="hand"></div>
        </div>

        <!-- Color picker modal -->
        <div id="colorPicker" class="modal hidden">
          <div class="modal-content">
            <h3>Choose a color</h3>
            <div class="color-choices">
              <button class="color-choice red" data-color="red"></button>
              <button class="color-choice yellow" data-color="yellow"></button>
              <button class="color-choice green" data-color="green"></button>
              <button class="color-choice blue" data-color="blue"></button>
            </div>
          </div>
        </div>

        <!-- Winner overlay -->
        <div id="winnerOverlay" class="modal hidden">
          <div class="modal-content winner-content">
            <h2 id="winnerText">Winner!</h2>
            <button id="backToLobbyBtn" class="primary">Back to Lobby</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="game.js?v=1"></script>
</body>
</html>
