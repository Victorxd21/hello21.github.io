<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither Global - Multiplayer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #fff;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background-color: #0b0f19;
            cursor: crosshair;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 360px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            margin-bottom: 1rem;
            outline: none;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-br {
            background: #dc2626;
            color: white;
        }

        .btn-br:hover {
            background: #b91c1c;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 8px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 8px;
            min-width: 180px;
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #leaderboard h3 {
            font-size: 0.9rem;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-item">Score: <span id="scoreDisplay">10</span></div>
        <div class="hud-item hidden" id="gunHudHint">Press [E] to Shoot Guns</div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard" class="hidden">
        <h3>Top Slithers</h3>
        <div id="lbList"></div>
    </div>

    <!-- MAIN MENU -->
    <div id="menuScreen" class="overlay-screen">
        <div class="card">
            <h1>Slither Global</h1>
            <input type="text" id="playerNameInput" placeholder="Enter Nickname" maxlength="15">
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8;">Choose Color:</label>
                <input type="color" id="colorPicker" value="#00ffcc" style="margin-left: 10px; cursor: pointer;">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="playNormalBtn">Normal Game</button>
                <button class="btn-br" id="playBRBtn">Battle Royale</button>
            </div>
        </div>
    </div>

    <!-- DEATH SCREEN -->
    <div id="deathScreen" class="overlay-screen hidden">
        <div class="card">
            <h1 style="color: #ef4444;">Eliminated</h1>
            <p id="deathReasonText" style="margin-bottom: 1rem; color: #cbd5e1;">You collided with another player!</p>
            <p style="margin-bottom: 1.5rem;">Final Score: <span id="finalScoreDisplay" style="color: #38bdf8; font-weight: bold;">0</span></p>
            <button class="btn-primary" id="respawnBtn" style="width: 100%;">Play Again</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        let supabaseClient = null;
        if (SUPABASE_URL !== "YOUR_SUPABASE_URL") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 10000;
        let gameActive = false;
        let gameMode = 'normal'; // 'normal' or 'battleroyale'
        let playerId = 'player_' + Math.random().toString(36).substring(2, 9);
        let playerName = 'SlitherPro';
        let globalChannel = null;

        let me = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            angle: 0,
            speed: 3.5,
            score: 10,
            color: '#00ffcc',
            isDead: false,
            trail: []
        };

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let isBoosting = false;

        let remotePlayers = {};
        let aiBots = {};
        let foodPellets = [];
        let bullets = [];

        // Generate initial food pellets
        for (let i = 0; i < 300; i++) {
            foodPellets.push({
                id: 'food_' + i,
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', () => isBoosting = true);
        window.addEventListener('mouseup', () => isBoosting = false);

        // Shooting Gun Mechanic (Bypassed entirely in Normal mode)
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'e' && gameMode === 'battleroyale' && !me.isDead && gameActive) {
                let bullet = {
                    id: 'b_' + Math.random().toString(36).substring(2, 7),
                    ownerId: playerId,
                    x: me.x,
                    y: me.y,
                    vx: Math.cos(me.angle) * 12,
                    vy: Math.sin(me.angle) * 12,
                    life: 100
                };
                bullets.push(bullet);

                if (globalChannel) {
                    globalChannel.send({
                        type: 'broadcast',
                        event: 'player_shoot',
                        payload: bullet
                    });
                }
            }
        });

        function startGame(mode) {
            gameMode = mode;
            playerName = document.getElementById('playerNameInput').value || 'SlitherPro';
            me.color = document.getElementById('colorPicker').value;
            me.score = 10;
            me.isDead = false;
            me.x = Math.random() * (WORLD_SIZE - 2000) + 1000;
            me.y = Math.random() * (WORLD_SIZE - 2000) + 1000;
            me.trail = [];
            remotePlayers = {};

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('deathScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('leaderboard').classList.remove('hidden');

            if (gameMode === 'battleroyale') {
                document.getElementById('gunHudHint').classList.remove('hidden');
            } else {
                document.getElementById('gunHudHint').classList.add('hidden');
            }

            gameActive = true;
            initSupabaseSync();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('playNormalBtn').onclick = () => startGame('normal');
        document.getElementById('playBRBtn').onclick = () => startGame('battleroyale');
        document.getElementById('respawnBtn').onclick = () => startGame(gameMode);

        function initSupabaseSync() {
            if (!supabaseClient) return;

            if (globalChannel) {
                supabaseClient.removeChannel(globalChannel);
            }

            // Room Channel separation based on selected mode
            const channelName = gameMode === 'battleroyale' ? 'slither_room_br' : 'slither_room_normal';

            globalChannel = supabaseClient.channel(channelName, {
                config: { broadcast: { self: false } }
            });

            globalChannel.on('broadcast', { event: 'player_update' }, ({ payload }) => {
                remotePlayers[payload.id] = payload;
            }).on('broadcast', { event: 'player_shoot' }, ({ payload }) => {
                if (gameMode === 'battleroyale') {
                    bullets.push(payload);
                }
            }).subscribe();
        }

        function triggerDeath(killerName) {
            if (me.isDead) return;
            me.isDead = true;
            gameActive = false;

            document.getElementById('deathReasonText').innerText = `You crashed into ${killerName || "another worm"}!`;
            document.getElementById('finalScoreDisplay').innerText = Math.floor(me.score);
            document.getElementById('deathScreen').classList.remove('hidden');
        }

        function checkWormCollisions() {
            if (me.isDead) return;
            const headRadius = 12;

            // Check body collisions against remote players
            Object.values(remotePlayers).forEach(player => {
                if (!player.trail || player.trail.length < 5) return;
                for (let i = 5; i < player.trail.length; i++) {
                    let seg = player.trail[i];
                    let dist = Math.hypot(me.x - seg.x, me.y - seg.y);
                    if (dist < headRadius + 8) {
                        triggerDeath(player.name || "another player");
                        return;
                    }
                }
            });

            // Check body collisions against AI Bots
            Object.values(aiBots).forEach(bot => {
                if (!bot.trail || bot.trail.length < 5) return;
                for (let i = 5; i < bot.trail.length; i++) {
                    let seg = bot.trail[i];
                    let dist = Math.hypot(me.x - seg.x, me.y - seg.y);
                    if (dist < headRadius + 8) {
                        triggerDeath(bot.name || "an AI bot");
                        return;
                    }
                }
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Movement & Trail Updating
            if (!me.isDead) {
                let targetAngle = Math.atan2(mouseY - canvas.height / 2, mouseX - canvas.width / 2);
                let currentSpeed = me.speed * (isBoosting && me.score > 15 ? 1.8 : 1.0);
                
                if (isBoosting && me.score > 15) {
                    me.score -= 0.05;
                    document.getElementById('scoreDisplay').innerText = Math.floor(me.score);
                }

                me.angle = targetAngle;
                me.x += Math.cos(me.angle) * currentSpeed;
                me.y += Math.sin(me.angle) * currentSpeed;

                me.trail.unshift({ x: me.x, y: me.y });
                let maxTrailLength = Math.floor(me.score * 3);
                if (me.trail.length > maxTrailLength) {
                    me.trail.pop();
                }

                checkWormCollisions();

                if (globalChannel) {
                    globalChannel.send({
                        type: 'broadcast',
                        event: 'player_update',
                        payload: {
                            id: playerId,
                            name: playerName,
                            x: me.x,
                            y: me.y,
                            angle: me.angle,
                            score: me.score,
                            color: me.color,
                            trail: me.trail
                        }
                    });
                }
            }

            // Camera Transformation
            ctx.save();
            ctx.translate(canvas.width / 2 - me.x, canvas.height / 2 - me.y);

            // Draw Background Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            let gridSize = 100;
            let startX = Math.floor((me.x - canvas.width) / gridSize) * gridSize;
            let endX = Math.floor((me.x + canvas.width) / gridSize) * gridSize;
            let startY = Math.floor((me.y - canvas.height) / gridSize) * gridSize;
            let endY = Math.floor((me.y + canvas.height) / gridSize) * gridSize;

            for (let x = startX; x <= endX; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
            for (let y = startY; y <= endY; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }

            // Render Food Pellets
            foodPellets.forEach(pellet => {
                ctx.fillStyle = pellet.color;
                ctx.beginPath();
                ctx.arc(pellet.x, pellet.y, 6, 0, Math.PI * 2);
                ctx.fill();

                if (!me.isDead) {
                    let dist = Math.hypot(me.x - pellet.x, me.y - pellet.y);
                    if (dist < 20) {
                        pellet.x = Math.random() * WORLD_SIZE;
                        pellet.y = Math.random() * WORLD_SIZE;
                        me.score += 1;
                        document.getElementById('scoreDisplay').innerText = Math.floor(me.score);
                    }
                }
            });

            // Bullets (Battle Royale mode only)
            if (gameMode === 'battleroyale') {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    b.life--;

                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    if (b.life <= 0) {
                        bullets.splice(i, 1);
                    }
                }
            }

            // Draw Local Player Body
            if (!me.isDead) {
                me.trail.forEach((pt, idx) => {
                    ctx.fillStyle = me.color;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, Math.max(4, 12 - idx * 0.03), 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw Remote Players Body
            Object.values(remotePlayers).forEach(player => {
                if (!player.trail) return;
                player.trail.forEach((pt, idx) => {
                    ctx.fillStyle = player.color || '#ff0055';
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, Math.max(4, 12 - idx * 0.03), 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
