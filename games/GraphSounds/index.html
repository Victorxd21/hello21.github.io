<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left-to-Right Graph Sonification</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input[type="text"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        canvas {
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            height: 300px;
        }
        .examples {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge:hover {
            background: #475569;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Left-to-Right Graph Sonification</h1>
        
        <div class="input-group">
            <label for="formula">Waveform Formula y = f(x) from left to right:</label>
            <input type="text" id="formula" value="Math.sin(x * 50) * Math.sin(x * 2)">
        </div>

        <div class="examples">
            <span class="badge" onclick="setFormula('Math.sin(x * 40)')">Sine Tone</span>
            <span class="badge" onclick="setFormula('Math.sin(x * 30) * Math.sin(x * 2)')">Amplitude Modulated</span>
            <span class="badge" onclick="setFormula('Math.sin(x * 20) + Math.sin(x * 40) * 0.5')">Harmonic Mix</span>
            <span class="badge" onclick="setFormula('(x * 10) % 6.28 - 3.14')">Sawtooth Sweep</span>
        </div>

        <canvas id="graphCanvas" width="540" height="300"></canvas>

        <div class="controls">
            <button id="playBtn" onclick="togglePlay()">Play Audio Waveform</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const formulaInput = document.getElementById('formula');
        const playBtn = document.getElementById('playBtn');

        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let isPlaying = false;
        let animationId = null;

        const xMin = 0, xMax = 20;
        const yMin = -2, yMax = 2;
        const duration = 2.0; // Audio duration in seconds

        function setFormula(val) {
            formulaInput.value = val;
            buildAndDraw();
        }

        function mapX(x) {
            return ((x - xMin) / (xMax - xMin)) * canvas.width;
        }

        function mapY(y) {
            return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height;
        }

        function evaluateFormula(xVal, formulaStr) {
            try {
                const fn = new Function('x', `return ${formulaStr};`);
                return fn(xVal);
            } catch (e) {
                return 0;
            }
        }

        function buildAndDraw(playProgressX = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid axes
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const originY = mapY(0);
            const originX = mapX(0);

            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();

            // Draw curve
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const formulaStr = formulaInput.value;
            let first = true;
            const steps = 400;
            
            for (let i = 0; i <= steps; i++) {
                const x = xMin + (i / steps) * (xMax - xMin);
                const y = evaluateFormula(x, formulaStr);
                
                if (isNaN(y) || !isFinite(y)) {
                    first = true;
                    continue;
                }

                const px = mapX(x);
                const py = mapY(y);

                if (first) {
                    ctx.moveTo(px, py);
                    first = false;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            // Playhead
            if (playProgressX !== null) {
                const px = mapX(playProgressX);
                const currentY = evaluateFormula(playProgressX, formulaStr);
                
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, canvas.height);
                ctx.stroke();

                if (!isNaN(currentY) && isFinite(currentY)) {
                    const py = mapY(currentY);
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        formulaInput.addEventListener('input', () => {
            if (!isPlaying) buildAndDraw();
        });

        async function togglePlay() {
            if (isPlaying) {
                stopAudio();
                return;
            }

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const formulaStr = formulaInput.value;
            const sampleRate = audioCtx.sampleRate;
            const totalSamples = Math.floor(sampleRate * duration);
            
            // Generate audio buffer directly from left-to-right math samples
            audioBuffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
            const channelData = audioBuffer.getChannelData(0);

            for (let i = 0; i < totalSamples; i++) {
                const progress = i / totalSamples;
                const x = xMin + progress * (xMax - xMin);
                let y = evaluateFormula(x, formulaStr);

                if (isNaN(y) || !isFinite(y)) y = 0;
                // Soft clip to protect speakers
                channelData[i] = Math.max(-1, Math.min(1, y));
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(audioCtx.destination);

            isPlaying = true;
            playBtn.textContent = 'Stop Audio';
            playBtn.style.background = '#f43f5e';
            playBtn.style.color = '#fff';

            const startTime = audioCtx.currentTime;
            sourceNode.start(startTime);

            sourceNode.onended = () => {
                if (isPlaying) stopAudio();
            };

            const animatePlayback = () => {
                if (!isPlaying) return;
                const elapsed = audioCtx.currentTime - startTime;
                if (elapsed >= duration) {
                    stopAudio();
                    return;
                }

                const currentX = xMin + (elapsed / duration) * (xMax - xMin);
                buildAndDraw(currentX);
                animationId = requestAnimationFrame(animatePlayback);
            };

            animationId = requestAnimationFrame(animatePlayback);
        }

        function stopAudio() {
            isPlaying = false;
            playBtn.textContent = 'Play Audio Waveform';
            playBtn.style.background = '#38bdf8';
            playBtn.style.color = '#0f172a';
            
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            buildAndDraw();
        }

        buildAndDraw();
    </script>
</body>
</html>
