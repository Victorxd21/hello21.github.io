<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio to Math Graph Replicator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            margin: 0 0 15px 0;
        }
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #334155;
        }
        input[type="file"] {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input[type="text"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        button.secondary {
            background: #334155;
            color: #f8fafc;
        }
        button.secondary:hover {
            background: #475569;
        }
        canvas {
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 100%;
            height: 250px;
        }
        .status {
            font-size: 0.85rem;
            color: #38bdf8;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Audio-to-Graph Replicator</h1>
        <p class="subtitle">Upload any audio file to extract its waveform profile into a math function.</p>
        
        <div class="upload-section">
            <label for="audioFile">Upload Sound File (MP3 / WAV):</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <div class="input-group">
            <label for="formula">Generated Math Formula y = f(x) (Left-to-Right):</label>
            <input type="text" id="formula" value="Math.sin(x * 50)">
        </div>

        <canvas id="graphCanvas" width="590" height="250"></canvas>
        <div class="status" id="statusMsg"></div>

        <div class="controls">
            <button id="playOriginalBtn" class="secondary" disabled>Play Original</button>
            <button id="playMathBtn" onclick="togglePlayMath()">Play Math Graph</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const formulaInput = document.getElementById('formula');
        const playMathBtn = document.getElementById('playMathBtn');
        const playOriginalBtn = document.getElementById('playOriginalBtn');
        const statusMsg = document.getElementById('statusMsg');

        let audioCtx = null;
        let originalBuffer = null;
        let originalSource = null;
        let mathBuffer = null;
        let mathSource = null;
        let isPlayingMath = false;
        let isPlayingOriginal = false;
        let animationId = null;

        const xMin = 0, xMax = 20;
        const yMin = -1.5, yMax = 1.5;
        const targetDuration = 2.0; // Analyzed snippet length in seconds

        function mapX(x) {
            return ((x - xMin) / (xMax - xMin)) * canvas.width;
        }

        function mapY(y) {
            return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height;
        }

        function evaluateFormula(xVal, formulaStr) {
            try {
                const fn = new Function('x', `return ${formulaStr};`);
                return fn(xVal);
            } catch (e) {
                return 0;
            }
        }

        function drawGraph(playProgressX = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid axes
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const originY = mapY(0);
            const originX = mapX(0);

            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.stroke();

            // Draw function curve
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const formulaStr = formulaInput.value;
            let first = true;
            const steps = 400;
            
            for (let i = 0; i <= steps; i++) {
                const x = xMin + (i / steps) * (xMax - xMin);
                const y = evaluateFormula(x, formulaStr);
                
                if (isNaN(y) || !isFinite(y)) {
                    first = true;
                    continue;
                }

                const px = mapX(x);
                const py = mapY(y);

                if (first) {
                    ctx.moveTo(px, py);
                    first = false;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            // Playhead
            if (playProgressX !== null) {
                const px = mapX(playProgressX);
                const currentY = evaluateFormula(playProgressX, formulaStr);
                
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, canvas.height);
                ctx.stroke();

                if (!isNaN(currentY) && isFinite(currentY)) {
                    const py = mapY(currentY);
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        formulaInput.addEventListener('input', () => {
            if (!isPlayingMath) drawGraph();
        });

        // Handle File Upload & Feature Extraction
        document.getElementById('audioFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusMsg.textContent = 'Processing and analyzing audio...';

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            try {
                const arrayBuffer = await file.arrayBuffer();
                originalBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                playOriginalBtn.disabled = false;

                // Extract a representative snippet and downsample to approximate a formula profile
                const channelData = originalBuffer.getChannelData(0);
                const sampleRate = originalBuffer.sampleRate;
                const totalSamplesToRead = Math.floor(sampleRate * targetDuration);
                
                let formulaTerms = [];
                // Simple feature approximation: detect dominant rough harmonic markers
                // We'll map downsampled points into a synthesized harmonic trigonometric approximation string
                const resolution = 15;
                let stepSize = Math.floor(Math.min(channelData.length, totalSamplesToRead) / resolution);
                
                let terms = [];
                for (let i = 0; i < resolution; i++) {
                    let idx = i * stepSize;
                    let val = channelData[idx] || 0;
                    let freqMultiplier = (i + 1) * 3;
                    if (Math.abs(val) > 0.05) {
                        terms.push(`Math.sin(x * ${freqMultiplier}) * ${val.toFixed(2)}`);
                    }
                }

                if (terms.length > 0) {
                    formulaInput.value = terms.slice(0, 4).join(' + ');
                } else {
                    formulaInput.value = 'Math.sin(x * 20)';
                }

                drawGraph();
                statusMsg.textContent = 'Audio loaded & converted to math graph formula successfully!';
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Error parsing audio file. Try a standard WAV or MP3.';
            }
        });

        playOriginalBtn.addEventListener('click', () => {
            if (!originalBuffer) return;
            if (isPlayingOriginal) {
                if (originalSource) originalSource.stop();
                isPlayingOriginal = false;
                playOriginalBtn.textContent = 'Play Original';
                return;
            }

            if (audioCtx.state === 'suspended') audioCtx.resume();

            originalSource = audioCtx.createBufferSource();
            originalSource.buffer = originalBuffer;
            originalSource.connect(audioCtx.destination);
            
            isPlayingOriginal = true;
            playOriginalBtn.textContent = 'Stop Original';
            originalSource.start(0);

            originalSource.onended = () => {
                isPlayingOriginal = false;
                playOriginalBtn.textContent = 'Play Original';
            };
        });

        async function togglePlayMath() {
            if (isPlayingMath) {
                stopMathAudio();
                return;
            }

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const formulaStr = formulaInput.value;
            const sampleRate = audioCtx.sampleRate;
            const totalSamples = Math.floor(sampleRate * targetDuration);
            
            mathBuffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
            const channelData = mathBuffer.getChannelData(0);

            for (let i = 0; i < totalSamples; i++) {
                const progress = i / totalSamples;
                const x = xMin + progress * (xMax - xMin);
                let y = evaluateFormula(x, formulaStr);

                if (isNaN(y) || !isFinite(y)) y = 0;
                channelData[i] = Math.max(-1, Math.min(1, y));
            }

            mathSource = audioCtx.createBufferSource();
            mathSource.buffer = mathBuffer;
            mathSource.connect(audioCtx.destination);

            isPlayingMath = true;
            playMathBtn.textContent = 'Stop Math Graph';
            playMathBtn.style.background = '#f43f5e';
            playMathBtn.style.color = '#fff';

            const startTime = audioCtx.currentTime;
            mathSource.start(startTime);

            mathSource.onended = () => {
                if (isPlayingMath) stopMathAudio();
            };

            const animatePlayback = () => {
                if (!isPlayingMath) return;
                const elapsed = audioCtx.currentTime - startTime;
                if (elapsed >= targetDuration) {
                    stopMathAudio();
                    return;
                }

                const currentX = xMin + (elapsed / targetDuration) * (xMax - xMin);
                drawGraph(currentX);
                animationId = requestAnimationFrame(animatePlayback);
            };

            animationId = requestAnimationFrame(animatePlayback);
        }

        function stopMathAudio() {
            isPlayingMath = false;
            playMathBtn.textContent = 'Play Math Graph';
            playMathBtn.style.background = '#38bdf8';
            playMathBtn.style.color = '#0f172a';
            
            if (mathSource) {
                try { mathSource.stop(); } catch(e) {}
                mathSource.disconnect();
                mathSource = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            drawGraph();
        }

        drawGraph();
    </script>
</body>
</html>
