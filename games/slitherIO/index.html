<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Slither v2.1</title>
<style>
html,body{margin:0;height:100%;background:#090d16;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.sp{width:36px;height:36px;border:3px solid #1e293b;border-top-color:#38bdf8;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="s" style="text-align:center"><div class="sp"></div>Loading Slither…</div>
<script>
(async function(){
  var SRC = "https://raw.githubusercontent.com/Victorxd21/hello21.github.io/98830872b5615f21e26374df0da4d86945af04f5/games/slitherio.html";
  try {
    var r = await fetch(SRC);
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = await r.text();
    var blob = new Blob([html], {type: "text/html;charset=utf-8"});
    location.replace(URL.createObjectURL(blob));
  } catch (e) {
    document.getElementById("s").innerHTML =
      "<h2 style='color:#f87171'>Could not load Slither</h2><p>" + e + "</p>" +
      "<p><a style='color:#38bdf8' href='" + SRC + "'>Open direct link</a></p>";
  }
})();
</script>
</body>
</html>
