<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxel World</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="gameCanvas"></canvas><section id="lobbyScreen" class="screen"><div class="panel"><h1>2D Voxel World</h1><input id="playerName" maxlength="20" placeholder="Your name"><button id="createWorldBtn">Create world</button><button id="joinWorldBtn">Join world</button><div id="joinSection" hidden><input id="worldCode" maxlength="6" placeholder="World code"><button id="confirmJoinBtn">Join</button></div></div></section><div id="gameHUD" hidden><div class="code">World: <b id="codeDisplay">------</b><button id="copyCodeBtn">Copy</button></div><div class="players"><span id="playerNameHUD"></span> · <span id="playerCount">1</span> players</div><div id="hotbarContainer" class="hotbar"></div><div class="help">A/D or ←/→ move · W/Space jump · Left click break · Right click place · E inventory</div></div><div id="inventoryModal" class="modal" hidden><div class="panel"><h2>Inventory</h2><div id="inventoryGrid" class="inventory"></div><button id="closeInventoryBtn">Close (E)</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="world-generator.js"></script><script src="multiplayer.js"></script><script src="voxel-engine.js"></script><script src="ui.js"></script><script src="main.js"></script></body></html>
