<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agar.io Expanded: Skins, Gravity Mass, & Viruses</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            background: #090d16;
            overflow: hidden;
        }
        .retro-shadow {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
        }
        .retro-shadow:active {
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
            transform: translateY(4px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 8px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .kill-feed-item {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col items-center justify-center bg-slate-950">

    <!-- MENU SCREEN -->
    <div id="menuScreen" class="absolute z-25 max-w-md w-full bg-slate-900/95 backdrop-blur-md border-4 border-indigo-500 rounded-3xl p-6 shadow-2xl text-center space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="inline-block bg-indigo-600/30 p-3 rounded-full border-2 border-indigo-400 animate-bounce">
            <i class="fa-solid fa-earth-americas text-4xl text-indigo-400"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-purple-400">AGAR.IO EXPANDED</h1>
            <p class="text-[11px] text-slate-300 mt-0.5">10k World • Local /heads/ Skins • Attracting Mass Pellets</p>
        </div>

        <!-- LIVE PREVIEW CONTAINER -->
        <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center relative overflow-hidden h-28">
            <div class="absolute top-2 left-3 text-[10px] uppercase font-bold text-slate-400 tracking-wider">Live Preview</div>
            <canvas id="previewCanvas" width="200" height="70" class="mt-4"></canvas>
        </div>

        <div class="space-y-3 bg-slate-800/60 p-4 rounded-2xl border border-slate-700 text-left">
            <div>
                <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Cell Name (Matches <code class="text-indigo-300">heads/name.png</code>)</label>
                <input type="text" id="playerNameInput" maxlength="15" value="earth" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-2 text-center text-md font-bold text-indigo-300 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- Color Picker & Presets -->
            <div>
                <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Fallback Color</label>
                <div class="flex items-center space-x-2">
                    <input type="color" id="playerColorPicker" value="#6366f1" class="w-10 h-10 rounded-xl bg-slate-900 border-2 border-slate-600 cursor-pointer p-1">
                    <div class="flex space-x-1.5 flex-1 justify-around">
                        <button type="button" class="color-preset w-7 h-7 rounded-full bg-indigo-500 border-2 border-slate-700 hover:scale-110 transition" data-color="#6366f1"></button>
                        <button type="button" class="color-preset w-7 h-7 rounded-full bg-blue-500 border-2 border-slate-700 hover:scale-110 transition" data-color="#3b82f6"></button>
                        <button type="button" class="color-preset w-7 h-7 rounded-full bg-purple-500 border-2 border-slate-700 hover:scale-110 transition" data-color="#a855f7"></button>
                        <button type="button" class="color-preset w-7 h-7 rounded-full bg-amber-500 border-2 border-slate-700 hover:scale-110 transition" data-color="#f59e0b"></button>
                        <button type="button" class="color-preset w-7 h-7 rounded-full bg-rose-500 border-2 border-slate-700 hover:scale-110 transition" data-color="#f43f5e"></button>
                    </div>
                </div>
            </div>
        </div>

        <button id="playBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-2xl text-lg retro-shadow transition transform active:scale-95">
            <i class="fa-solid fa-play mr-2"></i> Launch into 10k World
        </button>
        <div class="text-[10px] text-slate-500">Press `~` for Admin Console • <b class="text-indigo-300">Space</b> Split • <b class="text-indigo-300">W</b> Eject Mass</div>
    </div>

    <!-- ADMIN CONSOLE OVERLAY -->
    <div id="adminConsole" class="hidden absolute z-40 max-w-sm w-full bg-slate-900/95 backdrop-blur-md border-2 border-amber-500 rounded-2xl p-5 shadow-2xl text-left space-y-3">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
            <h3 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-shield-halved mr-1"></i> Admin Console</h3>
            <button id="closeAdminBtn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-1 text-xs text-slate-300">
            <div>Map Scale: <span class="font-mono text-amber-300">10,000 x 10,000 px</span></div>
            <div>Your Mass: <span id="adminMassVal" class="font-mono font-bold text-indigo-400">10</span></div>
        </div>
        <div class="space-y-2 pt-2 border-t border-slate-800">
            <button id="adminGiantBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-purple-300 font-semibold py-2 px-3 rounded-xl text-xs transition text-left">
                <i class="fa-solid fa-expand mr-2"></i> Grow Massive (+500 Mass)
            </button>
            <button id="adminTeleportBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-blue-300 font-semibold py-2 px-3 rounded-xl text-xs transition text-left">
                <i class="fa-solid fa-location-crosshairs mr-2"></i> Teleport to Map Center
            </button>
        </div>
    </div>

    <!-- DEATH SCREEN -->
    <div id="deathScreen" class="hidden absolute z-30 max-w-sm w-full bg-slate-900/95 backdrop-blur-md border-4 border-red-500 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <div class="inline-block bg-red-600/30 p-3 rounded-full border-2 border-red-400">
            <i class="fa-solid fa-skull-crossbones text-4xl text-red-400"></i>
        </div>
        <div>
            <h2 class="text-2xl font-bold text-red-400">CONSUMED!</h2>
            <p class="text-xs text-slate-300 mt-1" id="deathReasonText">You were eaten!</p>
        </div>
        <button id="respawnBtn" class="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold py-3 px-6 rounded-xl text-md retro-shadow transition">
            <i class="fa-solid fa-rotate-right mr-2"></i> Play Again
        </button>
    </div>

    <!-- HUD, LEADERBOARD, KILL FEED & MINIMAP -->
    <div id="hud" class="hidden absolute top-4 left-4 z-10 pointer-events-none flex flex-col space-y-2">
        <div class="bg-slate-900/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-2xl shadow-lg">
            <div class="text-[10px] uppercase font-bold text-slate-400">Total Mass</div>
            <div id="massDisplay" class="text-2xl font-extrabold text-indigo-400 font-mono">10</div>
        </div>
    </div>

    <div id="leaderboard" class="hidden absolute top-28 right-4 z-10 pointer-events-none bg-slate-900/80 backdrop-blur border border-slate-700 p-3 rounded-2xl shadow-lg w-48">
        <div class="text-xs font-bold text-purple-400 border-b border-slate-700 pb-1 mb-2"><i class="fa-solid fa-trophy mr-1"></i> Leaderboard</div>
        <div id="leaderboardList" class="space-y-1 text-xs text-slate-300 font-mono"></div>
    </div>

    <div id="killFeedContainer" class="hidden absolute top-4 right-4 z-20 pointer-events-none flex flex-col space-y-1.5 w-52">
        <div id="killFeedList" class="space-y-1.5 flex flex-col"></div>
    </div>

    <div id="minimapContainer" class="hidden absolute bottom-4 left-4 z-10 bg-slate-900/90 backdrop-blur border-2 border-slate-700 p-2 rounded-2xl shadow-xl pointer-events-none w-36 h-36 flex items-center justify-center">
        <canvas id="minimapCanvas" width="120" height="120" class="rounded-xl bg-slate-950"></canvas>
    </div>

    <canvas id="gameCanvas" class="block w-full h-full cursor-crosshair"></canvas>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://degilckgjfdnekszsbry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ym_oqKIyxwk7ixxCvwNCmA_w2VtnpdP';
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {}

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 10000; // Expanded to 10k map!
        let playerId = 'cell_' + Math.random().toString(36).substring(2, 9);
        let playerName = 'earth';
        let globalChannel = null;
        let isAdmin = false;

        let playerCells = [];
        let remotePlayers = {};
        let foodPellets = [];
        let ejectedMass = [];
        let viruses = [];
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let gameActive = false;
        let playerColor = '#6366f1';

        // Skin cache handler for local /heads/ folder
        const skinCache = {};
        function getSkinImage(name) {
            let cleanName = name.trim().toLowerCase();
            if (!cleanName) return null;
            if (skinCache[cleanName] !== undefined) {
                return skinCache[cleanName];
            }
            let img = new Image();
            img.src = `heads/${cleanName}.png`;
            skinCache[cleanName] = img;
            return img;
        }

        // Initialize world elements
        function seedWorld() {
            for(let i=0; i<3000; i++) {
                foodPellets.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    color: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 6)]
                });
            }
            for(let i=0; i<30; i++) {
                viruses.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    mass: 100
                });
            }
        }
        seedWorld();

        const colorPicker = document.getElementById('playerColorPicker');
        colorPicker.addEventListener('input', (e) => { playerColor = e.target.value; });
        document.querySelectorAll('.color-preset').forEach(btn => {
            btn.addEventListener('click', () => {
                playerColor = btn.getAttribute('data-color');
                colorPicker.value = playerColor;
            });
        });

        function renderPreview() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            let nameVal = document.getElementById('playerNameInput').value;
            let skinImg = getSkinImage(nameVal);

            previewCtx.save();
            previewCtx.beginPath();
            previewCtx.arc(100, 35, 26, 0, Math.PI * 2);
            previewCtx.closePath();
            previewCtx.clip();

            if (skinImg && skinImg.complete && skinImg.naturalWidth !== 0) {
                previewCtx.drawImage(skinImg, 100 - 26, 35 - 26, 52, 52);
            } else {
                previewCtx.fillStyle = playerColor;
                previewCtx.fillRect(0, 0, 200, 70);
            }
            previewCtx.restore();

            previewCtx.strokeStyle = '#ffffff';
            previewCtx.lineWidth = 3;
            previewCtx.beginPath();
            previewCtx.arc(100, 35, 26, 0, Math.PI * 2);
            previewCtx.stroke();

            requestAnimationFrame(renderPreview);
        }
        renderPreview();

        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        window.addEventListener('keydown', (e) => {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                isAdmin = !isAdmin;
                document.getElementById('adminConsole').classList.toggle('hidden', !isAdmin);
            }
            if (e.code === 'Space' && gameActive) { e.preventDefault(); splitCells(); }
            if (e.code === 'KeyW' && gameActive) { e.preventDefault(); ejectMassPellet(); }
        });

        document.getElementById('closeAdminBtn').addEventListener('click', () => {
            document.getElementById('adminConsole').classList.add('hidden');
            isAdmin = false;
        });
        document.getElementById('adminGiantBtn').addEventListener('click', () => { if(playerCells.length) playerCells[0].mass += 500; });
        document.getElementById('adminTeleportBtn').addEventListener('click', () => { 
            if(playerCells.length) { playerCells[0].x = WORLD_SIZE/2; playerCells[0].y = WORLD_SIZE/2; }
        });

        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('respawnBtn').addEventListener('click', startGame);

        function startGame() {
            const val = document.getElementById('playerNameInput').value.trim();
            if(val) playerName = val;

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('deathScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('leaderboard').classList.remove('hidden');
            document.getElementById('killFeedContainer').classList.remove('hidden');
            document.getElementById('minimapContainer').classList.remove('hidden');

            playerCells = [{ x: WORLD_SIZE/2 + (Math.random()*200-100), y: WORLD_SIZE/2 + (Math.random()*200-100), mass: 20, vx: 0, vy: 0 }];
            initGlobalMultiplayer();
            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        function splitCells() {
            let newCells = [];
            playerCells.forEach(cell => {
                if (cell.mass >= 40) {
                    let half = Math.floor(cell.mass / 2);
                    cell.mass = half;
                    let angle = Math.atan2(mouseY - canvas.height/2, mouseX - canvas.width/2);
                    newCells.push({ x: cell.x + Math.cos(angle)*40, y: cell.y + Math.sin(angle)*40, mass: half, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15 });
                }
                newCells.push(cell);
            });
            if (newCells.length <= 16) playerCells = newCells;
        }

        function ejectMassPellet() {
            playerCells.forEach(cell => {
                if (cell.mass > 30) {
                    cell.mass -= 12;
                    let angle = Math.atan2(mouseY - canvas.height/2, mouseX - canvas.width/2);
                    ejectedMass.push({
                        x: cell.x + Math.cos(angle) * 30,
                        y: cell.y + Math.sin(angle) * 30,
                        vx: Math.cos(angle) * 12,
                        vy: Math.sin(angle) * 12,
                        color: playerColor
                    });
                }
            });
        }

        function initGlobalMultiplayer() {
            if (!supabaseClient || globalChannel) return;
            globalChannel = supabaseClient.channel('global_agar_room_v2', { config: { broadcast: { self: false } } });
            globalChannel.on('broadcast', { event: 'cell_sync' }, payload => { remotePlayers[payload.payload.id] = payload.payload; });
            globalChannel.subscribe(status => {
                if(status === 'SUBSCRIBED') {
                    setInterval(() => {
                        if(!gameActive || !playerCells.length) return;
                        globalChannel.send({ type: 'broadcast', event: 'cell_sync', payload: { id: playerId, name: playerName, color: playerColor, cells: playerCells } });
                    }, 50);
                }
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;

            // Update player movement
            playerCells.forEach(cell => {
                let dx = mouseX - centerX, dy = mouseY - centerY;
                let dist = Math.hypot(dx, dy);
                let speed = Math.max(1.2, 5.5 * Math.pow(cell.mass, -0.15));
                if (dist > 5) {
                    cell.vx += (dx / dist) * speed * 0.2;
                    cell.vy += (dy / dist) * speed * 0.2;
                }
                cell.vx *= 0.85; cell.vy *= 0.85;
                cell.x += cell.vx; cell.y += cell.vy;
                cell.x = Math.max(20, Math.min(WORLD_SIZE - 20, cell.x));
                cell.y = Math.max(20, Math.min(WORLD_SIZE - 20, cell.y));
            });

            // EJECTED MASS ATTRACTION & MERGING LOGIC
            for (let i = ejectedMass.length - 1; i >= 0; i--) {
                let em = ejectedMass[i];
                em.x += em.vx; em.y += em.vy;
                em.vx *= 0.9; em.vy *= 0.9;

                // Attract to nearby ejected mass pellets
                for (let j = i - 1; j >= 0; j--) {
                    let other = ejectedMass[j];
                    let d = Math.hypot(em.x - other.x, em.y - other.y);
                    if (d < 80 && d > 0) {
                        let pullAngle = Math.atan2(other.y - em.y, other.x - em.x);
                        em.vx += Math.cos(pullAngle) * 0.15;
                        em.vy += Math.sin(pullAngle) * 0.15;

                        // Merge if they get really close!
                        if (d < 12) {
                            ejectedMass.splice(i, 1);
                            break;
                        }
                    }
                }

                // Player eats ejected mass
                playerCells.forEach(cell => {
                    let r = Math.sqrt(cell.mass) * 3;
                    if (Math.hypot(cell.x - em.x, cell.y - em.y) < r) {
                        cell.mass += 10;
                        ejectedMass.splice(i, 1);
                    }
                });
            }

            // Food collision
            for (let i = foodPellets.length - 1; i >= 0; i--) {
                let f = foodPellets[i];
                for (let j = 0; j < playerCells.length; j++) {
                    let cell = playerCells[j];
                    if (Math.hypot(cell.x - f.x, cell.y - f.y) < Math.sqrt(cell.mass) * 3) {
                        cell.mass += 0.6;
                        foodPellets.splice(i, 1);
                        foodPellets.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: f.color });
                        break;
                    }
                }
            }

            if (playerCells.length === 0) triggerDeath("Map Hazards");

            let totalMass = Math.floor(playerCells.reduce((s, c) => s + c.mass, 0));
            document.getElementById('massDisplay').innerText = totalMass;

            // Render World
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            let avgX = playerCells.reduce((s, c) => s + c.x, 0) / playerCells.length;
            let avgY = playerCells.reduce((s, c) => s + c.y, 0) / playerCells.length;
            let zoom = Math.max(0.15, 1 / (1 + Math.sqrt(totalMass) * 0.03));

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-avgX, -avgY);

            // Draw grid
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
            let gridSize = 150;
            let startX = Math.floor((avgX - (canvas.width/2)/zoom)/gridSize)*gridSize;
            let startY = Math.floor((avgY - (canvas.height/2)/zoom)/gridSize)*gridSize;
            for (let x = startX; x < startX + (canvas.width/zoom) + gridSize*2; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, avgY - (canvas.height/zoom)); ctx.lineTo(x, avgY + (canvas.height/zoom)*2); ctx.stroke();
            }
            for (let y = startY; y < startY + (canvas.height/zoom) + gridSize*2; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(avgX - (canvas.width/zoom), y); ctx.lineTo(avgX + (canvas.width/zoom)*2, y); ctx.stroke();
            }

            // Draw border
            ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 15;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Draw food
            foodPellets.forEach(f => {
                ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI*2); ctx.fill();
            });

            // Draw ejected mass
            ejectedMass.forEach(em => {
                ctx.fillStyle = em.color; ctx.beginPath(); ctx.arc(em.x, em.y, 8, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            // Draw Viruses
            viruses.forEach(v => {
                ctx.fillStyle = '#22c55e'; ctx.strokeStyle = '#15803d'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(v.x, v.y, 35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            });

            // Draw player cells with skin support
            playerCells.forEach(cell => {
                let r = Math.sqrt(cell.mass) * 3;
                let skinImg = getSkinImage(playerName);

                ctx.save();
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, r, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (skinImg && skinImg.complete && skinImg.naturalWidth !== 0) {
                    ctx.drawImage(skinImg, cell.x - r, cell.y - r, r * 2, r * 2);
                } else {
                    ctx.fillStyle = playerColor;
                    ctx.fillRect(cell.x - r, cell.y - r, r * 2, r * 2);
                }
                ctx.restore();

                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(cell.x, cell.y, r, 0, Math.PI * 2); ctx.stroke();

                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px Fredoka, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(playerName, cell.x, cell.y + 4);
            });

            ctx.restore();

            // Draw Minimap
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            let scaleX = minimapCanvas.width / WORLD_SIZE, scaleY = minimapCanvas.height / WORLD_SIZE;
            playerCells.forEach(c => {
                minimapCtx.fillStyle = '#6366f1'; minimapCtx.beginPath(); minimapCtx.arc(c.x * scaleX, c.y * scaleY, 4, 0, Math.PI*2); minimapCtx.fill();
            });

            requestAnimationFrame(gameLoop);
        }

        function triggerDeath(reason) {
            gameActive = false;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('leaderboard').classList.add('hidden');
            document.getElementById('killFeedContainer').classList.add('hidden');
            document.getElementById('minimapContainer').classList.add('hidden');
            document.getElementById('deathReasonText').innerText = "You were eliminated by " + reason + "!";
            document.getElementById('deathScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
