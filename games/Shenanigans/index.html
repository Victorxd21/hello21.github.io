<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vessel – Training Grounds 3D</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}

/* HUD: bottom-center stack like the Roblox original */
#hud{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,56vw);text-align:center;pointer-events:none;text-shadow:0 2px 2px #000}
#aw{font:700 22px "Comic Sans MS","Chalkboard SE",cursive;letter-spacing:1px;margin-bottom:2px}
#meter{position:relative;height:18px;background:#2a0a0a;border:2px solid #000;border-radius:3px;overflow:hidden}
#mf{display:block;height:100%;width:0;background:linear-gradient(#ff4040,#9a0000)}
#mt{position:absolute;inset:0;font:700 12px/15px "Comic Sans MS",cursive}
#hp{height:8px;margin:4px 0;background:#4a1010;border:1px solid #000}
#hf{display:block;height:100%;background:linear-gradient(90deg,#2f6fd8,#46c27a)}
#slots{display:flex;gap:6px}
.slot{position:relative;flex:1;height:54px;padding-top:2px;background:rgba(45,45,52,.82);border:1px solid #000;font-size:11px;line-height:1.15;overflow:hidden}
.slot b{display:block;font:700 18px "Comic Sans MS",cursive}
.slot small{font-size:9px}
.slot i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7)}
.slot em{position:absolute;right:4px;top:2px;font-style:normal;color:#ffc66b}
#help{position:fixed;top:8px;left:10px;font-size:12px;opacity:.85;text-shadow:0 1px 2px #000;pointer-events:none}

/* Touch controls */
#touch{display:none}
body.touch #touch,body.touch #cust{display:block}
body.touch #help{display:none}
.tb{position:fixed;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(30,30,36,.55);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font:700 13px sans-serif;z-index:5;touch-action:none}
.tb.on{background:rgba(220,40,40,.75)}
#js{width:124px;height:124px;margin:-62px 0 0 -62px}
#kn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
body.edit .tb{outline:2px dashed #ffd400;background:rgba(255,212,0,.25)}
#cust,#rst{display:none;position:fixed;top:8px;z-index:6;padding:8px 12px;border:0;border-radius:8px;background:rgba(20,20,24,.8);color:#fff;font:600 13px sans-serif}
#cust{right:8px}
#rst{right:150px}
body.edit #rst{display:block}

/* 3D additions */
#xh{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;z-index:2}
#dn{position:fixed;display:none;transform:translate(-50%,-100%);text-align:center;pointer-events:none;font:700 14px sans-serif;text-shadow:0 1px 2px #000;z-index:2}
#dn:before{content:"";display:block;width:12px;height:12px;background:#e22;margin:0 auto 3px}
#db{width:92px;height:9px;background:#000;padding:2px;margin:2px auto 0}
#dh{display:block;height:100%;width:100%;background:#3c4}
.pop{position:fixed;transform:translate(-50%,-50%);font:700 18px "Comic Sans MS",cursive;color:#fff;-webkit-text-stroke:1px #000;pointer-events:none;animation:rise .9s forwards;z-index:3}
.pop.big{font-size:26px}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}
#fl{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:4}
#bn{position:fixed;top:14%;left:0;right:0;text-align:center;font:700 clamp(20px,4.5vw,42px) "Comic Sans MS",cursive;color:#f33;-webkit-text-stroke:2px #000;opacity:0;pointer-events:none;z-index:4}
@keyframes bn{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}


/* Domain Expansion cinematic */
#hud{transition:transform .5s}
#touch,#xh,#help{transition:opacity .4s}
body.cine #hud{transform:translate(-50%,170%)}
body.cine #touch,body.cine #xh,body.cine #help{opacity:0}
#dx{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;overflow:hidden}
#dx:before{content:"";position:absolute;left:-10%;right:-10%;top:30%;height:40%;transform:rotate(-8deg);background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(130,0,15,.88),rgba(0,0,0,.88));border-top:3px solid #fff;border-bottom:3px solid #fff}
#dx i{position:absolute;font:900 clamp(34px,9vw,96px)/1 Impact,"Arial Black",sans-serif;font-style:normal;color:#fff;-webkit-text-stroke:3px #000;letter-spacing:2px}
#dx i:first-of-type{left:8%;top:26%}
#dx i:last-of-type{right:8%;bottom:26%}
#dx.on{animation:dxa 1.9s forwards}
#dx.on i:first-of-type{animation:dxl 1.9s forwards}
#dx.on i:last-of-type{animation:dxr 1.9s forwards}
@keyframes dxa{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes dxl{0%{transform:translateX(-120vw) rotate(-8deg)}18%{transform:translateX(0) rotate(-8deg)}78%{transform:translateX(5vw) rotate(-8deg)}100%{transform:translateX(120vw) rotate(-8deg)}}
@keyframes dxr{0%{transform:translateX(120vw) rotate(-8deg)}18%{transform:translateX(0) rotate(-8deg)}78%{transform:translateX(-5vw) rotate(-8deg)}100%{transform:translateX(-120vw) rotate(-8deg)}}
</style>
</head>
<body>
<div id="xh"></div>
<div id="dn">Dummy<div id="db"><b id="dh"></b></div></div>
<div id="fl"></div><div id="bn"></div>
<div id="dx"><i>DOMAIN</i><i>EXPANSION</i></div>
<div id="hud">
  <div id="aw">King of Curses</div>
  <div id="meter"><b id="mf"></b><span id="mt"></span></div>
  <div id="hp"><b id="hf"></b></div>
  <div id="slots"></div>
</div>
<div id="help">Click to lock mouse &amp; look · WASD move · Space jump ×2 · Click M1 · 1–4 skills · Shift dash · E uppercut · R down slam · F block · G awaken (swaps moves) · T dummy swing</div>
<div id="touch"><div id="js" class="tb"><i id="kn"></i></div></div>
<button id="cust">Customize Layout</button>
<button id="rst">Reset Layout</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sounds.js"></script>
<script src="script.js"></script>
</body>
</html>
