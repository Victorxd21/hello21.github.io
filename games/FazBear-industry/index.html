<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fazbear Industry: Decommissioned</title>
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas><div id="grain"></div><div id="fade"></div>
<div id="hud"><div id="obj"></div><div id="cross"></div><div id="prompt"></div><div id="toast"></div>
<div id="sub"><b id="who"></b> <span id="txt"></span></div>
<button id="bSkip" class="hide">Skip &#9656;&#9656;</button><button id="bP">&#10074;&#10074;</button></div>
<div id="menu" class="scr"><h1>FAZBEAR INDUSTRY<small>DECOMMISSIONED</small></h1>
<button id="bNew">New Game</button><button id="bCont">Continue</button>
<label>Volume <input id="vol" type="range" min="0" max="1" step=".05" value=".7"></label>
<p>WASD move &middot; Shift sprint &middot; Ctrl/C crouch &middot; E interact &middot; F flashlight &middot; G pulse light (stuns PROTO-01 briefly) &middot; Tab tablet/map &middot; Esc pause</p></div>
<div id="pause" class="scr hide"><h2>PAUSED</h2><button id="bRes">Resume</button><button id="bM1">Main Menu</button></div>
<div id="dead" class="scr hide"><div id="bw"><div class="eyes"><i></i><i></i></div><div id="bulb"></div><div id="base"></div></div>
<h2>DECOMMISSIONED</h2><div class="row"><button id="bM2">Main Menu</button><button id="bRst">Restart</button></div></div>
<div id="win" class="scr hide"><h1>FAZBEAR INDUSTRY<small>DECOMMISSIONED</small></h1><h2>SHIFT COMPLETED.</h2>
<div id="cctv"><i></i><i></i></div><button id="bM3">Main Menu</button></div>
<div id="tab" class="scr hide"><canvas id="map" width="400" height="400"></canvas></div>
<div id="touch"><div id="joy"><div id="knob"></div></div>
<div id="btns"><button data-k="KeyE">E</button><button data-k="KeyF">LIGHT</button><button data-k="KeyG">PULSE</button><button data-k="ShiftLeft">RUN</button><button data-k="KeyC">DUCK</button><button data-k="Tab">MAP</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script></body></html>
