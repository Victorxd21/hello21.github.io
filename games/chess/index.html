<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chess • hello21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel2: #222633;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #5b8def;
      --accent2: #3d6fd4;
      --light: #f0d9b5;
      --dark: #b58863;
      --highlight: rgba(91, 141, 239, 0.45);
      --last: rgba(255, 213, 79, 0.35);
      --check: rgba(239, 83, 80, 0.55);
      --danger: #ef5350;
      --ok: #66bb6a;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 520px;
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header .badge {
      font-size: 0.7rem;
      background: var(--panel2);
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 999px;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 0 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .clocks {
      display: flex;
      gap: 8px;
    }
    .clock {
      flex: 1;
      background: var(--panel);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 2px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }
    .clock.active {
      border-color: var(--accent);
      background: var(--panel2);
    }
    .clock .label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .clock .time {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .clock.low .time { color: var(--danger); }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      touch-action: none;
    }
    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      user-select: none;
    }
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s;
    }
    .sq.light { background: var(--light); }
    .sq.dark { background: var(--dark); }
    .sq.selected { background: var(--highlight) !important; }
    .sq.last { box-shadow: inset 0 0 0 3px var(--last); }
    .sq.check { background: var(--check) !important; }
    .sq.possible::after {
      content: '';
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0,0,0,0.22);
      pointer-events: none;
    }
    .sq.possible.capture::after {
      width: 88%;
      height: 88%;
      background: transparent;
      border: 4px solid rgba(0,0,0,0.22);
      border-radius: 50%;
    }
    .sq img.piece {
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .sq .coord {
      position: absolute;
      font-size: 0.55rem;
      font-weight: 600;
      opacity: 0.55;
      pointer-events: none;
    }
    .sq .coord.file { bottom: 2px; right: 3px; }
    .sq .coord.rank { top: 2px; left: 3px; }
    .sq.light .coord { color: var(--dark); }
    .sq.dark .coord { color: var(--light); }

    .captured {
      display: flex;
      gap: 2px;
      min-height: 28px;
      flex-wrap: wrap;
      align-items: center;
    }
    .captured img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      opacity: 0.9;
    }
    .captured .adv {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: 4px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--panel2);
      color: var(--text);
      transition: background 0.15s, transform 0.1s;
      min-height: 42px;
    }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent2); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.3em;
    }
    .status.gameover {
      color: var(--ok);
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .modal .section {
      margin-bottom: 16px;
    }
    .modal .section label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      padding: 12px 8px;
      border-radius: 10px;
      background: var(--panel2);
      border: 2px solid transparent;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .mode-btn.selected {
      border-color: var(--accent);
      background: rgba(91,141,239,0.15);
    }
    .mode-btn .title { font-weight: 600; font-size: 0.9rem; }
    .mode-btn .desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .color-pick {
      display: flex;
      gap: 8px;
    }
    .color-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: var(--panel2);
      border: 2px solid transparent;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .color-btn img {
      width: 32px;
      height: 32px;
    }
    .color-btn.selected { border-color: var(--accent); }

    .modal .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .modal .actions button { flex: 1; }

    .moves-panel {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 10px 12px;
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      color: var(--muted);
    }
    .moves-panel span { margin-right: 6px; }
    .moves-panel .num { color: var(--text); font-weight: 500; }

    .thinking {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .thinking.show { display: flex; }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--panel2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .promo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .promo-overlay.show { display: flex; }
    .promo-choices {
      display: flex;
      gap: 8px;
      background: var(--panel);
      padding: 12px;
      border-radius: 12px;
    }
    .promo-choices button {
      width: 56px;
      height: 56px;
      padding: 4px;
      background: var(--panel2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .promo-choices button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <h1>♟ Chess</h1>
    <span class="badge" id="modeBadge">Normal</span>
  </header>

  <main>
    <div class="clocks">
      <div class="clock" id="clockBlack">
        <span class="label">Black</span>
        <span class="time" id="timeBlack">10:00</span>
      </div>
      <div class="clock" id="clockWhite">
        <span class="label">White</span>
        <span class="time" id="timeWhite">10:00</span>
      </div>
    </div>

    <div class="captured" id="capturedWhite"></div>

    <div class="board-wrap">
      <div id="board"></div>
      <div class="promo-overlay" id="promoOverlay">
        <div class="promo-choices" id="promoChoices"></div>
      </div>
    </div>

    <div class="captured" id="capturedBlack"></div>

    <div class="status" id="status">Your turn</div>
    <div class="thinking" id="thinking"><div class="spinner"></div> Thinking…</div>

    <div class="moves-panel" id="moves"></div>

    <div class="controls">
      <button class="primary" id="btnNew">New Game</button>
      <button id="btnUndo">Undo</button>
      <button id="btnFlip">Flip</button>
      <button id="btnHint">Hint</button>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>New Game</h2>

      <div class="section">
        <label>Mode</label>
        <div class="mode-grid">
          <div class="mode-btn selected" data-mode="normal">
            <div class="title">Normal</div>
            <div class="desc">10 min · vs AI</div>
          </div>
          <div class="mode-btn" data-mode="blitz">
            <div class="title">Blitz</div>
            <div class="desc">3 min · vs AI</div>
          </div>
          <div class="mode-btn" data-mode="bullet">
            <div class="title">Bullet</div>
            <div class="desc">1 min · vs AI</div>
          </div>
          <div class="mode-btn" data-mode="local">
            <div class="title">Local</div>
            <div class="desc">2 players</div>
          </div>
        </div>
      </div>

      <div class="section" id="colorSection">
        <label>Play as</label>
        <div class="color-pick">
          <div class="color-btn selected" data-color="w"><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wK.svg" alt="White"></div>
          <div class="color-btn" data-color="b"><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bK.svg" alt="Black"></div>
          <div class="color-btn" data-color="random">🎲</div>
        </div>
      </div>

      <div class="section" id="diffSection">
        <label>AI Strength</label>
        <div class="mode-grid">
          <div class="mode-btn selected" data-diff="1">
            <div class="title">Easy</div>
            <div class="desc">Depth 1</div>
          </div>
          <div class="mode-btn" data-diff="2">
            <div class="title">Medium</div>
            <div class="desc">Depth 2</div>
          </div>
          <div class="mode-btn" data-diff="3">
            <div class="title">Hard</div>
            <div class="desc">Depth 3</div>
          </div>
          <div class="mode-btn" data-diff="4">
            <div class="title">Master</div>
            <div class="desc">Depth 4</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btnCancel">Cancel</button>
        <button class="primary" id="btnStart">Start</button>
      </div>
    </div>
  </div>

  <script>
    // CBurnett SVG pieces (same set used by Lichess)
    const PIECE_BASE = 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/';
    function pieceSrc(color, type) {
      return PIECE_BASE + color + type.toUpperCase() + '.svg';
    }

    let game = new Chess();
    let selected = null;
    let possibleMoves = [];
    let lastMove = null;
    let playerColor = 'w';
    let mode = 'normal';
    let aiDepth = 2;
    let flipped = false;
    let gameOver = false;
    let thinking = false;

    let timeWhite = 600000;
    let timeBlack = 600000;
    let clockInterval = null;
    let lastTick = null;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const movesEl = document.getElementById('moves');
    const thinkingEl = document.getElementById('thinking');
    const modeBadge = document.getElementById('modeBadge');
    const promoOverlay = document.getElementById('promoOverlay');
    const promoChoices = document.getElementById('promoChoices');

    const PST = {
      p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
      n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
      b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],[-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
      r: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
      q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
      k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]]
    };

    const VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluate(g) {
      if (g.in_checkmate()) return g.turn() === 'w' ? -99999 : 99999;
      if (g.in_draw()) return 0;
      let score = 0;
      const board = g.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p) continue;
          const type = p.type;
          const val = VALUES[type];
          const table = PST[type];
          const pst = p.color === 'w' ? table[r][c] : table[7 - r][c];
          score += p.color === 'w' ? (val + pst) : -(val + pst);
        }
      }
      const moves = g.moves().length;
      score += (g.turn() === 'w' ? 1 : -1) * moves * 2;
      return score;
    }

    function minimax(g, depth, alpha, beta, maximizing) {
      if (depth === 0 || g.game_over()) return evaluate(g);
      const moves = g.moves({ verbose: true });
      moves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));
      if (maximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          g.move(m);
          const ev = minimax(g, depth - 1, alpha, beta, false);
          g.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          g.move(m);
          const ev = minimax(g, depth - 1, alpha, beta, true);
          g.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function getBestMove(depth) {
      const moves = game.moves({ verbose: true });
      if (!moves.length) return null;
      moves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));
      const isMax = game.turn() === 'w';
      let best = null;
      let bestScore = isMax ? -Infinity : Infinity;
      for (const m of moves) {
        game.move(m);
        const score = minimax(game, depth - 1, -Infinity, Infinity, !isMax);
        game.undo();
        if (isMax ? score > bestScore : score < bestScore) {
          bestScore = score;
          best = m;
        }
      }
      return best;
    }

    function sqName(r, c) {
      const file = flipped ? 7 - c : c;
      const rank = flipped ? r : 7 - r;
      return String.fromCharCode(97 + file) + (rank + 1);
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const isCheck = game.in_check();
      const turn = game.turn();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const name = sqName(r, c);
          const piece = game.get(name);
          const isLight = (r + c) % 2 === 0;
          const sq = document.createElement('div');
          sq.className = 'sq ' + (isLight ? 'light' : 'dark');
          sq.dataset.sq = name;

          if (selected === name) sq.classList.add('selected');
          if (lastMove && (lastMove.from === name || lastMove.to === name)) sq.classList.add('last');
          if (isCheck && piece && piece.type === 'k' && piece.color === turn) sq.classList.add('check');

          const isPossible = possibleMoves.some(m => m.to === name);
          if (isPossible) {
            sq.classList.add('possible');
            if (piece) sq.classList.add('capture');
          }

          if (piece) {
            const img = document.createElement('img');
            img.className = 'piece';
            img.src = pieceSrc(piece.color, piece.type);
            img.alt = piece.color + piece.type;
            img.draggable = false;
            sq.appendChild(img);
          }

          if (c === 0) {
            const rank = document.createElement('span');
            rank.className = 'coord rank';
            rank.textContent = flipped ? (r + 1) : (8 - r);
            sq.appendChild(rank);
          }
          if (r === 7) {
            const file = document.createElement('span');
            file.className = 'coord file';
            file.textContent = String.fromCharCode(97 + (flipped ? 7 - c : c));
            sq.appendChild(file);
          }

          sq.addEventListener('click', () => onSquareClick(name));
          boardEl.appendChild(sq);
        }
      }

      updateCaptured();
      updateStatus();
      updateClocksUI();
    }

    function onSquareClick(sq) {
      if (gameOver || thinking) return;
      if (mode !== 'local' && game.turn() !== playerColor) return;

      if (selected) {
        const move = possibleMoves.find(m => m.to === sq);
        if (move) {
          doMove(move);
          return;
        }
        if (sq === selected) {
          selected = null;
          possibleMoves = [];
          renderBoard();
          return;
        }
      }

      const piece = game.get(sq);
      if (piece && piece.color === game.turn()) {
        selected = sq;
        possibleMoves = game.moves({ square: sq, verbose: true });
        renderBoard();
      } else {
        selected = null;
        possibleMoves = [];
        renderBoard();
      }
    }

    function doMove(moveObj) {
      if (moveObj.flags.includes('p') && !moveObj.promotion) {
        showPromotion(moveObj);
        return;
      }

      const move = game.move(moveObj);
      if (!move) return;

      lastMove = move;
      selected = null;
      possibleMoves = [];
      renderBoard();
      updateMovesList();

      if (game.game_over()) {
        endGame();
        return;
      }

      lastTick = Date.now();

      if (mode !== 'local') {
        setTimeout(aiMove, 150);
      }
    }

    function showPromotion(moveObj) {
      const color = game.turn();
      const choices = ['q', 'r', 'b', 'n'];
      promoChoices.innerHTML = '';
      choices.forEach(p => {
        const btn = document.createElement('button');
        const img = document.createElement('img');
        img.src = pieceSrc(color, p);
        img.alt = p;
        btn.appendChild(img);
        btn.onclick = () => {
          promoOverlay.classList.remove('show');
          doMove({ ...moveObj, promotion: p });
        };
        promoChoices.appendChild(btn);
      });
      promoOverlay.classList.add('show');
    }

    function aiMove() {
      if (game.game_over() || mode === 'local') return;
      thinking = true;
      thinkingEl.classList.add('show');
      statusEl.textContent = 'AI is thinking…';

      setTimeout(() => {
        const best = getBestMove(aiDepth);
        thinking = false;
        thinkingEl.classList.remove('show');

        if (best) {
          const move = game.move(best);
          lastMove = move;
          renderBoard();
          updateMovesList();
          lastTick = Date.now();
          if (game.game_over()) endGame();
        }
      }, 50);
    }

    function updateCaptured() {
      const history = game.history({ verbose: true });
      const whiteCap = [];
      const blackCap = [];
      let material = 0;

      history.forEach(m => {
        if (m.captured) {
          const val = VALUES[m.captured] || 0;
          if (m.color === 'w') {
            blackCap.push(pieceSrc('b', m.captured));
            material += val;
          } else {
            whiteCap.push(pieceSrc('w', m.captured));
            material -= val;
          }
        }
      });

      const order = { q: 0, r: 1, b: 2, n: 3, p: 4 };
      whiteCap.sort((a, b) => {
        const ta = a.slice(-5, -4).toLowerCase();
        const tb = b.slice(-5, -4).toLowerCase();
        return (order[ta] ?? 5) - (order[tb] ?? 5);
      });
      blackCap.sort((a, b) => {
        const ta = a.slice(-5, -4).toLowerCase();
        const tb = b.slice(-5, -4).toLowerCase();
        return (order[ta] ?? 5) - (order[tb] ?? 5);
      });

      document.getElementById('capturedWhite').innerHTML =
        whiteCap.map(src => `<img src="${src}" alt="">`).join('') +
        (material < 0 ? `<span class="adv">+${Math.abs(material) / 100}</span>` : '');

      document.getElementById('capturedBlack').innerHTML =
        blackCap.map(src => `<img src="${src}" alt="">`).join('') +
        (material > 0 ? `<span class="adv">+${material / 100}</span>` : '');
    }

    function updateStatus() {
      if (gameOver) return;
      if (game.in_checkmate()) {
        statusEl.textContent = (game.turn() === 'w' ? 'Black' : 'White') + ' wins by checkmate!';
        statusEl.classList.add('gameover');
      } else if (game.in_draw()) {
        statusEl.textContent = 'Draw';
        statusEl.classList.add('gameover');
      } else if (game.in_check()) {
        statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' is in check';
        statusEl.classList.remove('gameover');
      } else {
        if (mode === 'local') {
          statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' to move';
        } else {
          statusEl.textContent = game.turn() === playerColor ? 'Your turn' : 'AI turn';
        }
        statusEl.classList.remove('gameover');
      }
    }

    function updateMovesList() {
      const history = game.history();
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const num = Math.floor(i / 2) + 1;
        html += `<span class="num">${num}.</span> <span>${history[i]}</span>`;
        if (history[i + 1]) html += ` <span>${history[i + 1]}</span>`;
        html += ' ';
      }
      movesEl.innerHTML = html;
      movesEl.scrollTop = movesEl.scrollHeight;
    }

    function endGame() {
      gameOver = true;
      stopClock();
      updateStatus();
    }

    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const totalSec = Math.ceil(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function updateClocksUI() {
      document.getElementById('timeWhite').textContent = formatTime(timeWhite);
      document.getElementById('timeBlack').textContent = formatTime(timeBlack);
      const cw = document.getElementById('clockWhite');
      const cb = document.getElementById('clockBlack');
      cw.classList.toggle('active', !gameOver && game.turn() === 'w');
      cb.classList.toggle('active', !gameOver && game.turn() === 'b');
      cw.classList.toggle('low', timeWhite < 30000);
      cb.classList.toggle('low', timeBlack < 30000);
    }

    function startClock() {
      stopClock();
      lastTick = Date.now();
      clockInterval = setInterval(() => {
        if (gameOver || thinking) return;
        const now = Date.now();
        const delta = now - lastTick;
        lastTick = now;
        if (game.turn() === 'w') {
          timeWhite -= delta;
          if (timeWhite <= 0) {
            timeWhite = 0;
            gameOver = true;
            stopClock();
            statusEl.textContent = 'Black wins on time!';
            statusEl.classList.add('gameover');
          }
        } else {
          timeBlack -= delta;
          if (timeBlack <= 0) {
            timeBlack = 0;
            gameOver = true;
            stopClock();
            statusEl.textContent = 'White wins on time!';
            statusEl.classList.add('gameover');
          }
        }
        updateClocksUI();
      }, 100);
    }

    function stopClock() {
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = null;
    }

    function openModal() {
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function startNewGame() {
      const modeBtn = document.querySelector('.mode-btn[data-mode].selected');
      mode = modeBtn ? modeBtn.dataset.mode : 'normal';

      const colorBtn = document.querySelector('.color-btn.selected');
      let col = colorBtn ? colorBtn.dataset.color : 'w';
      if (col === 'random') col = Math.random() < 0.5 ? 'w' : 'b';
      playerColor = col;

      const diffBtn = document.querySelector('.mode-btn[data-diff].selected');
      aiDepth = diffBtn ? parseInt(diffBtn.dataset.diff) : 2;

      if (mode === 'blitz') {
        timeWhite = timeBlack = 3 * 60 * 1000;
        modeBadge.textContent = 'Blitz 3+0';
      } else if (mode === 'bullet') {
        timeWhite = timeBlack = 60 * 1000;
        modeBadge.textContent = 'Bullet 1+0';
      } else if (mode === 'local') {
        timeWhite = timeBlack = 10 * 60 * 1000;
        modeBadge.textContent = 'Local';
      } else {
        timeWhite = timeBlack = 10 * 60 * 1000;
        modeBadge.textContent = 'Normal 10+0';
      }

      game = new Chess();
      selected = null;
      possibleMoves = [];
      lastMove = null;
      gameOver = false;
      thinking = false;
      flipped = playerColor === 'b';
      statusEl.classList.remove('gameover');

      closeModal();
      renderBoard();
      updateMovesList();
      startClock();

      if (mode !== 'local' && playerColor === 'b') {
        setTimeout(aiMove, 300);
      }
    }

    document.getElementById('btnNew').addEventListener('click', openModal);
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    document.getElementById('btnStart').addEventListener('click', startNewGame);

    document.getElementById('btnUndo').addEventListener('click', () => {
      if (thinking || game.history().length === 0) return;
      game.undo();
      if (mode !== 'local' && game.history().length > 0) game.undo();
      lastMove = game.history({ verbose: true }).slice(-1)[0] || null;
      selected = null;
      possibleMoves = [];
      gameOver = false;
      statusEl.classList.remove('gameover');
      renderBoard();
      updateMovesList();
      lastTick = Date.now();
    });

    document.getElementById('btnFlip').addEventListener('click', () => {
      flipped = !flipped;
      renderBoard();
    });

    document.getElementById('btnHint').addEventListener('click', () => {
      if (thinking || gameOver || (mode !== 'local' && game.turn() !== playerColor)) return;
      thinking = true;
      thinkingEl.classList.add('show');
      setTimeout(() => {
        const best = getBestMove(Math.max(2, aiDepth));
        thinking = false;
        thinkingEl.classList.remove('show');
        if (best) {
          selected = best.from;
          possibleMoves = [best];
          renderBoard();
          statusEl.textContent = 'Hint: ' + best.san;
        }
      }, 50);
    });

    document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const isLocal = btn.dataset.mode === 'local';
        document.getElementById('colorSection').style.display = isLocal ? 'none' : '';
        document.getElementById('diffSection').style.display = isLocal ? 'none' : '';
      });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    document.querySelectorAll('.mode-btn[data-diff]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn[data-diff]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });

    openModal();
  </script>
</body>
</html>
