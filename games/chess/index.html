<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess • hello21</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--panel2:#222633;--text:#e8eaed;--muted:#9aa0a6;--accent:#5b8def;--accent2:#3d6fd4;--light:#f0d9b5;--dark:#b58863;--highlight:rgba(91,141,239,.45);--last:rgba(255,213,79,.35);--check:rgba(239,83,80,.55);--danger:#ef5350;--ok:#66bb6a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:520px;padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.25rem;font-weight:700}
header .badge{font-size:.7rem;background:var(--panel2);color:var(--muted);padding:4px 8px;border-radius:999px}
main{width:100%;max-width:520px;padding:0 12px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.profiles{display:flex;gap:8px}
.profile{flex:1;background:var(--panel);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;border:2px solid transparent;transition:border-color .25s,background .25s;position:relative;overflow:hidden}
.profile.active{border-color:var(--accent);background:var(--panel2)}
.profile.thinking-active{border-color:#ffb74d}
.profile .avatar{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.profile .avatar img{width:28px;height:28px;object-fit:contain}
.profile .avatar .sf-icon{font-size:1.3rem}
.profile .info{flex:1;min-width:0}
.profile .name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .sub{font-size:.7rem;color:var(--muted);margin-top:1px}
.profile .clock-time{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.profile.low .clock-time{color:var(--danger)}
.think-ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;border-top-color:#ffb74d;opacity:0;transition:opacity .2s}
.profile.thinking-active .think-ring{opacity:1;animation:spin .8s linear infinite}
.think-pulse{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:3px}
.profile.thinking-active .think-pulse{display:flex}
.think-pulse span{width:5px;height:5px;background:#ffb74d;border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.think-pulse span:nth-child(2){animation-delay:.15s}
.think-pulse span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.captured-row{display:flex;gap:2px;min-height:24px;flex-wrap:wrap;align-items:center;padding:0 2px}
.captured-row img{width:20px;height:20px;object-fit:contain;opacity:.9}
.captured-row .adv{font-size:.75rem;color:var(--muted);margin-left:4px}
.board-area{display:flex;gap:8px;align-items:stretch;max-width:480px;width:100%;margin:0 auto}
.eval-bar{width:14px;border-radius:8px;background:#333;overflow:hidden;position:relative;flex-shrink:0;min-height:100%}
.eval-fill{position:absolute;bottom:0;left:0;right:0;background:#eee;transition:height .35s ease}
.eval-label{position:absolute;left:50%;transform:translateX(-50%);font-size:.55rem;font-weight:700;z-index:2;white-space:nowrap}
.eval-label.top{top:4px;color:#eee}.eval-label.bot{bottom:4px;color:#111}
.board-wrap{position:relative;flex:1;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);touch-action:none}
#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);user-select:none;position:relative}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
.sq.selected{background:var(--highlight)!important}
.sq.last{box-shadow:inset 0 0 0 3px var(--last)}
.sq.check{background:var(--check)!important}
.sq.possible::after{content:'';position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.22);pointer-events:none}
.sq.possible.capture::after{width:88%;height:88%;background:transparent;border:4px solid rgba(0,0,0,.22);border-radius:50%}
.sq img.piece{width:88%;height:88%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;z-index:2}
.sq img.piece.hidden{opacity:0}
.sq .coord{position:absolute;font-size:.55rem;font-weight:600;opacity:.55;pointer-events:none;z-index:1}
.sq .coord.file{bottom:2px;right:3px}.sq .coord.rank{top:2px;left:3px}
.sq.light .coord{color:var(--dark)}.sq.dark .coord{color:var(--light)}
.sliding-piece{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;transition:left .22s cubic-bezier(.25,.1,.25,1),top .22s cubic-bezier(.25,.1,.25,1)}
.sliding-piece img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.opening{text-align:center;font-size:.8rem;color:var(--accent);font-weight:500;min-height:1.2em}
.status{text-align:center;font-size:.9rem;color:var(--muted);min-height:1.3em}
.status.gameover{color:var(--ok);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font-family:inherit;font-size:.85rem;font-weight:600;padding:10px 16px;border:none;border-radius:10px;cursor:pointer;background:var(--panel2);color:var(--text);transition:background .15s,transform .1s;min-height:42px}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent2)}
.moves-panel{background:var(--panel);border-radius:var(--radius);padding:10px 12px;max-height:90px;overflow-y:auto;font-size:.8rem;font-variant-numeric:tabular-nums;line-height:1.5;color:var(--muted)}
.moves-panel span{margin-right:6px}.moves-panel .num{color:var(--text);font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border-radius:16px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 16px 48px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.2rem;margin-bottom:16px;text-align:center}
.modal .section{margin-bottom:16px}
.modal .section label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{padding:12px 8px;border-radius:10px;background:var(--panel2);border:2px solid transparent;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.mode-btn.selected{border-color:var(--accent);background:rgba(91,141,239,.15)}
.mode-btn .title{font-weight:600;font-size:.9rem}
.mode-btn .desc{font-size:.7rem;color:var(--muted);margin-top:2px}
.color-pick{display:flex;gap:8px}
.color-btn{flex:1;padding:10px;border-radius:10px;background:var(--panel2);border:2px solid transparent;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
.color-btn img{width:32px;height:32px}
.color-btn.selected{border-color:var(--accent)}
.modal .actions{display:flex;gap:8px;margin-top:8px}
.modal .actions button{flex:1}
.promo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
.promo-overlay.show{display:flex}
.promo-choices{display:flex;gap:8px;background:var(--panel);padding:12px;border-radius:12px}
.promo-choices button{width:56px;height:56px;padding:4px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.promo-choices button img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<header><h1>♟ Chess</h1><span class="badge" id="modeBadge">Normal</span></header>
<main>
<div class="profiles"><div class="profile" id="profileTop">
<div class="avatar" id="avatarTop"><div class="think-ring"></div><span class="sf-icon">🐟</span></div>
<div class="info"><div class="name" id="nameTop">Stockfish</div><div class="sub" id="subTop">AI · Medium</div></div>
<div class="clock-time" id="timeTop">10:00</div>
<div class="think-pulse"><span></span><span></span><span></span></div>
</div></div>
<div class="captured-row" id="capturedTop"></div>
<div class="board-area">
<div class="eval-bar" id="evalBar" title="Evaluation"><div class="eval-fill" id="evalFill" style="height:50%"></div><span class="eval-label top" id="evalTop"></span><span class="eval-label bot" id="evalBot"></span></div>
<div class="board-wrap"><div id="board"></div><div class="promo-overlay" id="promoOverlay"><div class="promo-choices" id="promoChoices"></div></div></div>
</div>
<div class="captured-row" id="capturedBottom"></div>
<div class="profiles"><div class="profile" id="profileBottom">
<div class="avatar" id="avatarBottom"><div class="think-ring"></div><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wK.svg" alt="You"></div>
<div class="info"><div class="name" id="nameBottom">You</div><div class="sub" id="subBottom">Player</div></div>
<div class="clock-time" id="timeBottom">10:00</div>
<div class="think-pulse"><span></span><span></span><span></span></div>
</div></div>
<div class="opening" id="openingName"></div>
<div class="status" id="status">Your turn</div>
<div class="moves-panel" id="moves"></div>
<div class="controls">
<button class="primary" id="btnNew">New Game</button>
<button id="btnUndo">Undo</button>
<button id="btnFlip">Flip</button>
<button id="btnHint">Hint</button>
<button id="btnMute" title="Toggle sound">🔊</button>
</div>
</main>
<div class="modal-overlay" id="modal"><div class="modal">
<h2>New Game</h2>
<div class="section"><label>Mode</label><div class="mode-grid">
<div class="mode-btn selected" data-mode="normal"><div class="title">Normal</div><div class="desc">10+5 · vs AI</div></div>
<div class="mode-btn" data-mode="blitz"><div class="title">Blitz</div><div class="desc">3+2 · vs AI</div></div>
<div class="mode-btn" data-mode="bullet"><div class="title">Bullet</div><div class="desc">1+1 · vs AI</div></div>
<div class="mode-btn" data-mode="local"><div class="title">Local</div><div class="desc">10+5 · 2 players</div></div>
</div></div>
<div class="section" id="colorSection"><label>Play as</label><div class="color-pick">
<div class="color-btn selected" data-color="w"><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/wK.svg" alt="White"></div>
<div class="color-btn" data-color="b"><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/bK.svg" alt="Black"></div>
<div class="color-btn" data-color="random">🎲</div>
</div></div>
<div class="section" id="diffSection"><label>AI Strength</label><div class="mode-grid">
<div class="mode-btn selected" data-diff="1"><div class="title">Easy</div><div class="desc">Depth 1</div></div>
<div class="mode-btn" data-diff="2"><div class="title">Medium</div><div class="desc">Depth 2</div></div>
<div class="mode-btn" data-diff="3"><div class="title">Hard</div><div class="desc">Depth 3</div></div>
<div class="mode-btn" data-diff="4"><div class="title">Master</div><div class="desc">Depth 4</div></div>
</div></div>
<div class="actions"><button id="btnCancel">Cancel</button><button class="primary" id="btnStart">Start</button></div>
</div></div>
<script src="game.js"></script>
</body></html>
