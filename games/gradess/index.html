<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broward County Public Schools - Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #1a3a5c 0%, #213c6b 50%, #2a5080 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lock-card {
      background: white;
      border-radius: 10px;
      padding: 40px 44px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    }
    .lock-icon { font-size: 52px; margin-bottom: 12px; }
    h1 { font-size: 22px; color: #c0392b; margin-bottom: 12px; }
    p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 22px; }
    a {
      display: inline-block;
      background: #e67e22;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 15px;
    }
    a:hover { background: #d35400; }
    .countdown { margin-top: 16px; font-size: 12px; color: #888; }
    #status { font-size: 13px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="lock-card" id="card">
    <div class="lock-icon">🔒</div>
    <h1 id="title">Checking session...</h1>
    <p id="msg">Please wait.</p>
    <a href="login.html" id="loginBtn" style="display:none">Go to Login</a>
    <div class="countdown" id="countdown"></div>
    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cfwsxpdbmefnnxrunoue.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ByXgX6dPutVaTbluUs2fwg_p1A6Gc8I';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user) {
          // Logged in → go to the actual portal
          window.location.replace('portal.html');
          return;
        }
      } catch (e) {
        console.error(e);
      }

      // Not logged in → show Access Denied
      document.getElementById('title').textContent = 'Access Denied';
      document.getElementById('msg').innerHTML = 'You must log in to view the student portal.<br>Unauthorized access is not allowed.';
      document.getElementById('loginBtn').style.display = 'inline-block';

      let n = 3;
      const cd = document.getElementById('countdown');
      cd.textContent = 'Redirecting in ' + n + ' seconds...';
      const t = setInterval(() => {
        n--;
        if (n <= 0) {
          clearInterval(t);
          window.location.replace('login.html');
        } else {
          cd.textContent = 'Redirecting in ' + n + ' second' + (n === 1 ? '' : 's') + '...';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
