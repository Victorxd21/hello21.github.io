<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slendytubbies: Secret Custard Hunt</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #050b08;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
  }
  #game-canvas, #flashlight-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #flashlight-canvas {
    pointer-events: none;
  }

  /* Screens & Modals */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(5, 11, 8, 0.88);
    backdrop-filter: blur(8px);
  }
  .hidden { display: none !important; }

  .panel {
    background: #0f1a15;
    border: 1px solid #1c3327;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    font-weight: 800;
    color: #4ade80;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(74, 222, 128, 0.2);
  }
  p {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-bottom: 24px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #274d39;
    background: #08100c;
    color: #f8fafc;
    font-size: 1rem;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #4ade80;
  }
  button {
    width: 100%;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: #052e16;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
  }
  button:hover {
    background: #4ade80;
  }
  button:active {
    transform: scale(0.98);
  }

  /* HUD UI */
  #game-ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .hud-panel {
    position: absolute;
    background: rgba(15, 26, 21, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(28, 51, 39, 0.6);
    padding: 12px 20px;
    border-radius: 8px;
    color: #f8fafc;
  }
  #hud-top-left { top: 20px; left: 20px; }
  #hud-top-right { top: 20px; right: 20px; text-align: right; }
  #hud-controls { bottom: 20px; left: 20px; font-size: 0.85rem; }

  .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; }
  .stat-value { font-size: 1.25rem; font-weight: 700; color: #4ade80; }

  /* Map Overlay */
  #map-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #map-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  #big-map-canvas {
    border: 2px solid #274d39;
    border-radius: 8px;
    background: #08130f;
  }

  .control-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 4px;
    color: #cbd5e1;
  }
  .key {
    background: #1c3327;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.8rem;
    color: #4ade80;
  }

  #center-message {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.5rem;
    font-weight: 800;
    color: #ef4444;
    text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 6;
  }
  #center-message.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<canvas id="flashlight-canvas"></canvas>

<!-- Main Menu Screen -->
<div id="menu-screen" class="screen">
  <div class="panel">
    <h1>Slendytubbies</h1>
    <p>Secret Custard Hunt</p>
    <input type="text" id="name-input" placeholder="Enter your nickname..." maxlength="12" value="Tubby">
    <button id="play-btn">ENTER FOREST</button>
  </div>
</div>

<!-- Lobby Screen -->
<div id="lobby-screen" class="screen hidden">
  <div class="panel">
    <h2>LOBBY</h2>
    <p style="margin-bottom:12px;">Waiting for forest match start...</p>
    <div id="player-list" style="margin-bottom: 20px; color: #a7f3d0; font-size: 0.9rem;">Connecting to network...</div>
    <button id="disconnect-btn" style="background:#dc2626; color:#fff;">LEAVE LOBBY</button>
  </div>
</div>

<!-- Game HUD -->
<div id="game-ui" class="hidden">
  <div id="hud-top-left" class="hud-panel">
    <div class="stat-label">Custards Remaining</div>
    <div id="custard-value" class="stat-value">10</div>
  </div>

  <div id="hud-top-right" class="hud-panel">
    <div class="stat-label">Survivors Alive</div>
    <div id="alive-value" class="stat-value">1</div>
    <div class="stat-label" style="margin-top:4px;">Time Left</div>
    <div id="timer-value" style="font-weight:700; color:#cbd5e1;">05:00</div>
  </div>

  <div id="hud-controls" class="hud-panel">
    <div id="control-role" class="stat-label" style="margin-bottom: 4px; color:#4ade80;">SURVIVOR CONTROLS</div>
    <div id="control-list"></div>
    <div id="flashlight-state" style="margin-top: 6px; font-size: 0.75rem; color:#94a3b8;">FLASHLIGHT ON</div>
  </div>

  <div id="center-message"></div>
</div>

<!-- Big Map Overlay -->
<div id="map-overlay">
  <canvas id="big-map-canvas" width="500" height="500"></canvas>
</div>

<!-- Game Over Modal -->
<div id="game-over-screen" class="screen hidden">
  <div class="panel">
    <h1 id="game-over-title">MATCH OVER</h1>
    <p id="game-over-desc">The fog clears...</p>
    <button id="return-lobby-btn">RETURN TO LOBBY</button>
  </div>
</div>

<script>
(() => {
  const GAME = {
    worldSize: 2400,
    playerRadius: 16,
    baseSpeed: 180,
    sprintSpeed: 270,
    custardCount: 10,
    mapTreesCount: 120,
    mapRocksCount: 40
  };

  const state = {
    playerName: '',
    playerId: 'p_' + Math.random().toString(36).substring(2, 9),
    inGame: false,
    inLobby: false,
    role: 'survivor',
    alive: true,
    x: 1200,
    y: 1200,
    vx: 0,
    vy: 0,
    flashlightOn: true,
    killerTrueForm: false,
    stealth: false,
    stealthEndsAt: 0,
    map: null,
    custards: [],
    collectedCustards: new Set(),
    players: new Map(),
    roundEndsAt: Date.now() + 300000,
    lastFrame: performance.now()
  };

  // Canvas context setup
  const gameCanvas = document.getElementById('game-canvas');
  const ctx = gameCanvas.getContext('2d');
  const flashlightCanvas = document.getElementById('flashlight-canvas');
  const flashlightCtx = flashlightCanvas.getContext('2d');
  const bigMap = document.getElementById('big-map-canvas');
  const bigMapCtx = bigMap.getContext('2d');

  // DOM Elements
  const menuScreen = document.getElementById('menu-screen');
  const lobbyScreen = document.getElementById('lobby-screen');
  const gameUi = document.getElementById('game-ui');
  const nameInput = document.getElementById('name-input');
  const playBtn = document.getElementById('play-btn');
  const disconnectBtn = document.getElementById('disconnect-btn');
  const returnLobbyBtn = document.getElementById('return-lobby-btn');
  const gameOver = document.getElementById('game-over-screen');
  const custardValue = document.getElementById('custard-value');
  const aliveValue = document.getElementById('alive-value');
  const timerValue = document.getElementById('timer-value');
  const controlRole = document.getElementById('control-role');
  const controlList = document.getElementById('control-list');
  const flashlightState = document.getElementById('flashlight-state');
  const centerMessage = document.getElementById('center-message');
  const mapOverlay = document.getElementById('map-overlay');

  const keys = {};

  function resize() {
    gameCanvas.width = flashlightCanvas.width = window.innerWidth;
    gameCanvas.height = flashlightCanvas.height = window.innerHeight;
  }

  // Generate Map Procedurally
  function generateMap() {
    const trees = [];
    const rocks = [];
    const custards = [];

    // Simple pseudo-random map generation
    for (let i = 0; i < GAME.mapTreesCount; i++) {
      trees.push({
        x: Math.random() * (GAME.worldSize - 200) + 100,
        y: Math.random() * (GAME.worldSize - 200) + 100,
        size: Math.random() * 20 + 25,
        type: Math.random() > 0.85 ? 'dead' : 'normal'
      });
    }

    for (let i = 0; i < GAME.mapRocksCount; i++) {
      rocks.push({
        x: Math.random() * (GAME.worldSize - 200) + 100,
        y: Math.random() * (GAME.worldSize - 200) + 100,
        r: Math.random() * 12 + 10
      });
    }

    for (let i = 0; i < GAME.custardCount; i++) {
      custards.push({
        id: i,
        x: Math.random() * (GAME.worldSize - 300) + 150,
        y: Math.random() * (GAME.worldSize - 300) + 150,
        glow: Math.random() * Math.PI * 2
      });
    }

    return { trees, rocks, custards };
  }

  function connectGlobal() {
    // Generate map locally for offline/standalone execution
    state.map = generateMap();
    state.custards = state.map.custards;
    state.inGame = true;
    state.roundEndsAt = Date.now() + 300000; // 5 minutes
    showScreen('game');
    updateControlsUI();
    return Promise.resolve(true);
  }

  function trackPresence(loc) {}
  function handlePresenceSync() {}

  function isStealthed() {
    return state.stealth && Date.now() < state.stealthEndsAt;
  }

  // ------------------------------------------------------------
  // INPUT HANDLING
  // ------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (state.inGame && state.alive) {
      if (e.key.toLowerCase() === 'f' && state.role === 'survivor') {
        state.flashlightOn = !state.flashlightOn;
        updateControlsUI();
      }
      if (e.key.toLowerCase() === 't' && state.role === 'killer') {
        state.killerTrueForm = !state.killerTrueForm;
        showCenterMessage(state.killerTrueForm ? 'TRANSFORMED TO TRUE FORM' : 'RETURNED TO DISGUISE');
        updateControlsUI();
      }
      if (e.key.toLowerCase() === 'q' && state.role === 'killer') {
        state.stealth = true;
        state.stealthEndsAt = Date.now() + 5000;
        showCenterMessage('INVISIBILITY ACTIVE (5s)');
      }
      if (e.key.toLowerCase() === 'm') {
        toggleBigMap();
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // ------------------------------------------------------------
  // UPDATE LOOP
  // ------------------------------------------------------------
  function update(dt) {
    if (!state.inGame || !state.alive) return;

    let moveX = 0;
    let moveY = 0;

    if (keys['w'] || keys['arrowup']) moveY -= 1;
    if (keys['s'] || keys['arrowdown']) moveY += 1;
    if (keys['a'] || keys['arrowleft']) moveX -= 1;
    if (keys['d'] || keys['arrowright']) moveX += 1;

    // Normalize diagonal movement
    if (moveX !== 0 && moveY !== 0) {
      moveX *= 0.7071;
      moveY *= 0.7071;
    }

    const currentSpeed = keys['shift'] ? GAME.sprintSpeed : GAME.baseSpeed;
    state.x += moveX * currentSpeed * dt;
    state.y += moveY * currentSpeed * dt;

    // World Boundary Constraints
    state.x = Math.max(GAME.playerRadius, Math.min(GAME.worldSize - GAME.playerRadius, state.x));
    state.y = Math.max(GAME.playerRadius, Math.min(GAME.worldSize - GAME.playerRadius, state.y));

    // Custard Collection Collision Check
    if (state.role === 'survivor') {
      for (const c of state.custards) {
        if (!state.collectedCustards.has(c.id)) {
          const dist = Math.hypot(state.x - c.x, state.y - c.y);
          if (dist < GAME.playerRadius + 12) {
            state.collectedCustards.add(c.id);
            showCenterMessage('CUSTARD COLLECTED');
            updateHud();
            if (state.collectedCustards.size >= GAME.custardCount) {
              triggerWin();
            }
          }
        }
      }
    }

    updateHud();
  }

  function triggerWin() {
    state.inGame = false;
    document.getElementById('game-over-title').textContent = 'SURVIVORS ESCAPED';
    document.getElementById('game-over-desc').textContent = 'All secret custards were collected!';
    gameOver.classList.add('show');
  }

  function cameraOffset() {
    return {
      x: state.x - innerWidth / 2,
      y: state.y - innerHeight / 2
    };
  }

  // ------------------------------------------------------------
  // RENDERING
  // ------------------------------------------------------------
  function drawBackground(cam) {
    ctx.fillStyle = '#0a1610';
    ctx.fillRect(0, 0, innerWidth, innerHeight);

    // Draw Grid Lines
    ctx.strokeStyle = 'rgba(20, 45, 30, 0.4)';
    ctx.lineWidth = 1;
    const gridSize = 100;

    const startX = Math.floor(cam.x / gridSize) * gridSize;
    const startY = Math.floor(cam.y / gridSize) * gridSize;

    for (let x = startX; x < cam.x + innerWidth + gridSize; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x - cam.x, 0);
      ctx.lineTo(x - cam.x, innerHeight);
      ctx.stroke();
    }

    for (let y = startY; y < cam.y + innerHeight + gridSize; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y - cam.y);
      ctx.lineTo(innerWidth, y - cam.y);
      ctx.stroke();
    }
  }

  function drawPaths(cam) {}

  function drawRocks(cam) {
    if (!state.map) return;
    for (const r of state.map.rocks) {
      if (r.x < cam.x - 100 || r.x > cam.x + innerWidth + 100 || r.y < cam.y - 100 || r.y > cam.y + innerHeight + 100) continue;
      ctx.fillStyle = '#22332a';
      ctx.beginPath();
      ctx.arc(r.x - cam.x, r.y - cam.y, r.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTrees(cam) {
    if (!state.map) return;
    for (const t of state.map.trees) {
      if (t.x < cam.x - 120 || t.x > cam.x + innerWidth + 120 || t.y < cam.y - 120 || t.y > cam.y + innerHeight + 120) continue;
      
      const screenX = t.x - cam.x;
      const screenY = t.y - cam.y;

      // Tree Trunk / Ground Base Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.arc(screenX + 5, screenY + 5, t.size, 0, Math.PI * 2);
      ctx.fill();

      // Canopy
      ctx.fillStyle = t.type === 'dead' ? '#1c261e' : '#143322';
      ctx.beginPath();
      ctx.arc(screenX, screenY, t.size, 0, Math.PI * 2);
      ctx.fill();

      // Inner Foliage Details
      ctx.fillStyle = t.type === 'dead' ? '#131c15' : '#1d4830';
      ctx.beginPath();
      ctx.arc(screenX - t.size * 0.2, screenY - t.size * 0.2, t.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCustards(cam) {
    const time = performance.now() * 0.003;
    for (const c of state.custards) {
      if (state.collectedCustards.has(c.id)) continue;
      if (c.x < cam.x - 80 || c.x > cam.x + innerWidth + 80 || c.y < cam.y - 80 || c.y > cam.y + innerHeight + 80) continue;

      const sx = c.x - cam.x;
      const sy = c.y - cam.y + Math.sin(time + c.glow) * 3;

      // Glow
      ctx.fillStyle = 'rgba(250, 204, 21, 0.22)';
      ctx.beginPath();
      ctx.arc(sx, sy, 18, 0, Math.PI * 2);
      ctx.fill();

      // Custard Bowl / Tub
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(sx, sy, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(sx - 2, sy - 2, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayers(cam) {
    const all = [...state.players.values()];

    // Make sure local player is included in rendering pipeline
    if (!state.players.has(state.playerId)) {
      all.push({
        id: state.playerId,
        name: state.playerName,
        role: state.role,
        alive: state.alive,
        x: state.x,
        y: state.y,
        killerTrueForm: state.killerTrueForm,
        invisible: isStealthed()
      });
    }

    for (const p of all) {
      if (!p.alive) continue;
      if (p.id !== state.playerId && p.invisible) continue; // Stealth check

      const sx = p.x - cam.x;
      const sy = p.y - cam.y;

      if (sx < -60 || sx > innerWidth + 60 || sy < -60 || sy > innerHeight + 60) continue;

      const isLocal = p.id === state.playerId;
      const isKiller = p.role === 'killer';

      // Player Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(sx + 3, sy + 3, GAME.playerRadius, 0, Math.PI * 2);
      ctx.fill();

      // Player Body
      if (isKiller && p.killerTrueForm) {
        ctx.fillStyle = '#ef4444'; // Red Monster Form
      } else {
        ctx.fillStyle = isLocal ? '#4ade80' : '#67e8f9'; // Local Survivor vs Other Survivor
      }

      ctx.beginPath();
      ctx.arc(sx, sy, GAME.playerRadius, 0, Math.PI * 2);
      ctx.fill();

      // Inner Core Accent
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(sx - 3, sy - 3, GAME.playerRadius * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Name Indicator
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#effff6';
      ctx.fillText(p.name || 'Survivor', sx, sy - GAME.playerRadius - 8);
    }
  }

  function drawFlashlightOverlay() {
    flashlightCtx.clearRect(0, 0, innerWidth, innerHeight);

    if (!state.inGame || !state.alive) return;

    const opacity = state.flashlightOn ? 0.82 : 0.96;
    flashlightCtx.fillStyle = `rgba(3, 8, 6, ${opacity})`;
    flashlightCtx.fillRect(0, 0, innerWidth, innerHeight);

    if (state.flashlightOn) {
      flashlightCtx.save();
      flashlightCtx.globalCompositeOperation = 'destination-out';

      const cx = innerWidth / 2;
      const cy = innerHeight / 2;

      // Primary Vision Beam Cone / Circle
      const grad = flashlightCtx.createRadialGradient(cx, cy, 20, cx, cy, 260);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(0.7, 'rgba(0,0,0,0.8)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      flashlightCtx.fillStyle = grad;
      flashlightCtx.beginPath();
      flashlightCtx.arc(cx, cy, 260, 0, Math.PI * 2);
      flashlightCtx.fill();

      flashlightCtx.restore();
    }
  }

  function renderBigMap() {
    if (!state.map) return;
    bigMapCtx.fillStyle = '#08130f';
    bigMapCtx.fillRect(0, 0, bigMap.width, bigMap.height);

    const scale = bigMap.width / GAME.worldSize;

    // Draw Trees
    bigMapCtx.fillStyle = '#143322';
    for (const t of state.map.trees) {
      bigMapCtx.beginPath();
      bigMapCtx.arc(t.x * scale, t.y * scale, Math.max(1, t.size * scale), 0, Math.PI * 2);
      bigMapCtx.fill();
    }

    // Draw Custards
    bigMapCtx.fillStyle = '#facc15';
    for (const c of state.custards) {
      if (state.collectedCustards.has(c.id)) continue;
      bigMapCtx.beginPath();
      bigMapCtx.arc(c.x * scale, c.y * scale, 3, 0, Math.PI * 2);
      bigMapCtx.fill();
    }

    // Draw Self Location
    bigMapCtx.fillStyle = '#4ade80';
    bigMapCtx.strokeStyle = '#ffffff';
    bigMapCtx.lineWidth = 2;
    bigMapCtx.beginPath();
    bigMapCtx.arc(state.x * scale, state.y * scale, 6, 0, Math.PI * 2);
    bigMapCtx.fill();
    bigMapCtx.stroke();
  }

  function toggleBigMap() {
    mapOverlay.classList.toggle('show');
    if (mapOverlay.classList.contains('show')) {
      renderBigMap();
    }
  }

  // ------------------------------------------------------------
  // UI & HUD UPDATES
  // ------------------------------------------------------------
  function showScreen(name) {
    menuScreen.classList.add('hidden');
    lobbyScreen.classList.add('hidden');
    gameUi.classList.add('hidden');

    if (name === 'menu') menuScreen.classList.remove('hidden');
    if (name === 'lobby') lobbyScreen.classList.remove('hidden');
    if (name === 'game') gameUi.classList.remove('hidden');
  }

  function updateHud() {
    if (!state.inGame) return;
    const remaining = GAME.custardCount - state.collectedCustards.size;
    custardValue.textContent = remaining;

    const aliveCount = [...state.players.values()].filter(p => p.role === 'survivor' && p.alive !== false).length + (state.role === 'survivor' && state.alive ? 1 : 0);
    aliveValue.textContent = aliveCount;

    const secondsLeft = Math.max(0, Math.ceil((state.roundEndsAt - Date.now()) / 1000));
    const mins = Math.floor(secondsLeft / 60);
    const secs = secondsLeft % 60;
    timerValue.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function updateControlsUI() {
    controlRole.textContent = state.role === 'killer' ? 'KILLER CONTROLS' : 'SURVIVOR CONTROLS';
    flashlightState.textContent = state.role === 'killer' ? (state.killerTrueForm ? 'TRUE FORM ACTIVE' : 'DISGUISED FORM') : (state.flashlightOn ? 'FLASHLIGHT ON' : 'FLASHLIGHT OFF');

    if (state.role === 'killer') {
      controlList.innerHTML = `
        <div class="control-row"><span>Move</span><span class="key">W A S D</span></div>
        <div class="control-row"><span>Run</span><span class="key">SHIFT</span></div>
        <div class="control-row"><span>Transform</span><span class="key">T</span></div>
        <div class="control-row"><span>Kill</span><span class="key">E</span></div>
        <div class="control-row"><span>Invisibility</span><span class="key">Q</span></div>
        <div class="control-row"><span>Map</span><span class="key">M</span></div>
      `;
    } else {
      controlList.innerHTML = `
        <div class="control-row"><span>Move</span><span class="key">W A S D</span></div>
        <div class="control-row"><span>Run</span><span class="key">SHIFT</span></div>
        <div class="control-row"><span>Flashlight</span><span class="key">F</span></div>
        <div class="control-row"><span>Map</span><span class="key">M</span></div>
      `;
    }
  }

  function showCenterMessage(msg) {
    centerMessage.textContent = msg;
    centerMessage.classList.add('show');
    clearTimeout(showCenterMessage._timer);
    showCenterMessage._timer = setTimeout(() => centerMessage.classList.remove('show'), 2200);
  }

  // ------------------------------------------------------------
  // INITIALIZATION & MAIN LOOP
  // ------------------------------------------------------------
  playBtn.addEventListener('click', async () => {
    const val = nameInput.value.trim();
    if (!val) {
      nameInput.focus();
      return;
    }
    state.playerName = val;
    playBtn.disabled = true;
    playBtn.textContent = 'CONNECTING...';

    const ok = await connectGlobal();
    if (!ok) {
      playBtn.disabled = false;
      playBtn.textContent = 'RETRY CONNECTION';
    }
  });

  disconnectBtn.addEventListener('click', () => {
    state.inGame = false;
    state.inLobby = true;
    showScreen('lobby');
  });

  returnLobbyBtn.addEventListener('click', () => {
    gameOver.classList.remove('show');
    state.inGame = false;
    state.inLobby = true;
    showScreen('lobby');
  });

  window.addEventListener('resize', resize);
  resize();

  function loop(now) {
    const dt = Math.min((now - state.lastFrame) / 1000, 0.1);
    state.lastFrame = now;

    if (state.inGame) {
      update(dt);
      const cam = cameraOffset();
      drawBackground(cam);
      drawPaths(cam);
      drawRocks(cam);
      drawCustards(cam);
      drawPlayers(cam);
      drawTrees(cam);
      drawFlashlightOverlay();
    } else {
      ctx.fillStyle = '#08130f';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
