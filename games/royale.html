<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer Battle Royale</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090d16; color: #f8fafc; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .hud-panel { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(5px); pointer-events: auto; }
        
        #top-hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .stats-group { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 6px; border-bottom: 3px solid #3b82f6; }
        .stat-value { font-size: 20px; color: #60a5fa; }

        /* Weapon Bar HUD */
        #weapon-bar { display: flex; gap: 8px; margin-top: 10px; pointer-events: auto; }
        .weapon-slot { width: 60px; height: 60px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.15); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #94a3b8; position: relative; transition: all 0.2s; }
        .weapon-slot.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); color: #fff; transform: translateY(-3px); }
        .weapon-slot .key-num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #64748b; }

        #killfeed { position: absolute; top: 120px; right: 20px; width: 250px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; pointer-events: none; }
        .kill-msg { background: rgba(0, 0, 0, 0.8); padding: 5px 10px; border-radius: 4px; font-size: 12px; border-left: 3px solid #ef4444; animation: fadeInOut 4s forwards; }

        #bottom-hud { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .health-bar-container { width: 250px; background: rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; height: 22px; border: 1px solid rgba(255,255,255,0.2); position: relative; }
        #health-bar-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s linear; }
        .health-text { position: absolute; width: 100%; text-align: center; top: 1px; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 2px black; }

        #minimap-container { width: 180px; height: 110px; background: rgba(15, 23, 42, 0.9); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; position: relative; }
        #minimap-canvas { width: 100%; height: 100%; }

        /* Screens & Modals */
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.96); display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; }
        .modal-card { background: #131d31; border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); max-height: 90vh; overflow-y: auto; }
        .modal-card h1 { margin-bottom: 15px; font-size: 24px; color: #f8fafc; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 10px; margin-bottom: 12px; background: #090d16; border: 1px solid #1e293b; color: white; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 11px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        .btn:hover { background: #2563eb; }

        /* Keybind list table */
        .keybind-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: #94a3b8; background: #090d16; padding: 6px 10px; border-radius: 4px; }
        .keybind-btn { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; min-width: 60px; text-align: center; }
        .keybind-btn.listening { background: #ef4444; border-color: #f87171; }

        canvas { display: block; background: #090d16; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" style="display: none;">
        <div id="top-hud">
            <div class="stats-group">
                <div class="stat-box"><span>ALIVE</span><span id="stat-alive" class="stat-value">1</span></div>
                <div class="stat-box"><span>KILLS</span><span id="stat-kills" class="stat-value">0</span></div>
                <div class="stat-box"><span>AMMO</span><span id="stat-ammo" class="stat-value">60</span></div>
                <div class="stat-box" style="border-color: #a855f7;"><span>MODE</span><span id="stat-mode" class="stat-value" style="color:#c084fc;">COMBAT</span></div>
            </div>
            <!-- Weapon Slots UI -->
            <div id="weapon-bar">
                <div class="weapon-slot active" id="w-slot-1"><span class="key-num">1</span>Pistol</div>
                <div class="weapon-slot" id="w-slot-2"><span class="key-num">2</span>Shotgun</div>
                <div class="weapon-slot" id="w-slot-3"><span class="key-num">3</span>Assault</div>
                <div class="weapon-slot" id="w-slot-4"><span class="key-num">4</span>Sniper</div>
            </div>
        </div>

        <div id="killfeed"></div>

        <div id="bottom-hud">
            <div class="health-bar-container">
                <div id="health-bar-fill"></div>
                <div class="health-text" id="health-text">100 / 100</div>
            </div>
            <div id="minimap-container">
                <canvas id="minimap-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Lobby & Settings Screen -->
    <div id="lobby-screen" class="screen-overlay">
        <div class="modal-card">
            <h1>PLATFORMER ROYALE</h1>
            <input type="text" id="player-name" class="form-control" placeholder="Operator Callsign" maxlength="12" value="Brawler">
            
            <div style="display: flex; gap: 10px; margin-bottom: 12px; align-items: center; justify-content: space-between;">
                <span style="font-size: 13px; color: #94a3b8;">Operator Color:</span>
                <input type="color" id="player-color" value="#3b82f6" style="width: 60px; height: 35px; background: none; border: none; cursor: pointer;">
            </div>

            <div style="text-align: left; font-size: 13px; color: #94a3b8; margin-bottom: 5px; font-weight: bold;">KEYBIND CONFIGURATION:</div>
            <div id="keybinds-config-list" style="margin-bottom: 15px;"></div>

            <button class="btn" id="join-btn">DEPLOY TO ARENA</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-overlay" style="display: none;">
        <div class="modal-card">
            <h1 id="gameover-title" style="color: #ef4444;">ELIMINATED</h1>
            <p id="gameover-stats" style="margin-bottom: 20px; color: #94a3b8;">Placement: #1<br>Kills: 0</p>
            <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://khpndifubrgpvpnwlwmm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E2QiUI92Kg8Pvag2D2YHnQ_JuQ54FYI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            minimapCanvas.width = 180;
            minimapCanvas.height = 110;
        }
        window.addEventListener('resize', resize);
        resize();

        // Massive Horizontal Map Dimensions
        const WORLD_WIDTH = 6000;
        const WORLD_HEIGHT = 1600;
        const GROUND_Y = 1350;

        // Keybindings configuration map
        let keybinds = {
            left: 'KeyA',
            right: 'KeyD',
            jump: 'KeyW',
            shoot: 'KeyE',
            wall: 'KeyZ',
            stairs: 'KeyX',
            floor: 'KeyC',
            cone: 'KeyV',
            edit: 'KeyF',
            slot1: 'Digit1',
            slot2: 'Digit2',
            slot3: 'Digit3',
            slot4: 'Digit4'
        };

        const keybindLabels = {
            left: 'Move Left (A)',
            right: 'Move Right (D)',
            jump: 'Jump / Climb (W)',
            shoot: 'Shoot Weapon (E)',
            wall: 'Build Wall (Z)',
            stairs: 'Build Stairs (X)',
            floor: 'Build Floor (C)',
            cone: 'Build Cone (V)',
            edit: 'Toggle Edit Mode (F)',
            slot1: 'Weapon 1 (Pistol)',
            slot2: 'Weapon 2 (Shotgun)',
            slot3: 'Weapon 3 (Assault)',
            slot4: 'Weapon 4 (Sniper)'
        };

        const kbList = document.getElementById('keybinds-config-list');
        function renderKeybindUI() {
            kbList.innerHTML = '';
            for (let action in keybinds) {
                const row = document.createElement('div');
                row.className = 'keybind-row';
                row.innerHTML = `<span>${keybindLabels[action] || action}</span><button class="keybind-btn" data-action="${action}">${keybinds[action].replace('Key','').replace('Digit','')}</button>`;
                kbList.appendChild(row);
            }

            document.querySelectorAll('.keybind-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = e.target.getAttribute('data-action');
                    e.target.innerText = '...';
                    e.target.classList.add('listening');

                    const listener = (evt) => {
                        evt.preventDefault();
                        keybinds[action] = evt.code;
                        window.removeEventListener('keydown', listener);
                        renderKeybindUI();
                    };
                    window.addEventListener('keydown', listener, { once: true });
                });
            });
        }
        renderKeybindUI();

        // Weapons Config
        const weapons = {
            1: { name: 'Pistol', damage: 18, fireRate: 300, ammoCost: 1, speed: 14, spread: 0.04, pellets: 1 },
            2: { name: 'Shotgun', damage: 12, fireRate: 800, ammoCost: 3, speed: 11, spread: 0.22, pellets: 5 },
            3: { name: 'Assault', damage: 14, fireRate: 150, ammoCost: 1, speed: 16, spread: 0.07, pellets: 1 },
            4: { name: 'Sniper', damage: 75, fireRate: 1200, ammoCost: 5, speed: 25, spread: 0.0, pellets: 1 }
        };

        const player = {
            id: 'user_' + Math.random().toString(36).substr(2, 9),
            name: 'Brawler',
            color: '#3b82f6',
            x: 500,
            y: 1000,
            width: 28,
            height: 48,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -13,
            gravity: 0.55,
            isGrounded: false,
            facing: 1, // 1 for right, -1 for left
            hp: 100,
            maxHp: 100,
            ammo: 60,
            maxAmmo: 100,
            kills: 0,
            isDead: false,
            activeSlot: 1,
            buildMode: false,
            editMode: false,
            selectedBuildType: 'wall'
        };

        let remotePlayers = {};
        let bullets = [];
        let loots = [];
        let platforms = []; // Static world platforms
        let structures = []; // Player built structures [{id, type, x, y, w, h, hp, owner}]
        
        // Horizontal Shrinking Storm (closes from left and right edges toward center)
        let storm = { 
            xMin: 0, 
            xMax: WORLD_WIDTH, 
            shrinkSpeed: 0.35,
            targetMin: 1800,
            targetMax: 4200
        };

        let keys = {};
        let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
        let gameStarted = false;
        let channel = null;
        let lastShotTime = 0;

        // Generate Horizontal Platforms & Terrain
        platforms.push({ x: 0, y: GROUND_Y, w: WORLD_WIDTH, h: 250 }); // Main floor

        for (let i = 0; i < 45; i++) {
            platforms.push({
                x: Math.random() * (WORLD_WIDTH - 400) + 200,
                y: Math.random() * (GROUND_Y - 400) + 300,
                w: Math.random() * 160 + 100,
                h: 24
            });
        }

        // Spawn Loot Crates
        for (let i = 0; i < 60; i++) {
            loots.push({
                id: 'loot_' + i,
                x: Math.random() * (WORLD_WIDTH - 200) + 100,
                y: Math.random() * (GROUND_Y - 200) + 100,
                type: Math.random() > 0.4 ? 'ammo' : 'health'
            });
        }

        // Input Listeners
        window.addEventListener('keydown', e => {
            if (!gameStarted || player.isDead) return;
            keys[e.code] = true;

            // Weapon slot switching
            if (e.code === keybinds.slot1) switchWeapon(1);
            if (e.code === keybinds.slot2) switchWeapon(2);
            if (e.code === keybinds.slot3) switchWeapon(3);
            if (e.code === keybinds.slot4) switchWeapon(4);

            // Toggle Edit mode
            if (e.code === keybinds.edit) {
                player.editMode = !player.editMode;
                player.buildMode = false;
                document.getElementById('stat-mode').innerText = player.editMode ? 'EDITING' : (player.buildMode ? 'BUILDING' : 'COMBAT');
            }

            // Build selections
            if (e.code === keybinds.wall) selectBuild('wall');
            if (e.code === keybinds.stairs) selectBuild('stairs');
            if (e.code === keybinds.floor) selectBuild('floor');
            if (e.code === keybinds.cone) selectBuild('cone');
        });

        window.addEventListener('keyup', e => { keys[e.code] = false; });

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.worldX = player.x + (mouse.x - canvas.width / 2);
            mouse.worldY = player.y + (mouse.y - canvas.height / 2);
            if (mouse.worldX < player.x) player.facing = -1;
            else player.facing = 1;
        });

        window.addEventListener('mousedown', () => {
            if (!gameStarted || player.isDead) return;

            if (player.editMode) {
                structures.forEach((s, idx) => {
                    if (Math.hypot(mouse.worldX - (s.x + s.w/2), mouse.worldY - (s.y + s.h/2)) < 50) {
                        structures.splice(idx, 1);
                        broadcastStructureAction('delete', s.id);
                    }
                });
            } else if (player.buildMode) {
                const buildX = Math.round(player.x + player.facing * 60);
                const buildY = Math.round(player.y);
                const newStruct = {
                    id: player.id + '_struct_' + Date.now(),
                    type: player.selectedBuildType,
                    x: buildX,
                    y: buildY,
                    w: 40,
                    h: 40,
                    hp: 150,
                    owner: player.id
                };
                structures.push(newStruct);
                broadcastStructureAction('create', newStruct);
            }
        });

        function switchWeapon(slot) {
            player.activeSlot = slot;
            player.buildMode = false;
            player.editMode = false;
            document.getElementById('stat-mode').innerText = 'COMBAT';
            document.querySelectorAll('.weapon-slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`w-slot-${slot}`).classList.add('active');
        }

        function selectBuild(type) {
            player.buildMode = true;
            player.editMode = false;
            player.selectedBuildType = type;
            document.getElementById('stat-mode').innerText = `BUILD (${type.toUpperCase()})`;
        }

        document.getElementById('join-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) player.name = nameInput;
            player.color = document.getElementById('player-color').value;

            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            gameStarted = true;

            initMultiplayer();
            requestAnimationFrame(gameLoop);
        });

        function initMultiplayer() {
            channel = supabaseClient.channel('platformer_royale_room_v1', {
                config: { broadcast: { self: false } }
            });

            channel.on('broadcast', { event: 'state' }, payload => {
                remotePlayers[payload.payload.id] = payload.payload;
            })
            .on('broadcast', { event: 'shoot' }, payload => {
                bullets.push(payload.payload);
            })
            .on('broadcast', { event: 'hit' }, payload => {
                if (payload.payload.targetId === player.id) {
                    player.hp -= payload.payload.damage;
                    updateHealthBar();
                    if (player.hp <= 0 && !player.isDead) handlePlayerDeath(payload.payload.killerName);
                }
            })
            .on('broadcast', { event: 'structure' }, payload => {
                const data = payload.payload;
                if (data.action === 'create') structures.push(data.struct);
                else if (data.action === 'delete') structures = structures.filter(s => s.id !== data.id);
            })
            .subscribe(status => {
                if (status === 'SUBSCRIBED') {
                    setInterval(sendPlayerState, 50);
                }
            });
        }

        function sendPlayerState() {
            if (!gameStarted || !channel) return;
            channel.send({
                type: 'broadcast',
                event: 'state',
                payload: {
                    id: player.id,
                    name: player.name,
                    color: player.color,
                    x: player.x,
                    y: player.y,
                    vx: player.vx,
                    vy: player.vy,
                    facing: player.facing,
                    hp: player.hp,
                    isDead: player.isDead
                }
            });
        }

        function broadcastStructureAction(action, data) {
            if (!channel) return;
            channel.send({
                type: 'broadcast',
                event: 'structure',
                payload: { action, struct: action === 'create' ? data : null, id: action === 'delete' ? data : null }
            });
        }

        function updateHealthBar() {
            const pct = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('health-bar-fill').style.width = pct + '%';
            document.getElementById('health-text').innerText = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
        }

        function handlePlayerDeath(killerName) {
            player.isDead = true;
            document.getElementById('gameover-title').innerText = "ELIMINATED BY " + (killerName || "THE HORIZONTAL STORM");
            document.getElementById('gameover-stats').innerHTML = `Kills: ${player.kills}`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function gameLoop() {
            if (!player.isDead) {
                // Horizontal Left/Right movement physics
                player.vx = 0;
                if (keys[keybinds.left]) { player.vx = -player.speed; player.facing = -1; }
                if (keys[keybinds.right]) { player.vx = player.speed; player.facing = 1; }

                // Jump mechanism
                if (keys[keybinds.jump] && player.isGrounded) {
                    player.vy = player.jumpForce;
                    player.isGrounded = false;
                }

                // Apply Gravity physics
                player.vy += player.gravity;

                // Move X and check platform/structure collisions horizontally
                player.x += player.vx;
                player.x = Math.max(20, Math.min(WORLD_WIDTH - 20, player.x));

                // Move Y and check platform/structure collisions vertically
                player.y += player.vy;
                player.isGrounded = false;

                const allBlocks = [...platforms, ...structures];
                for (let b of allBlocks) {
                    // AABB Collision check
                    if (player.x + player.width / 2 > b.x && 
                        player.x - player.width / 2 < b.x + b.w && 
                        player.y + player.height > b.y && 
                        player.y < b.y + b.h) {
                        
                        // Landing on top of a platform
                        if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 10) {
                            player.y = b.y - player.height;
                            player.vy = 0;
                            player.isGrounded = true;
                        } 
                        // Hitting ceiling from below
                        else if (player.vy < 0 && player.y - player.vy >= b.y + b.h - 10) {
                            player.y = b.y + b.h;
                            player.vy = 0;
                        }
                    }
                }

                // Shooting with 'E' key
                if (keys[keybinds.shoot]) {
                    const now = Date.now();
                    const currentWeapon = weapons[player.activeSlot];
                    if (now - lastShotTime >= currentWeapon.fireRate) {
                        if (player.ammo >= currentWeapon.ammoCost) {
                            player.ammo -= currentWeapon.ammoCost;
                            document.getElementById('stat-ammo').innerText = player.ammo;
                            lastShotTime = now;

                            const shootAngle = Math.atan2((mouse.worldY - player.y), (mouse.worldX - player.x));

                            for (let p = 0; p < currentWeapon.pellets; p++) {
                                const spreadAngle = shootAngle + (Math.random() - 0.5) * currentWeapon.spread;
                                const bullet = {
                                    id: player.id + '_' + Date.now() + '_' + p,
                                    x: player.x,
                                    y: player.y + 10,
                                    vx: Math.cos(spreadAngle) * currentWeapon.speed,
                                    vy: Math.sin(spreadAngle) * currentWeapon.speed,
                                    damage: currentWeapon.damage,
                                    owner: player.id
                                };
                                bullets.push(bullet);

                                if (channel) {
                                    channel.send({ type: 'broadcast', event: 'shoot', payload: bullet });
                                }
                            }
                        }
                    }
                }

                // Horizontal Storm shrinking (closes from left and right boundaries)
                if (storm.xMin < storm.targetMin) storm.xMin += storm.shrinkSpeed;
                if (storm.xMax > storm.targetMax) storm.xMax -= storm.shrinkSpeed;

                if (player.x < storm.xMin || player.x > storm.xMax) {
                    player.hp -= 0.08;
                    updateHealthBar();
                    if (player.hp <= 0 && !player.isDead) handlePlayerDeath("The Horizontal Storm");
                }

                // Loot Pickups
                loots.forEach((l, index) => {
                    if (Math.hypot(player.x - l.x, (player.y + player.height/2) - l.y) < 30) {
                        if (l.type === 'health') {
                            player.hp = Math.min(player.maxHp, player.hp + 35);
                            updateHealthBar();
                        } else {
                            player.ammo = Math.min(player.maxAmmo, player.ammo + 30);
                            document.getElementById('stat-ammo').innerText = player.ammo;
                        }
                        loots.splice(index, 1);
                    }
                });
            }

            // Bullet updates & collision check
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Hit detection against remote players
                if (b.owner === player.id) {
                    for (let id in remotePlayers) {
                        let rp = remotePlayers[id];
                        if (!rp.isDead && Math.hypot(b.x - rp.x, b.y - (rp.y + 24)) < 24) {
                            channel.send({
                                type: 'broadcast',
                                event: 'hit',
                                payload: { targetId: rp.id, damage: b.damage, killerName: player.name }
                            });
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Render Arena
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // World bounds
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            // Platforms
            ctx.fillStyle = '#1e293b';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#475569';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Player Structures
            structures.forEach(s => {
                ctx.fillStyle = s.type === 'wall' ? '#475569' : (s.type === 'stairs' ? '#0284c7' : (s.type === 'floor' ? '#0d9488' : '#d97706'));
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(s.x, s.y, s.w, s.h);
            });

            // Loots
            loots.forEach(l => {
                ctx.fillStyle = l.type === 'health' ? '#22c55e' : '#eab308';
                ctx.beginPath();
                ctx.arc(l.x, l.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            });

            // Remote Players
            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                if (rp.isDead) continue;

                ctx.fillStyle = rp.color || '#ef4444';
                ctx.fillRect(rp.x - 14, rp.y, 28, 48);
                
                // Gun barrel indicator
                ctx.fillStyle = '#94a3b8';
                if (rp.facing === 1) ctx.fillRect(rp.x + 4, rp.y + 18, 16, 6);
                else ctx.fillRect(rp.x - 20, rp.y + 18, 16, 6);

                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(rp.name, rp.x, rp.y - 10);
            }

            // Local Player
            if (!player.isDead) {
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x - player.width/2, player.y, player.width, player.height);
                
                ctx.fillStyle = '#fff';
                if (player.facing === 1) ctx.fillRect(player.x + 4, player.y + 18, 16, 6);
                else ctx.fillRect(player.x - 20, player.y + 18, 16, 6);
            }

            // Bullets
            ctx.fillStyle = '#facc15';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Horizontal Storm Danger Zones (Left & Right red walls)
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.fillRect(0, 0, storm.xMin, WORLD_HEIGHT);
            ctx.fillRect(storm.xMax, 0, WORLD_WIDTH - storm.xMax, WORLD_HEIGHT);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(storm.xMin, 0); ctx.lineTo(storm.xMin, WORLD_HEIGHT);
            ctx.moveTo(storm.xMax, 0); ctx.lineTo(storm.xMax, WORLD_HEIGHT);
            ctx.stroke();

            ctx.restore();

            // Minimap Rendering (Horizontal Orientation)
            minimapCtx.clearRect(0, 0, 180, 110);
            minimapCtx.fillStyle = '#0f172a';
            minimapCtx.fillRect(0, 0, 180, 110);

            const mScaleX = 180 / WORLD_WIDTH;
            const mScaleY = 110 / WORLD_HEIGHT;

            minimapCtx.strokeStyle = '#ef4444';
            minimapCtx.beginPath();
            minimapCtx.moveTo(storm.xMin * mScaleX, 0); minimapCtx.lineTo(storm.xMin * mScaleX, 110);
            minimapCtx.moveTo(storm.xMax * mScaleX, 0); minimapCtx.lineTo(storm.xMax * mScaleX, 110);
            minimapCtx.stroke();

            minimapCtx.fillStyle = '#3b82f6';
            minimapCtx.fillRect(player.x * mScaleX - 2, player.y * mScaleY - 2, 4, 4);

            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                if (!rp.isDead) {
                    minimapCtx.fillStyle = '#ef4444';
                    minimapCtx.fillRect(rp.x * mScaleX - 2, rp.y * mScaleY - 2, 4, 4);
                }
            }

            let activeCount = 1 + Object.values(remotePlayers).filter(p => !p.isDead).length;
            if (player.isDead) activeCount--;
            document.getElementById('stat-alive').innerText = Math.max(1, activeCount);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
