<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Multiplayer Battle Royale</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .hud-panel { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 20px; border-radius: 8px; backdrop-filter: blur(5px); pointer-events: auto; }
        
        #top-hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .stats-group { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 6px; border-bottom: 3px solid #3b82f6; }
        .stat-value { font-size: 20px; color: #60a5fa; }

        #leaderboard { width: 200px; font-size: 13px; }
        #leaderboard h3 { font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; color: #94a3b8; }
        .lb-entry { display: flex; justify-content: space-between; margin-bottom: 4px; }

        #killfeed { position: absolute; top: 100px; right: 20px; width: 250px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; pointer-events: none; }
        .kill-msg { background: rgba(0, 0, 0, 0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px; border-left: 3px solid #ef4444; animation: fadeInOut 4s forwards; }

        #bottom-hud { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .health-bar-container { width: 250px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; height: 22px; border: 1px solid rgba(255,255,255,0.2); position: relative; }
        #health-bar-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s linear; }
        .health-text { position: absolute; width: 100%; text-align: center; top: 1px; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 2px black; }

        #minimap-container { width: 150px; height: 150px; background: rgba(15, 23, 42, 0.9); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; overflow: hidden; position: relative; }
        #minimap-canvas { width: 100%; height: 100%; }

        /* Screens */
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; }
        .modal-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-card h1 { margin-bottom: 20px; font-size: 24px; color: #f8fafc; }
        .form-control { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }

        canvas { display: block; background: #0f172a; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" style="display: none;">
        <div id="top-hud">
            <div class="stats-group">
                <div class="stat-box"><span>ALIVE</span><span id="stat-alive" class="stat-value">1</span></div>
                <div class="stat-box"><span>KILLS</span><span id="stat-kills" class="stat-value">0</span></div>
                <div class="stat-box"><span>AMMO</span><span id="stat-ammo" class="stat-value">30</span></div>
            </div>
            <div id="leaderboard" class="hud-panel">
                <h3>LEADERBOARD</h3>
                <div id="leaderboard-list"></div>
            </div>
        </div>

        <div id="killfeed"></div>

        <div id="bottom-hud">
            <div class="health-bar-container">
                <div id="health-bar-fill"></div>
                <div class="health-text" id="health-text">100 / 100</div>
            </div>
            <div id="minimap-container">
                <canvas id="minimap-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen-overlay">
        <div class="modal-card">
            <h1>BATTLE ROYALE</h1>
            <input type="text" id="player-name" class="form-control" placeholder="Enter Operator Name" maxlength="12" value="Survivor">
            <div style="margin-bottom: 15px; text-align: left; font-size: 13px; color: #94a3b8;">Choose Operator Color:</div>
            <input type="color" id="player-color" class="form-control" value="#3b82f6" style="height: 40px; cursor: pointer; padding: 2px;">
            <button class="btn" id="join-btn">DEPLOY TO ARENA</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-overlay" style="display: none;">
        <div class="modal-card">
            <h1 id="gameover-title" style="color: #ef4444;">ELIMINATED</h1>
            <p id="gameover-stats" style="margin-bottom: 20px; color: #94a3b8;">Placement: #5<br>Kills: 2</p>
            <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Supabase Configuration with your credentials
        const SUPABASE_URL = 'https://khpndifubrgpvpnwlwmm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_E2QiUI92Kg8Pvag2D2YHnQ_JuQ54FYI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            minimapCanvas.width = 150;
            minimapCanvas.height = 150;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Constants & World Config
        const WORLD_SIZE = 3000;
        const player = {
            id: 'user_' + Math.random().toString(36).substr(2, 9),
            name: 'Survivor',
            color: '#3b82f6',
            x: Math.random() * 2000 + 500,
            y: Math.random() * 2000 + 500,
            radius: 16,
            angle: 0,
            speed: 4,
            hp: 100,
            maxHp: 100,
            ammo: 30,
            maxAmmo: 30,
            kills: 0,
            isDead: false
        };

        let remotePlayers = {};
        let bullets = [];
        let loots = [];
        let storm = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, radius: WORLD_SIZE * 0.7, targetRadius: 300, shrinkSpeed: 0.2 };
        
        let keys = {};
        let mouse = { x: 0, y: 0, worldX: 0, worldY: 0, down: false };
        let gameStarted = false;
        let channel = null;

        // Input Handlers
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.worldX = player.x + (mouse.x - canvas.width / 2);
            mouse.worldY = player.y + (mouse.y - canvas.height / 2);
            player.angle = Math.atan2(mouse.worldY - player.y, mouse.worldX - player.x);
        });
        window.addEventListener('mousedown', () => {
            if (!gameStarted || player.isDead) return;
            if (player.ammo > 0) {
                player.ammo--;
                document.getElementById('stat-ammo').innerText = player.ammo;
                
                const bullet = {
                    id: player.id + '_' + Date.now(),
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(player.angle) * 12,
                    vy: Math.sin(player.angle) * 12,
                    owner: player.id
                };
                bullets.push(bullet);

                if (channel) {
                    channel.send({
                        type: 'broadcast',
                        event: 'shoot',
                        payload: bullet
                    });
                }
            }
        });

        // Spawn Initial Loot items
        for (let i = 0; i < 40; i++) {
            loots.push({
                id: 'loot_' + i,
                x: Math.random() * (WORLD_SIZE - 200) + 100,
                y: Math.random() * (WORLD_SIZE - 200) + 100,
                type: Math.random() > 0.5 ? 'health' : 'ammo'
            });
        }

        // Setup Lobby UI Button
        document.getElementById('join-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) player.name = nameInput;
            player.color = document.getElementById('player-color').value;

            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            gameStarted = true;

            initMultiplayer();
            requestAnimationFrame(gameLoop);
        });

        // Supabase Realtime Channel Connection
        function initMultiplayer() {
            channel = supabaseClient.channel('battle_royale_room_v1', {
                config: { broadcast: { self: false } }
            });

            channel.on('broadcast', { event: 'state' }, payload => {
                const p = payload.payload;
                remotePlayers[p.id] = p;
            })
            .on('broadcast', { event: 'shoot' }, payload => {
                bullets.push(payload.payload);
            })
            .on('broadcast', { event: 'hit' }, payload => {
                if (payload.payload.targetId === player.id) {
                    player.hp -= payload.payload.damage;
                    updateHealthBar();
                    if (player.hp <= 0 && !player.isDead) {
                        handlePlayerDeath(payload.payload.killerName);
                    }
                }
            })
            .subscribe(status => {
                if (status === 'SUBSCRIBED') {
                    setInterval(sendPlayerState, 50); // Broadcast state every 50ms
                }
            });
        }

        function sendPlayerState() {
            if (!gameStarted || !channel) return;
            channel.send({
                type: 'broadcast',
                event: 'state',
                payload: {
                    id: player.id,
                    name: player.name,
                    color: player.color,
                    x: player.x,
                    y: player.y,
                    angle: player.angle,
                    hp: player.hp,
                    isDead: player.isDead
                }
            });
        }

        function addKillfeedMessage(msg) {
            const feed = document.getElementById('killfeed');
            const div = document.createElement('div');
            div.className = 'kill-msg';
            div.innerText = msg;
            feed.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        function updateHealthBar() {
            const pct = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('health-bar-fill').style.width = pct + '%';
            document.getElementById('health-text').innerText = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
        }

        function handlePlayerDeath(killerName) {
            player.isDead = true;
            document.getElementById('gameover-title').innerText = "ELIMINATED BY " + (killerName || "THE STORM");
            document.getElementById('gameover-stats').innerHTML = `Kills: ${player.kills}`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        // Main Game Loop
        function gameLoop() {
            if (!player.isDead) {
                // Movement Controls
                let dx = 0, dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                player.x = Math.max(50, Math.min(WORLD_SIZE - 50, player.x + dx * player.speed));
                player.y = Math.max(50, Math.min(WORLD_SIZE - 50, player.y + dy * player.speed));

                // Storm mechanics shrinking
                if (storm.radius > storm.targetRadius) {
                    storm.radius -= storm.shrinkSpeed;
                }
                const distToStormCenter = Math.hypot(player.x - storm.x, player.y - storm.y);
                if (distToStormCenter > storm.radius) {
                    player.hp -= 0.05; // Storm damage tick
                    updateHealthBar();
                    if (player.hp <= 0 && !player.isDead) handlePlayerDeath("The Storm");
                }

                // Loot collection collision check
                loots.forEach((l, index) => {
                    if (Math.hypot(player.x - l.x, player.y - l.y) < player.radius + 15) {
                        if (l.type === 'health') {
                            player.hp = Math.min(player.maxHp, player.hp + 30);
                            updateHealthBar();
                        } else {
                            player.ammo = Math.min(player.maxAmmo, player.ammo + 15);
                            document.getElementById('stat-ammo').innerText = player.ammo;
                        }
                        loots.splice(index, 1);
                    }
                });
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Check hit against remote players
                if (b.owner === player.id) {
                    for (let id in remotePlayers) {
                        let rp = remotePlayers[id];
                        if (!rp.isDead && Math.hypot(b.x - rp.x, b.y - rp.y) < 20) {
                            channel.send({
                                type: 'broadcast',
                                event: 'hit',
                                payload: { targetId: rp.id, damage: 25, killerName: player.name }
                            });
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Render World
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // Draw World Boundary & Grid Background
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Draw Loot Drops
            loots.forEach(l => {
                ctx.fillStyle = l.type === 'health' ? '#22c55e' : '#eab308';
                ctx.beginPath();
                ctx.arc(l.x, l.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            });

            // Draw Remote Players
            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                if (rp.isDead) continue;

                ctx.save();
                ctx.translate(rp.x, rp.y);
                ctx.rotate(rp.angle);
                ctx.fillStyle = rp.color || '#ef4444';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(0, -4, 22, 8); // Gun barrel
                ctx.restore();

                // Name tag
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(rp.name, rp.x, rp.y - 24);
            }

            // Draw Local Player
            if (!player.isDead) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(0, -4, 22, 8);
                ctx.restore();
            }

            // Draw Bullets
            ctx.fillStyle = '#facc15';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Storm Circle
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(storm.x, storm.y, storm.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            // Render Minimap
            minimapCtx.clearRect(0, 0, 150, 150);
            minimapCtx.fillStyle = '#0f172a';
            minimapCtx.fillRect(0, 0, 150, 150);

            const scale = 150 / WORLD_SIZE;
            
            // Minimap Storm
            minimapCtx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
            minimapCtx.beginPath();
            minimapCtx.arc(storm.x * scale, storm.y * scale, storm.radius * scale, 0, Math.PI * 2);
            minimapCtx.stroke();

            // Minimap Players
            minimapCtx.fillStyle = '#3b82f6';
            minimapCtx.fillRect(player.x * scale - 2, player.y * scale - 2, 4, 4);

            for (let id in remotePlayers) {
                let rp = remotePlayers[id];
                if (!rp.isDead) {
                    minimapCtx.fillStyle = '#ef4444';
                    minimapCtx.fillRect(rp.x * scale - 2, rp.y * scale - 2, 4, 4);
                }
            }

            // Update Alive Count and Leaderboard UI
            let activeCount = 1 + Object.values(remotePlayers).filter(p => !p.isDead).length;
            if (player.isDead) activeCount--;
            document.getElementById('stat-alive').innerText = Math.max(1, activeCount);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
