<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesh View — 2D Creature on 3D Mesh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06060c; font-family: system-ui, -apple-system, sans-serif; }
    #wrap { display: flex; width: 100%; height: 100%; }
    #left, #right { position: relative; width: 50%; height: 100%; }
    #view2d { display: block; width: 100%; height: 100%; background: #0a0a14; }
    #view3d { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }
    #ui h1 { font-size: 15px; color: #c8bfff; font-weight: 600; }
    #ui .hint { font-size: 12px; color: #999; }
    .label {
      position: absolute; top: 42px; left: 0; right: 0; text-align: center;
      font-size: 11px; color: #9b8cff; text-transform: uppercase;
      letter-spacing: 0.14em; opacity: 0.9; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Mesh View</h1>
    <div class="hint">← → turn &nbsp;↑ ↓ walk on surface &nbsp;|&nbsp; You are stuck to the meshes like a 2D creature</div>
  </div>
  <div id="wrap">
    <div id="left">
      <div class="label">2D Creature Vision (raycast)</div>
      <canvas id="view2d"></canvas>
    </div>
    <div id="right">
      <div class="label">3D World — camera follows you</div>
      <canvas id="view3d"></canvas>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ═══════════════════════════════════════════════════════════
    //  MATERIALS (max 2 colors per object)
    // ═══════════════════════════════════════════════════════════
    const COL = {
      planeA: 0x2a9d8f,
      planeB: 0x1a535c,
      cubeA:  0x4a6cf7,
      cubeB:  0xe85d4c,
      torusA: 0xf4a261,
      torusB: 0xe76f51,
      player: 0xffdd55,
    };

    const matPlaneA = new THREE.MeshStandardMaterial({ color: COL.planeA, roughness: 0.75 });
    const matPlaneB = new THREE.MeshStandardMaterial({ color: COL.planeB, roughness: 0.75 });
    const matCubeA  = new THREE.MeshStandardMaterial({ color: COL.cubeA,  roughness: 0.4 });
    const matCubeB  = new THREE.MeshStandardMaterial({ color: COL.cubeB,  roughness: 0.4 });
    const matTorusA = new THREE.MeshStandardMaterial({ color: COL.torusA, roughness: 0.45 });
    const matTorusB = new THREE.MeshStandardMaterial({ color: COL.torusB, roughness: 0.45 });

    // ═══════════════════════════════════════════════════════════
    //  3D SCENE
    // ═══════════════════════════════════════════════════════════
    const canvas3d = document.getElementById('view3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0c16);
    scene.fog = new THREE.Fog(0x0c0c16, 18, 55);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(10, 16, 8);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8899ff, 0.3);
    fill.position.set(-8, 5, -5);
    scene.add(fill);

    // ── walkable meshes ────────────────────────────────────────
    const walkables = [];

    // Plane (two halves, two colors)
    const planeL = new THREE.Mesh(new THREE.PlaneGeometry(14, 28), matPlaneA);
    planeL.rotation.x = -Math.PI / 2;
    planeL.position.set(-7, 0, 0);
    planeL.userData.color = COL.planeA;
    scene.add(planeL);
    walkables.push(planeL);

    const planeR = new THREE.Mesh(new THREE.PlaneGeometry(14, 28), matPlaneB);
    planeR.rotation.x = -Math.PI / 2;
    planeR.position.set(7, 0, 0);
    planeR.userData.color = COL.planeB;
    scene.add(planeR);
    walkables.push(planeR);

    // Grid (visual only)
    const grid = new THREE.GridHelper(28, 28, 0x333355, 0x1a1a2a);
    grid.position.y = 0.02;
    scene.add(grid);

    // Cube — 2 colors alternating faces
    const cubeSize = 3.2;
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize),
      [matCubeA, matCubeB, matCubeA, matCubeB, matCubeA, matCubeB]
    );
    cube.position.set(6, cubeSize / 2, -5);
    cube.userData.color = COL.cubeA;
    cube.userData.colors = [COL.cubeA, COL.cubeB];
    scene.add(cube);
    walkables.push(cube);

    // Torus (donut) — two colors
    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.7, 32, 64),
      matTorusA
    );
    torus.position.set(-6, 1.4, -4);
    torus.rotation.x = Math.PI / 2;
    torus.userData.color = COL.torusA;
    scene.add(torus);
    walkables.push(torus);

    // thin accent ring (2nd color)
    const torusRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.22, 16, 64),
      matTorusB
    );
    torusRing.position.copy(torus.position);
    torusRing.rotation.copy(torus.rotation);
    scene.add(torusRing);

    // ── player (flat disk = 2D creature) ────────────────────────
    const player = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 0.06, 20),
      new THREE.MeshStandardMaterial({ color: COL.player, roughness: 0.35, metalness: 0.15 })
    );
    body.rotation.x = Math.PI / 2;
    player.add(body);

    const nose = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.22, 8),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 0.04, 0.28);
    player.add(nose);

    const nArrow = new THREE.ArrowHelper(
      new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 0.55, 0xff66aa, 0.12, 0.08
    );
    player.add(nArrow);

    player.position.set(0, 0.05, 6);
    scene.add(player);

    // ── 3D camera (follows player) ──────────────────────────────
    const cam3d = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
    cam3d.position.set(0, 10, 14);

    // ═══════════════════════════════════════════════════════════
    //  SURFACE STICKING + MOVEMENT
    // ═══════════════════════════════════════════════════════════
    const raycaster = new THREE.Raycaster();

    let surfNormal = new THREE.Vector3(0, 1, 0);
    let facing = 0;
    const moveSpeed = 3.8;
    const turnSpeed = 2.6;
    const stickOffset = 0.04;

    const keys = {};
    addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
    addEventListener('keyup',   e => { keys[e.code] = false; });

    function getTangentBasis(normal, angle) {
      let up = normal.clone().normalize();
      let ref = Math.abs(up.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
      let right = new THREE.Vector3().crossVectors(ref, up).normalize();
      let forward = new THREE.Vector3().crossVectors(up, right).normalize();
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const f = forward.clone().multiplyScalar(cos).add(right.clone().multiplyScalar(sin));
      const r = right.clone().multiplyScalar(cos).sub(forward.clone().multiplyScalar(sin));
      return { up, forward: f.normalize(), right: r.normalize() };
    }

    function stickToSurface(fromPos, preferNormal) {
      const dirs = [];
      if (preferNormal) dirs.push(preferNormal.clone().negate());
      dirs.push(new THREE.Vector3(0, -1, 0));
      dirs.push(new THREE.Vector3(0, 1, 0));
      dirs.push(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0));
      dirs.push(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1));

      let best = null;
      let bestDist = Infinity;

      for (const d of dirs) {
        d.normalize();
        const origin = fromPos.clone().add(d.clone().multiplyScalar(-0.6));
        raycaster.set(origin, d);
        raycaster.far = 2.5;
        const hits = raycaster.intersectObjects(walkables, false);
        if (hits.length && hits[0].distance < bestDist) {
          bestDist = hits[0].distance;
          best = hits[0];
        }
      }

      raycaster.set(fromPos.clone().add(new THREE.Vector3(0, 1.2, 0)), new THREE.Vector3(0, -1, 0));
      raycaster.far = 4;
      const downHits = raycaster.intersectObjects(walkables, false);
      if (downHits.length && downHits[0].distance < bestDist) {
        best = downHits[0];
      }

      return best;
    }

    function updatePlayer(dt) {
      if (keys['ArrowLeft'] || keys['KeyA'])  facing += turnSpeed * dt;
      if (keys['ArrowRight'] || keys['KeyD']) facing -= turnSpeed * dt;

      const basis = getTangentBasis(surfNormal, facing);

      let move = 0;
      if (keys['ArrowUp'] || keys['KeyW'])   move += 1;
      if (keys['ArrowDown'] || keys['KeyS']) move -= 1;

      if (move !== 0) {
        const step = basis.forward.clone().multiplyScalar(move * moveSpeed * dt);
        player.position.add(step);
      }

      const hit = stickToSurface(player.position, surfNormal);
      if (hit) {
        player.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(stickOffset));
        surfNormal.lerp(hit.face.normal, 0.35).normalize();
      }

      const b = getTangentBasis(surfNormal, facing);
      const m = new THREE.Matrix4().makeBasis(b.right, b.up, b.forward);
      player.quaternion.setFromRotationMatrix(m);
    }

    // ═══════════════════════════════════════════════════════════
    //  2D RAYCAST VISION — rays stay in the tangent plane so they
    //  hug the mesh instead of flying through empty 3D space
    // ═══════════════════════════════════════════════════════════
    const canvas2d = document.getElementById('view2d');
    const ctx = canvas2d.getContext('2d');

    const RAYS = 160;
    const FOV = Math.PI * 0.85;
    const MAX_DIST = 18;

    const rayHelpers = [];
    const rayMat = new THREE.LineBasicMaterial({ color: 0xffee88, transparent: true, opacity: 0.35 });
    for (let i = 0; i < 24; i++) {
      const g = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(), new THREE.Vector3(0, 0, 1)
      ]);
      const line = new THREE.Line(g, rayMat);
      line.visible = false;
      scene.add(line);
      rayHelpers.push(line);
    }

    function colorFromHit(hit) {
      if (!hit) return null;
      const obj = hit.object;
      if (obj.userData.colors && hit.face) {
        const fi = hit.face.materialIndex;
        if (fi !== undefined && obj.userData.colors[fi % 2] !== undefined) {
          return obj.userData.colors[fi % 2];
        }
      }
      return obj.userData.color ?? 0x888888;
    }

    function hexToRgb(hex) {
      return {
        r: (hex >> 16) & 255,
        g: (hex >> 8) & 255,
        b: hex & 255,
      };
    }

    function castVisionRays() {
      const basis = getTangentBasis(surfNormal, facing);
      const results = [];
      const halfFov = FOV / 2;
      const origin = player.position.clone().add(surfNormal.clone().multiplyScalar(0.08));

      for (let i = 0; i < RAYS; i++) {
        const t = i / (RAYS - 1);
        const ang = -halfFov + t * FOV;

        // direction lies in the tangent plane of the surface
        const dir = basis.forward.clone().multiplyScalar(Math.cos(ang))
          .add(basis.right.clone().multiplyScalar(Math.sin(ang)))
          .normalize();

        // slight bias toward the surface so rays hug the mesh
        dir.add(surfNormal.clone().multiplyScalar(-0.02)).normalize();

        raycaster.set(origin, dir);
        raycaster.far = MAX_DIST;
        const hits = raycaster.intersectObjects(walkables, false);

        let hit = null;
        for (const h of hits) {
          if (h.distance > 0.15) { hit = h; break; }
        }

        results.push({
          dist: hit ? hit.distance : MAX_DIST,
          color: hit ? colorFromHit(hit) : null,
          dir,
        });
      }

      // show a few rays in the 3D view
      const step = Math.floor(RAYS / rayHelpers.length);
      for (let i = 0; i < rayHelpers.length; i++) {
        const r = results[i * step];
        if (!r) continue;
        const len = Math.min(r.dist, 6);
        const end = origin.clone().add(r.dir.clone().multiplyScalar(len));
        const pos = rayHelpers[i].geometry.attributes.position;
        pos.setXYZ(0, origin.x, origin.y, origin.z);
        pos.setXYZ(1, end.x, end.y, end.z);
        pos.needsUpdate = true;
        rayHelpers[i].visible = true;
      }

      return results;
    }

    function draw2dVision(results) {
      const w = canvas2d.width / (window.devicePixelRatio || 1);
      const h = canvas2d.height / (window.devicePixelRatio || 1);

      // abstract sky/ground
      const grd = ctx.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, '#12122a');
      grd.addColorStop(0.5, '#0e0e1c');
      grd.addColorStop(1, '#0a1014');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      const mid = h * 0.5;
      ctx.strokeStyle = 'rgba(155,140,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(0, mid);
      ctx.lineTo(w, mid);
      ctx.stroke();

      const colW = w / RAYS;

      for (let i = 0; i < RAYS; i++) {
        const r = results[i];
        if (!r || r.color === null) continue;

        const dist = Math.max(0.15, r.dist);
        const wallH = Math.min(h * 0.9, (h * 1.1) / dist);
        const top = mid - wallH / 2;

        const shade = Math.max(0.2, 1 - dist / MAX_DIST);
        const rgb = hexToRgb(r.color);
        ctx.fillStyle = `rgb(${(rgb.r * shade) | 0},${(rgb.g * shade) | 0},${(rgb.b * shade) | 0})`;
        ctx.fillRect(i * colW, top, colW + 1, wallH);

        ctx.fillStyle = `rgba(255,255,255,${0.08 * shade})`;
        ctx.fillRect(i * colW, top, colW + 1, 2);
      }

      // crosshair
      ctx.strokeStyle = 'rgba(255,221,85,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(w / 2 - 8, mid);
      ctx.lineTo(w / 2 + 8, mid);
      ctx.moveTo(w / 2, mid - 8);
      ctx.lineTo(w / 2, mid + 8);
      ctx.stroke();

      ctx.fillStyle = 'rgba(200,190,255,0.45)';
      ctx.font = '11px system-ui';
      ctx.fillText('rays hug the surface · closer = taller', 12, h - 14);
    }

    // ═══════════════════════════════════════════════════════════
    //  RESIZE + LOOP
    // ═══════════════════════════════════════════════════════════
    function resize() {
      const halfW = Math.floor(innerWidth / 2);
      const h = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);

      canvas2d.width = halfW * dpr;
      canvas2d.height = h * dpr;
      canvas2d.style.width = halfW + 'px';
      canvas2d.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      renderer.setSize(halfW, h, false);
      cam3d.aspect = halfW / h;
      cam3d.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3();
    const camPos = new THREE.Vector3(0, 12, 16);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePlayer(dt);

      const b = getTangentBasis(surfNormal, facing);
      const desired = player.position.clone()
        .add(surfNormal.clone().multiplyScalar(5.5))
        .add(b.forward.clone().multiplyScalar(-7));
      camPos.lerp(desired, 1 - Math.pow(0.001, dt));
      cam3d.position.copy(camPos);
      camTarget.lerp(player.position, 1 - Math.pow(0.0001, dt));
      cam3d.lookAt(camTarget);

      torus.rotation.z += dt * 0.25;
      torusRing.rotation.z = torus.rotation.z;

      const rays = castVisionRays();
      draw2dVision(rays);

      renderer.render(scene, cam3d);
    }
    animate();
  </script>
</body>
</html>
