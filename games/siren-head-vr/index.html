<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>Siren Head VR</title>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0c11;color:#d8d0bc;font-family:system-ui;z-index:9999">
  Loading Siren Head…
</div>
<script>
(async function () {
  try {
    const res = await fetch('../Siren%20Head/index.html');
    if (!res.ok) throw new Error('status ' + res.status);
    let html = await res.text();
    // use original structure; swap only the game script to our VR patcher
    html = html.replace(/src="game\.js"/g, 'src="./game.js"');
    if (html.indexOf('btn-vr') < 0) {
      html = html.replace(
        /(id="btn-play"[^>]*>[\s\S]*?<\/button>)/,
        '$1\n    <button class="btn primary" id="btn-vr" type="button">Enter VR</button>'
      );
    }
    if (html.indexOf('enterSirenVR') < 0) {
      html = html.replace('</body>',
        '<script>document.getElementById("btn-vr")&&document.getElementById("btn-vr").addEventListener("click",function(){if(window.enterSirenVR)window.enterSirenVR();else alert("Game still loading…");});<\/script></body>');
    }
    html = html.replace('<title>', '<title>Siren Head VR | ');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').textContent = 'Failed to load original Siren Head: ' + e;
  }
})();
</script>
</body>
</html>
