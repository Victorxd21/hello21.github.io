<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Determination</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">

    <!-- TITLE -->
    <div id="title-screen" class="screen active">
      <div class="title-content">
        <div class="heart">♥</div>
        <h1>DETERMINATION</h1>
        <p class="subtitle">a simple undertale-inspired demo</p>
        <button id="start-btn" class="menu-btn">START</button>
        <p class="hint">Tap / Click to start</p>
      </div>
    </div>

    <!-- OVERWORLD -->
    <div id="overworld" class="screen">
      <canvas id="world-canvas"></canvas>
      <div id="dialogue-box" class="hidden">
        <div id="dialogue-text"></div>
        <div id="dialogue-continue">▼</div>
      </div>
    </div>

    <!-- BATTLE -->
    <div id="battle" class="screen">
      <div id="enemy-area">
        <div id="enemy-sprite">DUMMY</div>
        <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
      </div>

      <div id="soul-box">
        <div class="grid"></div>
        <div id="soul"></div>
      </div>

      <div id="battle-ui">
        <div id="player-info">
          <span>FRISK</span>
          <span>LV 1</span>
          <span class="hp-label">HP</span>
          <div class="hp-bar"><div id="hp-fill"></div></div>
          <span id="hp-text">20 / 20</span>
        </div>

        <div id="menu-buttons">
          <button class="battle-btn" data-action="fight">FIGHT</button>
          <button class="battle-btn" data-action="act">ACT</button>
          <button class="battle-btn" data-action="item">ITEM</button>
          <button class="battle-btn" data-action="mercy">MERCY</button>
        </div>

        <div id="battle-dialogue" class="hidden"></div>
      </div>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">
      <div id="dpad">
        <button class="dpad-btn" data-dir="up">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="left">◀</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn" data-dir="right">▶</button>
        </div>
        <button class="dpad-btn" data-dir="down">▼</button>
      </div>
      <div id="action-buttons">
        <button id="btn-b" class="action-btn">B</button>
        <button id="btn-a" class="action-btn">A</button>
      </div>
    </div>

  </div>
  <script src="game.js"></script>
</body>
</html>
