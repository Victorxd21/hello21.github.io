<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake - Ultimate Arcade Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#10b981', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Orbitron', sans-serif; touch-action: manipulation; }
        .neon-border { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 2px; }

        /* CRT Scanlines Effect */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 15;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500">

    <!-- Main Container Grid -->
    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-4 items-start">

        <!-- Game Area (3 Columns) -->
        <div id="gameWrapper" class="md:col-span-3 bg-slate-900 border border-emerald-500/30 rounded-2xl overflow-hidden neon-border flex flex-col shadow-2xl relative">
            
            <!-- Top Bar -->
            <div class="bg-slate-900/90 px-5 py-3 border-b border-emerald-500/20 flex justify-between items-center text-sm font-bold z-20">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 text-emerald-400">
                        <i class="fa-solid fa-gamepad text-lg"></i>
                        <span id="scoreDisplay" class="text-xl">0</span>
                    </div>
                    <div class="flex items-center gap-2 text-cyan-400 text-xs">
                        <i class="fa-solid fa-trophy"></i>
                        <span id="topScoreDisplay">0</span>
                    </div>
                    <div id="modeTag" class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full uppercase">
                        CLASSIC
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openModal('settingsModal')" class="text-xs text-slate-400 hover:text-emerald-400 transition" title="Settings">
                        <i class="fa-solid fa-gear text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvasContainer" class="relative w-full aspect-square bg-slate-950 flex items-center justify-center overflow-hidden">
                
                <!-- Start / Game Over Overlay -->
                <div id="gameOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center">
                    <div id="overlayContent" class="flex flex-col items-center gap-4">
                        <div id="overlayIcon" class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-3xl mb-1">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        
                        <h2 id="overlayTitle" class="text-2xl font-black text-white tracking-wider">CYBER SNAKE</h2>
                        <p id="overlaySubtitle" class="text-xs text-slate-400 max-w-xs" data-i18n="instructions">Choose a mode and press an arrow key to start moving.</p>

                        <div class="flex flex-col gap-2.5 w-56 mt-2">
                            <button onclick="startGame('classic')" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-xs flex items-center justify-center gap-2">
                                <i class="fa-solid fa-play"></i> <span data-i18n="playClassic">PLAY CLASSIC</span>
                            </button>
                            <button onclick="startGame('multiplayer')" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition text-xs flex items-center justify-center gap-2">
                                <i class="fa-solid fa-users"></i> <span data-i18n="playMulti">MULTIPLAYER MAP</span>
                            </button>
                        </div>
                    </div>
                </div>

                <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            </div>

            <!-- On-Screen Touch Controls (Mobile Friendly) -->
            <div class="bg-slate-900/90 p-3 border-t border-slate-800 flex flex-col items-center justify-center gap-1 md:hidden">
                <button onclick="changeDirection('UP')" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-xl flex items-center justify-center text-lg active:scale-95 transition">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
                <div class="flex gap-12">
                    <button onclick="changeDirection('LEFT')" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-xl flex items-center justify-center text-lg active:scale-95 transition">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button onclick="changeDirection('RIGHT')" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-xl flex items-center justify-center text-lg active:scale-95 transition">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
                <button onclick="changeDirection('DOWN')" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 rounded-xl flex items-center justify-center text-lg active:scale-95 transition">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
            </div>
        </div>

        <!-- Outside Right Leaderboard Container (1 Column) -->
        <div class="md:col-span-1 bg-slate-900 border border-emerald-500/30 rounded-2xl p-4 shadow-2xl flex flex-col h-full min-h-[420px]">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                <span id="lbTitle" class="text-xs font-bold text-emerald-400 tracking-wider uppercase">TOP SCORES</span>
                <i class="fa-solid fa-ranking-star text-xs text-emerald-400"></i>
            </div>
            
            <div id="leaderboardList" class="space-y-2 flex-1 overflow-y-auto custom-scrollbar text-xs pr-1">
                <div class="text-slate-500 text-center py-4">Loading...</div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/80 text-[10px] text-slate-500 text-center">
                Live updates active
            </div>
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl relative">
            <button onclick="closeModal('settingsModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-sm font-bold text-emerald-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> <span data-i18n="settings">Settings</span>
            </h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="usernameLabel">Username</label>
                    <input type="text" id="usernameInput" maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="colorLabel">Snake Color</label>
                    <select id="snakeColorSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="emerald">Emerald Neon</option>
                        <option value="cyan">Cyber Cyan</option>
                        <option value="fuchsia">Fuchsia Pulse</option>
                        <option value="amber">Solar Amber</option>
                    </select>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <span class="text-slate-400" data-i18n="crtLabel">CRT Scanline Filter</span>
                    <input type="checkbox" id="crtToggle" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="languageLabel">Language / Idioma</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="langEnBtn" onclick="setLanguage('en')" class="py-2 border rounded-xl font-bold transition">English</button>
                        <button id="langEsBtn" onclick="setLanguage('es')" class="py-2 border rounded-xl font-bold transition">Español</button>
                    </div>
                </div>
                <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl transition mt-2" data-i18n="saveBtn">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukaihgoijcsgtdnjnpyu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Zpkb-lUZvy3sqOSSCxyK_w_G14fWqf5';
        let supabaseClient = null;

        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {}

        // --- Web Audio Synthesizer ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctxAudio = getAudioContext();
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.connect(gain);
                gain.connect(ctxAudio.destination);

                const now = ctxAudio.currentTime;

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        const colorMap = {
            emerald: { head: '#34d399', body: '#10b981', glow: 'rgba(16, 185, 129, 0.4)' },
            cyan: { head: '#67e8f9', body: '#06b6d4', glow: 'rgba(6, 182, 212, 0.4)' },
            fuchsia: { head: '#f472b6', body: '#ec4899', glow: 'rgba(236, 72, 153, 0.4)' },
            amber: { head: '#fcd34d', body: '#f59e0b', glow: 'rgba(245, 158, 11, 0.4)' }
        };

        const translations = {
            en: {
                lbTitle: 'TOP SCORES',
                instructions: 'Choose a mode and press an arrow key to start moving.',
                playClassic: 'PLAY CLASSIC',
                playMulti: 'MULTIPLAYER MAP',
                settings: 'Settings',
                usernameLabel: 'Username',
                colorLabel: 'Snake Color',
                crtLabel: 'CRT Scanline Filter',
                languageLabel: 'Language / Idioma',
                saveBtn: 'Save',
                gameOverTitle: 'SCORE: ',
                gameOverSub: 'Game Over',
                noScores: 'No scores yet'
            },
            es: {
                lbTitle: 'TOP JUGADORES',
                instructions: 'Elige un modo y presiona una flecha para moverte.',
                playClassic: 'JUGAR CLÁSICO',
                playMulti: 'MAPA MULTIJUGADOR',
                settings: 'Configuración',
                usernameLabel: 'Nombre de usuario',
                colorLabel: 'Color de Serpiente',
                crtLabel: 'Filtro CRT de Líneas',
                languageLabel: 'Language / Idioma',
                saveBtn: 'Guardar',
                gameOverTitle: 'PUNTUACIÓN: ',
                gameOverSub: 'Juego Terminado',
                noScores: 'Sin puntuaciones aún'
            }
        };

        let currentLang = localStorage.getItem('snake_lang') || 'en';
        let snakeTheme = localStorage.getItem('snake_color') || 'emerald';
        let crtEnabled = localStorage.getItem('snake_crt') === 'true';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentGameMode = 'classic';
        let tileCount = 20;
        let tileSize = 20;
        let gameInterval = null;
        let isRunning = false;
        let isMoving = false;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;

        let snake = [];
        let dx = 0, dy = 0, nextDx = 0, nextDy = 0;
        let foods = []; 
        let portals = [];
        let particles = [];
        let shards = [];
        let username = localStorage.getItem('snake_username') || 'victor';

        let swallowProgress = -1;
        let deathAnimationStep = 0;

        function applyLanguage() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            document.getElementById('lbTitle').innerText = t.lbTitle;

            const enBtn = document.getElementById('langEnBtn');
            const esBtn = document.getElementById('langEsBtn');

            if (currentLang === 'en') {
                enBtn.className = 'py-2 bg-emerald-500 text-slate-950 font-bold border-emerald-400 rounded-xl';
                esBtn.className = 'py-2 bg-slate-950 text-slate-400 border-slate-700 rounded-xl hover:text-white';
            } else {
                esBtn.className = 'py-2 bg-emerald-500 text-slate-950 font-bold border-emerald-400 rounded-xl';
                enBtn.className = 'py-2 bg-slate-950 text-slate-400 border-slate-700 rounded-xl hover:text-white';
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('snake_lang', lang);
            applyLanguage();
        }

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            tileSize = Math.floor(canvas.width / tileCount);
        }
        window.addEventListener('resize', initCanvas);

        function startGame(mode = 'classic') {
            playSound('click');
            currentGameMode = mode;
            deathAnimationStep = 0;
            swallowProgress = -1;
            particles = [];
            shards = [];
            
            if (mode === 'multiplayer') {
                tileCount = 40; 
                document.getElementById('modeTag').innerText = 'CYBER ARENA (PORTALS)';
                document.getElementById('modeTag').className = 'text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-full uppercase';
                
                // Setup 2 portal pairs
                portals = [
                    { x: 5, y: 5, targetX: 35, targetY: 35, color: '#38bdf8' },
                    { x: 35, y: 5, targetX: 5, targetY: 35, color: '#f43f5e' }
                ];
            } else {
                tileCount = 20; 
                document.getElementById('modeTag').innerText = 'CLASSIC';
                document.getElementById('modeTag').className = 'text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full uppercase';
                portals = [];
            }

            initCanvas();
            document.getElementById('gameOverlay').classList.add('hidden');
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            isMoving = false;
            
            score = 0;
            document.getElementById('scoreDisplay').innerText = score;
            
            spawnAllFoods();
            isRunning = true;
            
            render();

            if (gameInterval) clearInterval(gameInterval);
            const speed = mode === 'multiplayer' ? 70 : 90;
            gameInterval = setInterval(gameLoop, speed);
        }

        function spawnAllFoods() {
            foods = [];
            const foodCount = currentGameMode === 'multiplayer' ? 10 : 1;
            for (let i = 0; i < foodCount; i++) {
                spawnSingleFood();
            }
        }

        function spawnSingleFood() {
            foods.push({
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            });
        }

        function gameLoop() {
            if (!isMoving) return;

            dx = nextDx; dy = nextDy;
            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collision check (or wrap around if portal map)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return startDeathAnimation();
            }

            // Portal teleport check
            portals.forEach(p => {
                if (head.x === p.x && head.y === p.y) {
                    head = { x: p.targetX, y: p.targetY };
                }
            });

            // Self collision check
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return startDeathAnimation();
            }

            snake.unshift(head);

            let ateFoodIndex = foods.findIndex(f => f.x === head.x && f.y === head.y);

            if (ateFoodIndex !== -1) {
                playSound('eat');
                score += 10;
                document.getElementById('scoreDisplay').innerText = score;
                saveScore(username, score);
                
                // Spawn chomp particles
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: (head.x + 0.5) * tileSize,
                        y: (head.y + 0.5) * tileSize,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        life: 1.0,
                        color: currentGameMode === 'multiplayer' ? '#38bdf8' : '#34d399'
                    });
                }

                foods.splice(ateFoodIndex, 1);
                spawnSingleFood();
                swallowProgress = 0;
            } else {
                snake.pop();
            }

            if (swallowProgress !== -1) {
                swallowProgress++;
                if (swallowProgress >= snake.length) swallowProgress = -1;
            }

            render();
        }

        function render() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            ctx.strokeStyle = '#0f172a';
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * tileSize); ctx.lineTo(canvas.width, i * tileSize); ctx.stroke();
            }

            // Portals
            portals.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.fillRect(p.x * tileSize + 2, p.y * tileSize + 2, tileSize - 4, tileSize - 4);
                ctx.shadowBlur = 0;
            });

            // Foods
            foods.forEach(f => {
                ctx.fillStyle = currentGameMode === 'multiplayer' ? '#22d3ee' : '#10b981';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(f.x * tileSize + tileSize / 2, f.y * tileSize + tileSize / 2, Math.max(tileSize / 2.5, 2), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            const currentColors = colorMap[snakeTheme] || colorMap.emerald;

            // Snake Trail Glow & Body
            snake.forEach((seg, idx) => {
                let sizeOffset = 0;
                let fillColor = idx === 0 ? currentColors.head : currentColors.body;

                if (idx === swallowProgress) fillColor = '#ffffff';

                if (deathAnimationStep > 0) {
                    fillColor = '#ef4444';
                    sizeOffset = Math.min(deathAnimationStep * 2, tileSize * 0.4);
                }

                ctx.fillStyle = fillColor;
                ctx.shadowColor = currentColors.glow;
                ctx.shadowBlur = idx === 0 ? 10 : 4;
                ctx.fillRect(
                    seg.x * tileSize + sizeOffset / 2, 
                    seg.y * tileSize + sizeOffset / 2, 
                    tileSize - sizeOffset, 
                    tileSize - sizeOffset
                );
                ctx.shadowBlur = 0;
            });

            // Particles update & render
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Death Shards update & render
            if (deathAnimationStep > 0) {
                shards.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(s.x, s.y, 4, 4);
                });
            }
        }

        function startDeathAnimation() {
            isRunning = false;
            isMoving = false;
            clearInterval(gameInterval);
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('topScoreDisplay').innerText = highScore;
            }
            saveScore(username, score);

            // Generate shards from snake head
            shards = [];
            if (snake.length > 0) {
                const head = snake[0];
                for (let i = 0; i < 20; i++) {
                    shards.push({
                        x: (head.x + 0.5) * tileSize,
                        y: (head.y + 0.5) * tileSize,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8
                    });
                }
            }

            deathAnimationStep = 1;
            let shrinkInterval = setInterval(() => {
                deathAnimationStep++;
                render();
                if (deathAnimationStep > 10) {
                    clearInterval(shrinkInterval);
                    showGameOverOverlay();
                }
            }, 50);
        }

        function showGameOverOverlay() {
            const t = translations[currentLang];
            document.getElementById('overlayIcon').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            document.getElementById('overlayTitle').innerText = t.gameOverTitle + score;
            document.getElementById('overlaySubtitle').innerText = t.gameOverSub;
            document.getElementById('gameOverlay').classList.remove('hidden');
        }

        async function saveScore(user, scoreVal) {
            if (supabaseClient && scoreVal > 0) {
                try {
                    await supabaseClient.from('leaderboard').insert([{ username: user, score: scoreVal }]);
                } catch (e) {}
            }
            fetchLeaderboard();
        }

        async function fetchLeaderboard() {
            const listContainer = document.getElementById('leaderboardList');
            let data = [];

            if (supabaseClient) {
                try {
                    const res = await supabaseClient.from('leaderboard').select('*').order('score', { ascending: false });
                    if (res.data) data = res.data;
                } catch (e) {}
            }

            const uniqueMap = new Map();
            data.forEach(item => {
                if (!uniqueMap.has(item.username) || uniqueMap.get(item.username).score < item.score) {
                    uniqueMap.set(item.username, item);
                }
            });

            const uniqueList = Array.from(uniqueMap.values()).sort((a, b) => b.score - a.score).slice(0, 10);

            const t = translations[currentLang];
            listContainer.innerHTML = uniqueList.map((item, index) => `
                <div class="flex justify-between items-center bg-slate-950/80 px-2.5 py-1.5 rounded-xl border border-slate-800">
                    <span class="text-slate-300 font-bold truncate max-w-[100px]"><span class="text-emerald-400">#${index + 1}</span> ${item.username}</span>
                    <span class="font-bold text-teal-400">${item.score}</span>
                </div>
            `).join('') || `<div class="text-slate-500 text-center py-4 text-xs">${t.noScores}</div>`;
        }

        function changeDirection(dir) {
            if (!isRunning) return;
            if (!isMoving) isMoving = true;

            if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
            if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
            if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
            if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
        }

        function saveSettings() {
            username = document.getElementById('usernameInput').value.trim() || 'victor';
            snakeTheme = document.getElementById('snakeColorSelect').value;
            crtEnabled = document.getElementById('crtToggle').checked;

            localStorage.setItem('snake_username', username);
            localStorage.setItem('snake_color', snakeTheme);
            localStorage.setItem('snake_crt', crtEnabled);

            applyCRTFilter();
            closeModal('settingsModal');
        }

        function applyCRTFilter() {
            const wrapper = document.getElementById('gameWrapper');
            if (crtEnabled) {
                wrapper.classList.add('crt');
            } else {
                wrapper.classList.remove('crt');
            }
        }

        window.addEventListener('keydown', e => {
            if (!isRunning) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault(); 
            }

            if (e.key === 'ArrowUp') changeDirection('UP');
            if (e.key === 'ArrowDown') changeDirection('DOWN');
            if (e.key === 'ArrowLeft') changeDirection('LEFT');
            if (e.key === 'ArrowRight') changeDirection('RIGHT');
        });

        function openModal(id) { 
            playSound('click');
            document.getElementById('usernameInput').value = username;
            document.getElementById('snakeColorSelect').value = snakeTheme;
            document.getElementById('crtToggle').checked = crtEnabled;
            document.getElementById(id).classList.remove('hidden'); 
        }
        function closeModal(id) { 
            playSound('click');
            document.getElementById(id).classList.add('hidden'); 
        }

        window.onload = function() {
            initCanvas();
            applyLanguage();
            applyCRTFilter();
            document.getElementById('topScoreDisplay').innerText = highScore;
            document.getElementById('usernameInput').value = username;
            document.getElementById('snakeColorSelect').value = snakeTheme;
            document.getElementById('crtToggle').checked = crtEnabled;
            fetchLeaderboard();
        };
    </script>
</body>
</html>
