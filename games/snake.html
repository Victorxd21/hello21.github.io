<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake - Minimal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#10b981', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Orbitron', sans-serif; }
        .neon-border { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 2px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500">

    <!-- Minimalist Game Frame -->
    <div class="w-full max-w-[620px] bg-slate-900 border border-emerald-500/30 rounded-2xl overflow-hidden neon-border flex flex-col shadow-2xl relative">
        
        <!-- Top Bar (Score & Config Buttons) -->
        <div class="bg-slate-900/90 px-5 py-3 border-b border-emerald-500/20 flex justify-between items-center text-sm font-bold z-10">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-emerald-400">
                    <i class="fa-solid fa-gamepad text-lg"></i>
                    <span id="scoreDisplay" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2 text-cyan-400 text-xs">
                    <i class="fa-solid fa-trophy"></i>
                    <span id="topScoreDisplay">0</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="openModal('settingsModal')" class="text-xs text-slate-400 hover:text-emerald-400 transition" title="Settings">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full aspect-square bg-slate-950 flex items-center justify-center overflow-hidden">
            
            <!-- Live Top-Right Leaderboard Overlay -->
            <div class="absolute top-3 right-3 z-10 w-44 bg-slate-900/80 backdrop-blur-md border border-emerald-500/20 rounded-xl p-2.5 shadow-lg">
                <div class="flex items-center justify-between border-b border-slate-800 pb-1 mb-1.5">
                    <span id="lbTitle" class="text-[10px] font-bold text-emerald-400 tracking-wider uppercase">TOP SCORES</span>
                    <i class="fa-solid fa-ranking-star text-[10px] text-emerald-400"></i>
                </div>
                <div id="leaderboardList" class="space-y-1 max-h-36 overflow-y-auto custom-scrollbar text-[11px]">
                    <div class="text-slate-500 text-center py-1 text-[10px]">Loading...</div>
                </div>
            </div>

            <!-- Start / Game Over Screen Overlay -->
            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-20 flex flex-col items-center justify-center p-6 text-center">
                <div id="overlayContent" class="flex flex-col items-center gap-4">
                    <div id="overlayIcon" class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-3xl mb-1">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    
                    <h2 id="overlayTitle" class="text-2xl font-black text-white tracking-wider">CYBER SNAKE</h2>
                    <p id="overlaySubtitle" class="text-xs text-slate-400 max-w-xs" data-i18n="instructions">Press PLAY, then hit an arrow key to start moving.</p>

                    <div class="flex flex-col gap-2.5 w-48 mt-2">
                        <button id="playBtn" onclick="startGame()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> <span data-i18n="play">PLAY</span>
                        </button>
                    </div>
                </div>
            </div>

            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
        </div>
    </div>

    <!-- Settings Modal with Language Switch -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl relative">
            <button onclick="closeModal('settingsModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-sm font-bold text-emerald-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> <span data-i18n="settings">Settings</span>
            </h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="usernameLabel">Username</label>
                    <input type="text" id="usernameInput" maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="gridSizeLabel">Map Size</label>
                    <select id="gridSizeSelect" onchange="updateGridSize()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="15">Micro (15x15)</option>
                        <option value="20" selected>Standard (20x20)</option>
                        <option value="25">Large (25x25)</option>
                    </select>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1" data-i18n="languageLabel">Language / Idioma</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="langEnBtn" onclick="setLanguage('en')" class="py-2 border rounded-xl font-bold transition">English</button>
                        <button id="langEsBtn" onclick="setLanguage('es')" class="py-2 border rounded-xl font-bold transition">Español</button>
                    </div>
                </div>
                <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl transition mt-2" data-i18n="saveBtn">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukaihgoijcsgtdnjnpyu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Zpkb-lUZvy3sqOSSCxyK_w_G14fWqf5';
        let supabaseClient = null;

        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {}

        const translations = {
            en: {
                lbTitle: 'TOP SCORES',
                instructions: 'Press PLAY, then hit an arrow key to start moving.',
                play: 'PLAY',
                settings: 'Settings',
                usernameLabel: 'Username',
                gridSizeLabel: 'Map Size',
                languageLabel: 'Language / Idioma',
                saveBtn: 'Save',
                gameOverTitle: 'SCORE: ',
                gameOverSub: 'Game Over',
                noScores: 'No scores yet'
            },
            es: {
                lbTitle: 'TOP JUGADORES',
                instructions: 'Presiona JUGAR y luego una flecha para moverte.',
                play: 'JUGAR',
                settings: 'Configuración',
                usernameLabel: 'Nombre de usuario',
                gridSizeLabel: 'Tamaño del mapa',
                languageLabel: 'Language / Idioma',
                saveBtn: 'Guardar',
                gameOverTitle: 'PUNTUACIÓN: ',
                gameOverSub: 'Juego Terminado',
                noScores: 'Sin puntuaciones aún'
            }
        };

        let currentLang = localStorage.getItem('snake_lang') || 'en';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let tileCount = 20;
        let tileSize = 20;
        let gameInterval = null;
        let isRunning = false;
        let isMoving = false; // Controls the frozen state until arrow key is pressed
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;

        let snake = [];
        let dx = 0, dy = 0, nextDx = 0, nextDy = 0;
        let food = { x: 5, y: 5 };
        let username = localStorage.getItem('snake_username') || 'victor';

        function applyLanguage() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            document.getElementById('lbTitle').innerText = t.lbTitle;

            const enBtn = document.getElementById('langEnBtn');
            const esBtn = document.getElementById('langEsBtn');

            if (currentLang === 'en') {
                enBtn.className = 'py-2 bg-emerald-500 text-slate-950 font-bold border-emerald-400 rounded-xl';
                esBtn.className = 'py-2 bg-slate-950 text-slate-400 border-slate-700 rounded-xl hover:text-white';
            } else {
                esBtn.className = 'py-2 bg-emerald-500 text-slate-950 font-bold border-emerald-400 rounded-xl';
                enBtn.className = 'py-2 bg-slate-950 text-slate-400 border-slate-700 rounded-xl hover:text-white';
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('snake_lang', lang);
            applyLanguage();
        }

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            tileSize = Math.floor(canvas.width / tileCount);
        }
        window.addEventListener('resize', initCanvas);

        function updateGridSize() {
            tileCount = parseInt(document.getElementById('gridSizeSelect').value);
            initCanvas();
            if (!isRunning) render();
        }

        function startGame() {
            initCanvas();
            document.getElementById('gameOverlay').classList.add('hidden');
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            
            // Snake starts frozen in place
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            isMoving = false;
            
            score = 0;
            document.getElementById('scoreDisplay').innerText = score;
            spawnFood();
            isRunning = true;
            
            render(); // Render initial frozen state immediately

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 90);
        }

        function gameLoop() {
            if (!isMoving) return; // Remain frozen until arrow key input

            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return gameOver();

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('scoreDisplay').innerText = score;
                saveScore(username, score); // Live update score to leaderboard
                spawnFood();
            } else {
                snake.pop();
            }

            render();
        }

        function render() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cyber Grid
            ctx.strokeStyle = '#0f172a';
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * tileSize); ctx.lineTo(canvas.width, i * tileSize); ctx.stroke();
            }

            // Food
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2, tileSize / 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Snake
            snake.forEach((seg, idx) => {
                ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
                ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function gameOver() {
            isRunning = false;
            isMoving = false;
            clearInterval(gameInterval);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('topScoreDisplay').innerText = highScore;
            }
            
            saveScore(username, score);

            const t = translations[currentLang];
            document.getElementById('overlayIcon').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            document.getElementById('overlayTitle').innerText = t.gameOverTitle + score;
            document.getElementById('overlaySubtitle').innerText = t.gameOverSub;
            document.getElementById('gameOverlay').classList.remove('hidden');
        }

        async function saveScore(user, scoreVal) {
            if (supabaseClient && scoreVal > 0) {
                try {
                    await supabaseClient.from('leaderboard').insert([{ username: user, score: scoreVal }]);
                } catch (e) {}
            }
            fetchLeaderboard();
        }

        async function fetchLeaderboard() {
            const listContainer = document.getElementById('leaderboardList');
            let data = [];

            if (supabaseClient) {
                try {
                    const res = await supabaseClient.from('leaderboard').select('*').order('score', { ascending: false });
                    if (res.data) data = res.data;
                } catch (e) {}
            }

            // Group by user to display highest score per player
            const uniqueMap = new Map();
            data.forEach(item => {
                if (!uniqueMap.has(item.username) || uniqueMap.get(item.username).score < item.score) {
                    uniqueMap.set(item.username, item);
                }
            });

            const uniqueList = Array.from(uniqueMap.values()).sort((a, b) => b.score - a.score).slice(0, 5);

            const t = translations[currentLang];
            listContainer.innerHTML = uniqueList.map((item, index) => `
                <div class="flex justify-between items-center bg-slate-950/70 px-1.5 py-1 rounded border border-slate-800/80">
                    <span class="text-slate-300 font-bold truncate max-w-[90px]"><span class="text-emerald-400">#${index + 1}</span> ${item.username}</span>
                    <span class="font-bold text-teal-400">${item.score}</span>
                </div>
            `).join('') || `<div class="text-slate-500 text-center py-2 text-[10px]">${t.noScores}</div>`;
        }

        function saveSettings() {
            username = document.getElementById('usernameInput').value.trim() || 'victor';
            localStorage.setItem('snake_username', username);
            closeModal('settingsModal');
        }

        window.addEventListener('keydown', e => {
            if (!isRunning) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                if (!isMoving) isMoving = true; // Unfreeze on first arrow key press
            }

            if (e.key === 'ArrowUp' && dy !== 1) { nextDx = 0; nextDy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { nextDx = 0; nextDy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { nextDx = -1; nextDy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { nextDx = 1; nextDy = 0; }
        });

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        window.onload = function() {
            initCanvas();
            applyLanguage();
            document.getElementById('topScoreDisplay').innerText = highScore;
            document.getElementById('usernameInput').value = username;
            fetchLeaderboard();
        };
    </script>
</body>
</html>
