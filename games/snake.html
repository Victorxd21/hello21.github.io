<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake - Minimal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#10b981', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Orbitron', sans-serif; }
        .neon-border { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500">

    <!-- Contenedor Estilo Google Snake Minimalista -->
    <div class="w-full max-w-[560px] bg-slate-900 border border-emerald-500/30 rounded-2xl overflow-hidden neon-border flex flex-col shadow-2xl">
        
        <!-- Barra Superior Minimalista (Puntuación y Estado) -->
        <div class="bg-slate-900/90 px-5 py-3 border-b border-emerald-500/20 flex justify-between items-center text-sm font-bold">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-emerald-400">
                    <i class="fa-solid fa-gamepad text-lg"></i>
                    <span id="scoreDisplay" class="text-xl">0</span>
                </div>
                <div class="flex items-center gap-2 text-cyan-400 text-xs">
                    <i class="fa-solid fa-trophy"></i>
                    <span id="topScoreDisplay">0</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleLeaderboard()" class="text-xs text-slate-400 hover:text-emerald-400 transition" title="Tabla de Clasificación">
                    <i class="fa-solid fa-ranking-star text-base"></i>
                </button>
                <button onclick="openModal('settingsModal')" class="text-xs text-slate-400 hover:text-emerald-400 transition" title="Ajustes">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>
            </div>
        </div>

        <!-- Área de Juego (Canvas + Menú Superpuesto) -->
        <div class="relative w-full aspect-square bg-slate-950 flex items-center justify-center">
            
            <!-- Menú Principal / Game Over (Superpuesto limpio estilo Google) -->
            <div id="gameOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-20 flex flex-col items-center justify-center p-6 text-center">
                <div id="overlayContent" class="flex flex-col items-center gap-4">
                    <div id="overlayIcon" class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-3xl mb-2">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    
                    <h2 id="overlayTitle" class="text-2xl font-black text-white tracking-wider">CYBER SNAKE</h2>
                    <p id="overlaySubtitle" class="text-xs text-slate-400 max-w-xs">Usa las flechas del teclado para moverte.</p>

                    <div class="flex flex-col gap-2.5 w-48 mt-2">
                        <button onclick="startGame()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> JUGAR
                        </button>
                        <button onclick="toggleLeaderboard()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition text-xs flex items-center justify-center gap-2 border border-slate-700">
                            <i class="fa-solid fa-ranking-star"></i> TOP 10
                        </button>
                    </div>
                </div>

                <!-- Panel de Tabla de Clasificación dentro del juego -->
                <div id="leaderboardView" class="hidden w-full max-w-xs flex-col gap-3">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-xs font-bold text-emerald-400">TOP JUGADORES</span>
                        <button onclick="hideLeaderboard()" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="leaderboardList" class="space-y-1.5 max-h-48 overflow-y-auto text-xs pr-1"></div>
                    <button onclick="hideLeaderboard()" class="mt-2 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs">Volver</button>
                </div>
            </div>

            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
        </div>
    </div>

    <!-- Modal de Ajustes Minimalista -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl relative">
            <button onclick="closeModal('settingsModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-sm font-bold text-emerald-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Configuración
            </h3>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Nombre de usuario</label>
                    <input type="text" id="usernameInput" maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Tamaño de Mapa</label>
                    <select id="gridSizeSelect" onchange="updateGridSize()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="15">Micro (15x15)</option>
                        <option value="20" selected>Estándar (20x20)</option>
                        <option value="25">Grande (25x25)</option>
                    </select>
                </div>
                <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl transition mt-2">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukaihgoijcsgtdnjnpyu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Zpkb-lUZvy3sqOSSCxyK_w_G14fWqf5';
        let supabaseClient = null;

        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {}

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let tileCount = 20;
        let tileSize = 20;
        let gameInterval = null;
        let isRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;

        let snake = [];
        let dx = 1, dy = 0, nextDx = 1, nextDy = 0;
        let food = { x: 5, y: 5 };
        let username = localStorage.getItem('snake_username') || 'victor';

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            tileSize = Math.floor(canvas.width / tileCount);
        }
        window.addEventListener('resize', initCanvas);

        function updateGridSize() {
            tileCount = parseInt(document.getElementById('gridSizeSelect').value);
            initCanvas();
        }

        function startGame() {
            initCanvas();
            document.getElementById('gameOverlay').classList.add('hidden');
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dx = 1; dy = 0; nextDx = 1; nextDy = 0;
            score = 0;
            document.getElementById('scoreDisplay').innerText = score;
            spawnFood();
            isRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 90);
        }

        function gameLoop() {
            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return gameOver();

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('scoreDisplay').innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            render();
        }

        function render() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rejilla Cyber Minimalista
            ctx.strokeStyle = '#0f172a';
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * tileSize); ctx.lineTo(canvas.width, i * tileSize); ctx.stroke();
            }

            // Comida
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2, tileSize / 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Serpiente
            snake.forEach((seg, idx) => {
                ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
                ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('topScoreDisplay').innerText = highScore;
            }
            saveScore(username, score);

            document.getElementById('overlayIcon').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            document.getElementById('overlayTitle').innerText = 'PUNTUACIÓN: ' + score;
            document.getElementById('overlaySubtitle').innerText = 'Partida finalizada';
            document.getElementById('gameOverlay').classList.remove('hidden');
        }

        async function saveScore(user, scoreVal) {
            if (supabaseClient && scoreVal > 0) {
                try {
                    await supabaseClient.from('leaderboard').insert([{ username: user, score: scoreVal }]);
                } catch (e) {}
            }
            fetchLeaderboard();
        }

        // Filtro para eliminar usuarios duplicados en el Leaderboard
        async function fetchLeaderboard() {
            const listContainer = document.getElementById('leaderboardList');
            let data = [];

            if (supabaseClient) {
                try {
                    const res = await supabaseClient.from('leaderboard').select('*').order('score', { ascending: false });
                    if (res.data) data = res.data;
                } catch (e) {}
            }

            // Eliminar duplicados manteniendo la puntuación más alta por usuario
            const uniqueMap = new Map();
            data.forEach(item => {
                if (!uniqueMap.has(item.username) || uniqueMap.get(item.username).score < item.score) {
                    uniqueMap.set(item.username, item);
                }
            });

            const uniqueList = Array.from(uniqueMap.values()).sort((a, b) => b.score - a.score).slice(0, 10);

            listContainer.innerHTML = uniqueList.map((item, index) => `
                <div class="flex justify-between items-center bg-slate-950 p-2 rounded-lg border border-slate-800">
                    <span class="text-slate-300 font-bold"><span class="text-emerald-400">#${index + 1}</span> ${item.username}</span>
                    <span class="font-bold text-teal-400">${item.score}</span>
                </div>
            `).join('') || '<div class="text-slate-500 text-center py-2">Sin puntuaciones aún</div>';
        }

        function toggleLeaderboard() {
            document.getElementById('overlayContent').classList.add('hidden');
            document.getElementById('leaderboardView').classList.remove('hidden');
            document.getElementById('leaderboardView').classList.add('flex');
            document.getElementById('gameOverlay').classList.remove('hidden');
            fetchLeaderboard();
        }

        function hideLeaderboard() {
            document.getElementById('leaderboardView').classList.add('hidden');
            document.getElementById('leaderboardView').classList.remove('flex');
            document.getElementById('overlayContent').classList.remove('hidden');
        }

        function saveSettings() {
            username = document.getElementById('usernameInput').value.trim() || 'victor';
            localStorage.setItem('snake_username', username);
            closeModal('settingsModal');
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dy !== 1) { nextDx = 0; nextDy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { nextDx = 0; nextDy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { nextDx = -1; nextDy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { nextDx = 1; nextDy = 0; }
        });

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        window.onload = function() {
            initCanvas();
            document.getElementById('topScoreDisplay').innerText = highScore;
            document.getElementById('usernameInput').value = username;
            fetchLeaderboard();
        };
    </script>
</body>
</html>
