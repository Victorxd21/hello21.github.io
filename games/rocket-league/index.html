<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Rocket League</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box">
      <div class="logo">ROCKET LEAGUE</div>
      <p class="subtitle">Multiplayer Car Soccer</p>
      <input type="text" id="usernameInput" placeholder="Username" maxlength="16" autocomplete="off" />
      <input type="password" id="passwordInput" placeholder="Password (optional)" maxlength="32" />
      <button id="playBtn">PLAY</button>
      <p class="hint">Username required. Password optional (saved on this device).</p>
    </div>
  </div>

  <div id="mainMenu" class="hidden">
    <div class="menu-box">
      <h1>ROCKET LEAGUE</h1>
      <p id="welcomeText">Welcome</p>
      <button id="soloBtn">SOLO PRACTICE</button>
      <button id="createRoomBtn">CREATE ROOM</button>
      <button id="joinRoomBtn">JOIN ROOM</button>
      <input type="text" id="roomCodeInput" placeholder="Enter room code" class="hidden" maxlength="12" />
      <button id="confirmJoinBtn" class="hidden">JOIN</button>
      <button id="leaderboardBtn">LEADERBOARD</button>
      <button id="logoutBtn">SWITCH USER</button>
    </div>
  </div>

  <div id="leaderboardScreen" class="hidden">
    <div class="lb-box">
      <h2>LEADERBOARD</h2>
      <div id="lbList">Loading...</div>
      <button id="closeLbBtn">CLOSE</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="scoreBoard">
      <span id="blueScore">0</span>
      <span class="vs">-</span>
      <span id="orangeScore">0</span>
    </div>
    <div id="timer">5:00</div>
    <div id="boostBar"><div id="boostFill"></div></div>
    <div id="playerList"></div>
    <div id="statusMsg"></div>
    <div id="controlsHint">WASD / Arrows = Drive | Shift = Boost | Space = Jump</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="physics.js"></script>
  <script src="network.js"></script>
  <script src="game.js"></script>
</body>
</html>
