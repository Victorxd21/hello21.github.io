<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Inspector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 260px;
      max-height: 80vh;
      overflow-y: auto;
    }

    #ui h1 {
      font-size: 18px;
      margin-bottom: 2px;
      color: #7dffb3;
    }

    #ui .subtitle {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .model-btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 6px;
      background: rgba(125, 255, 179, 0.12);
      border: 1px solid rgba(125, 255, 179, 0.35);
      color: #7dffb3;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all 0.15s;
    }

    .model-btn:hover {
      background: rgba(125, 255, 179, 0.25);
    }

    .model-btn.active {
      background: #7dffb3;
      color: #0a1a12;
      font-weight: 600;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a2e24;
      font-size: 18px;
      z-index: 20;
      flex-direction: column;
      gap: 10px;
    }

    #info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div>Loading Character Inspector...</div>
    <div style="font-size:13px;opacity:0.7">Drop models in /models and list them in models.json</div>
  </div>

  <div id="ui">
    <h1>Character Inspector</h1>
    <div class="subtitle">Click a model to focus</div>
    <div id="model-list"></div>
  </div>

  <div id="info">Drag to look around • Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 8, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ---- Sky ----
    const sky = new Sky();
    sky.scale.setScalar(450);
    scene.add(sky);

    const skyUniforms = sky.material.uniforms;
    skyUniforms['turbidity'].value = 4;
    skyUniforms['rayleigh'].value = 2.2;
    skyUniforms['mieCoefficient'].value = 0.004;
    skyUniforms['mieDirectionalG'].value = 0.8;

    const sun = new THREE.Vector3();
    const phi = THREE.MathUtils.degToRad(78);
    const theta = THREE.MathUtils.degToRad(180);
    sun.setFromSphericalCoords(1, phi, theta);
    skyUniforms['sunPosition'].value.copy(sun);

    // ---- Lights ----
    const dirLight = new THREE.DirectionalLight(0xfff5e0, 2.4);
    dirLight.position.copy(sun).multiplyScalar(40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 80;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    dirLight.shadow.bias = -0.0003;
    scene.add(dirLight);

    const hemi = new THREE.HemisphereLight(0xb1e1ff, 0x4a7c3a, 0.55);
    scene.add(hemi);

    const fill = new THREE.DirectionalLight(0xa0d8ff, 0.35);
    fill.position.set(-10, 8, -8);
    scene.add(fill);

    // ---- Big Grass Field ----
    const groundGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
    const posAttr = groundGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      const z = Math.sin(x * 0.08) * 0.4 + Math.cos(y * 0.07) * 0.35;
      posAttr.setZ(i, z);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x3d8b4a,
      roughness: 0.92,
      metalness: 0.02
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    for (let i = 0; i < 18; i++) {
      const patch = new THREE.Mesh(
        new THREE.CircleGeometry(2 + Math.random() * 4, 24),
        new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.95 })
      );
      patch.rotation.x = -Math.PI / 2;
      patch.position.set(
        (Math.random() - 0.5) * 90,
        0.02,
        (Math.random() - 0.5) * 90
      );
      patch.receiveShadow = true;
      scene.add(patch);
    }

    // ---- Controls ----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.minDistance = 2;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI / 2.05;

    // ---- Characters ----
    const loader = new GLTFLoader();
    const characters = [];

    // ========== PROCEDURAL WALK ========== 
    // Finds common humanoid bones and applies a simple walk cycle
    function findBone(root, names) {
      let found = null;
      root.traverse((obj) => {
        if (found) return;
        if (!obj.isBone && !obj.isSkinnedMesh) return;
        const n = (obj.name || '').toLowerCase();
        for (const name of names) {
          if (n.includes(name)) {
            found = obj;
            return;
          }
        }
      });
      // also search all objects (some models put bones as Object3D)
      if (!found) {
        root.traverse((obj) => {
          if (found) return;
          const n = (obj.name || '').toLowerCase();
          for (const name of names) {
            if (n.includes(name)) {
              found = obj;
              return;
            }
          }
        });
      }
      return found;
    }

    function setupProceduralWalk(model) {
      const bones = {
        hips: findBone(model, ['hips', 'pelvis', 'root', 'hip']),
        spine: findBone(model, ['spine', 'chest', 'torso', 'body']),
        leftUpLeg: findBone(model, ['leftupleg', 'leftthigh', 'left_upleg', 'l_upleg', 'leftleg', 'thigh_l', 'upleg_l', 'leg_l']),
        rightUpLeg: findBone(model, ['rightupleg', 'rightthigh', 'right_upleg', 'r_upleg', 'rightleg', 'thigh_r', 'upleg_r', 'leg_r']),
        leftLeg: findBone(model, ['leftleg', 'leftlowerleg', 'leftshin', 'left_leg', 'l_leg', 'calf_l', 'shin_l']),
        rightLeg: findBone(model, ['rightleg', 'rightlowerleg', 'rightshin', 'right_leg', 'r_leg', 'calf_r', 'shin_r']),
        leftFoot: findBone(model, ['leftfoot', 'left_foot', 'l_foot', 'foot_l']),
        rightFoot: findBone(model, ['rightfoot', 'right_foot', 'r_foot', 'foot_r']),
        leftArm: findBone(model, ['leftarm', 'leftupperarm', 'left_arm', 'l_arm', 'upperarm_l', 'arm_l']),
        rightArm: findBone(model, ['rightarm', 'rightupperarm', 'right_arm', 'r_arm', 'upperarm_r', 'arm_r']),
        leftForeArm: findBone(model, ['leftforearm', 'leftlowerarm', 'left_forearm', 'l_forearm', 'forearm_l']),
        rightForeArm: findBone(model, ['rightforearm', 'rightlowerarm', 'right_forearm', 'r_forearm', 'forearm_r'])
      };

      // store original rotations so we can blend
      const originals = {};
      for (const key in bones) {
        if (bones[key]) {
          originals[key] = bones[key].rotation.clone();
        }
      }

      const hasLegs = bones.leftUpLeg || bones.rightUpLeg;
      if (!hasLegs) return null; // can't do much without legs

      return {
        bones,
        originals,
        time: Math.random() * 10, // random start phase so they don't sync
        update(delta, speed = 1.0) {
          this.time += delta * speed * 5.5; // walk frequency

          const t = this.time;
          const swing = Math.sin(t);
          const swing2 = Math.sin(t + Math.PI); // opposite leg

          // Legs
          if (this.bones.leftUpLeg) {
            this.bones.leftUpLeg.rotation.x = this.originals.leftUpLeg.x + swing * 0.55;
          }
          if (this.bones.rightUpLeg) {
            this.bones.rightUpLeg.rotation.x = this.originals.rightUpLeg.x + swing2 * 0.55;
          }

          // Knees (bend more on the forward swing)
          if (this.bones.leftLeg) {
            this.bones.leftLeg.rotation.x = this.originals.leftLeg.x + Math.max(0, -swing) * 0.7;
          }
          if (this.bones.rightLeg) {
            this.bones.rightLeg.rotation.x = this.originals.rightLeg.x + Math.max(0, -swing2) * 0.7;
          }

          // Feet
          if (this.bones.leftFoot) {
            this.bones.leftFoot.rotation.x = this.originals.leftFoot.x + swing * 0.25;
          }
          if (this.bones.rightFoot) {
            this.bones.rightFoot.rotation.x = this.originals.rightFoot.x + swing2 * 0.25;
          }

          // Arms (opposite to legs)
          if (this.bones.leftArm) {
            this.bones.leftArm.rotation.x = this.originals.leftArm.x + swing2 * 0.4;
          }
          if (this.bones.rightArm) {
            this.bones.rightArm.rotation.x = this.originals.rightArm.x + swing * 0.4;
          }

          // Forearms
          if (this.bones.leftForeArm) {
            this.bones.leftForeArm.rotation.x = this.originals.leftForeArm.x + Math.max(0, swing2) * 0.3;
          }
          if (this.bones.rightForeArm) {
            this.bones.rightForeArm.rotation.x = this.originals.rightForeArm.x + Math.max(0, swing) * 0.3;
          }

          // Body bob + slight lean
          if (this.bones.hips) {
            this.bones.hips.position.y = (this.originals.hips ? 0 : 0) + Math.abs(Math.sin(t * 2)) * 0.04;
            this.bones.hips.rotation.y = Math.sin(t) * 0.06;
          }
          if (this.bones.spine) {
            this.bones.spine.rotation.y = Math.sin(t) * 0.04;
            this.bones.spine.rotation.z = Math.sin(t) * 0.03;
          }
        }
      };
    }

    // ========== LOAD MODELS ==========
    async function loadModels() {
      let list = [];
      try {
        const res = await fetch('./models/models.json');
        list = await res.json();
      } catch (e) {
        console.warn('No models.json found');
      }

      if (!list.length) {
        document.getElementById('loading').innerHTML =
          '<div>No models yet</div><div style="font-size:13px;opacity:0.7;margin-top:8px">Add .glb files to /models<br>and list them in models.json</div>';
        return;
      }

      const container = document.getElementById('model-list');

      for (let i = 0; i < list.length; i++) {
        const entry = list[i];
        const file = entry.file || entry;
        const displayName = entry.name || file.replace('.glb', '').replace(/[-_]/g, ' ');

        try {
          const gltf = await loader.loadAsync('./models/' + file);
          const model = gltf.scene;

          model.traverse((c) => {
            if (c.isMesh) {
              c.castShadow = true;
              c.receiveShadow = true;
            }
          });

          // center + put on ground
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);
          model.position.y += size.y / 2;

          // scale if needed
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 3.5) model.scale.setScalar(2.8 / maxDim);
          if (maxDim < 0.8) model.scale.setScalar(1.6 / maxDim);

          // random start position
          const angle = (i / list.length) * Math.PI * 2;
          const radius = 6 + Math.random() * 5;
          model.position.x = Math.cos(angle) * radius;
          model.position.z = Math.sin(angle) * radius;

          scene.add(model);

          // real animations?
          let mixer = null;
          const actions = {};
          let walkClip = null;

          if (gltf.animations && gltf.animations.length) {
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => {
              const name = clip.name.toLowerCase();
              actions[clip.name] = mixer.clipAction(clip);
              if (name.includes('walk') || name.includes('run') || name.includes('locomotion') || name.includes('move')) {
                walkClip = clip.name;
              }
            });
            if (!walkClip) walkClip = gltf.animations[0].name;
          }

          // procedural fallback
          const procedural = (!walkClip) ? setupProceduralWalk(model) : null;

          const char = {
            name: displayName,
            model,
            mixer,
            actions,
            walkClip,
            procedural,
            walkSpeed: 1.1 + Math.random() * 0.6,
            target: new THREE.Vector3(
              (Math.random() - 0.5) * 40,
              0,
              (Math.random() - 0.5) * 40
            ),
            currentAction: null
          };

          characters.push(char);

          // UI button
          const btn = document.createElement('button');
          btn.className = 'model-btn';
          btn.textContent = displayName + (procedural ? ' (procedural)' : '');
          btn.onclick = () => focusCharacter(char, btn);
          container.appendChild(btn);

          // start real walk if available
          if (walkClip && actions[walkClip]) {
            const action = actions[walkClip];
            action.reset().play();
            char.currentAction = action;
          }
        } catch (err) {
          console.error('Failed to load', file, err);
        }
      }

      document.getElementById('loading').style.display = 'none';

      if (characters.length) {
        focusCharacter(characters[0], document.querySelector('.model-btn'));
      }
    }

    function focusCharacter(char, btn) {
      document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      controls.target.copy(char.model.position);
      controls.target.y += 1.1;
    }

    function updateWalking(delta) {
      characters.forEach((char) => {
        const pos = char.model.position;
        const target = char.target;

        const dist = pos.distanceTo(target);
        if (dist < 1.8) {
          target.set(
            (Math.random() - 0.5) * 50,
            0,
            (Math.random() - 0.5) * 50
          );
        }

        const dir = new THREE.Vector3().subVectors(target, pos).normalize();
        pos.x += dir.x * char.walkSpeed * delta;
        pos.z += dir.z * char.walkSpeed * delta;

        // face direction
        if (dir.length() > 0.01) {
          const angle = Math.atan2(dir.x, dir.z);
          char.model.rotation.y = THREE.MathUtils.lerp(char.model.rotation.y, angle, 0.08);
        }

        // update animation
        if (char.mixer) {
          char.mixer.update(delta);
        } else if (char.procedural) {
          char.procedural.update(delta, char.walkSpeed * 0.9);
        }
      });
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      updateWalking(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadModels();
    animate();
  </script>
</body>
</html>
