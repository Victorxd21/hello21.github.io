<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Inspector - Cube People</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 240px;
    }

    #ui h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #7dffb3;
    }

    #ui p {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 6px;
      background: rgba(125, 255, 179, 0.12);
      border: 1px solid rgba(125, 255, 179, 0.35);
      color: #7dffb3;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn:hover { background: rgba(125, 255, 179, 0.25); }

    #info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h1>Cube People</h1>
    <p>Improved procedural walk + collision</p>
    <button class="btn" id="addBtn">+ Add Person</button>
    <button class="btn" id="clearBtn">Clear All</button>
  </div>

  <div id="info">Drag to look around • Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 12, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Sky
    const sky = new Sky();
    sky.scale.setScalar(450);
    scene.add(sky);
    const skyU = sky.material.uniforms;
    skyU['turbidity'].value = 4;
    skyU['rayleigh'].value = 2.2;
    skyU['mieCoefficient'].value = 0.004;
    skyU['mieDirectionalG'].value = 0.8;
    const sun = new THREE.Vector3();
    sun.setFromSphericalCoords(1, THREE.MathUtils.degToRad(78), THREE.MathUtils.degToRad(180));
    skyU['sunPosition'].value.copy(sun);

    // Lights
    const dirLight = new THREE.DirectionalLight(0xfff5e0, 2.4);
    dirLight.position.copy(sun).multiplyScalar(45);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -40;
    dirLight.shadow.camera.right = 40;
    dirLight.shadow.camera.top = 40;
    dirLight.shadow.camera.bottom = -40;
    dirLight.shadow.bias = -0.0003;
    scene.add(dirLight);

    scene.add(new THREE.HemisphereLight(0xb1e1ff, 0x4a7c3a, 0.55));
    const fill = new THREE.DirectionalLight(0xa0d8ff, 0.3);
    fill.position.set(-12, 10, -10);
    scene.add(fill);

    // Grass field
    const groundGeo = new THREE.PlaneGeometry(160, 160, 90, 90);
    const posAttr = groundGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i), y = posAttr.getY(i);
      posAttr.setZ(i, Math.sin(x * 0.06) * 0.4 + Math.cos(y * 0.05) * 0.35 + Math.sin(x*0.12+y*0.1)*0.15);
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
      color: 0x3d8b4a, roughness: 0.92, metalness: 0.02
    }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    for (let i = 0; i < 28; i++) {
      const p = new THREE.Mesh(
        new THREE.CircleGeometry(2 + Math.random() * 4, 20),
        new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.95 })
      );
      p.rotation.x = -Math.PI / 2;
      p.position.set((Math.random()-0.5)*120, 0.02, (Math.random()-0.5)*120);
      p.receiveShadow = true;
      scene.add(p);
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI / 2.05;

    // ========== CUBE PERSON ========== 
    const COLORS = [
      0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3,
      0xf38181, 0xaa96da, 0xfcbad3, 0xa8d8ea,
      0xff9a3c, 0x6bcb77, 0x4d96ff, 0xff6b9d,
      0xf9a825, 0x26a69a, 0x7e57c2, 0xef5350
    ];

    const PERSON_RADIUS = 0.55;

    function createPerson() {
      const group = new THREE.Group();

      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const skin = 0xffdbac;
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.65 });

      const hips = new THREE.Group();
      group.add(hips);

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.26), mat);
      torso.position.y = 0.72;
      torso.castShadow = true;
      hips.add(torso);

      // Head
      const headPivot = new THREE.Group();
      headPivot.position.y = 1.12;
      hips.add(headPivot);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.30, 0.30), skinMat);
      head.position.y = 0.17;
      head.castShadow = true;
      headPivot.add(head);

      const face = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.10, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x222222 })
      );
      face.position.set(0, 0.17, 0.15);
      headPivot.add(face);

      // Arms
      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.58, 0.11), mat);
      leftArm.position.set(-0.30, 0.78, 0);
      leftArm.geometry.translate(0, -0.29, 0);
      leftArm.castShadow = true;
      hips.add(leftArm);

      const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.58, 0.11), mat);
      rightArm.position.set(0.30, 0.78, 0);
      rightArm.geometry.translate(0, -0.29, 0);
      rightArm.castShadow = true;
      hips.add(rightArm);

      // Legs
      const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.68, 0.13), mat);
      leftLeg.position.set(-0.12, 0.0, 0);
      leftLeg.geometry.translate(0, -0.34, 0);
      leftLeg.castShadow = true;
      hips.add(leftLeg);

      const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.68, 0.13), mat);
      rightLeg.position.set(0.12, 0.0, 0);
      rightLeg.geometry.translate(0, -0.34, 0);
      rightLeg.castShadow = true;
      hips.add(rightLeg);

      // Shadow
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.48, 16),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.03;
      group.add(shadow);

      const angle = Math.random() * Math.PI * 2;
      const radius = 5 + Math.random() * 14;
      group.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

      const person = {
        group, hips, torso, headPivot, leftArm, rightArm, leftLeg, rightLeg, shadow,
        walkPhase: Math.random() * Math.PI * 2,
        walkSpeed: 1.35 + Math.random() * 0.85,
        target: new THREE.Vector3((Math.random()-0.5)*60, 0, (Math.random()-0.5)*60),
        currentBodyYaw: 0,
        currentHeadYaw: 0,
        currentHeadPitch: 0,
        velocity: new THREE.Vector3(),
        lastPos: new THREE.Vector3()
      };

      scene.add(group);
      return person;
    }

    const people = [];
    for (let i = 0; i < 10; i++) people.push(createPerson());

    document.getElementById('addBtn').onclick = () => people.push(createPerson());
    document.getElementById('clearBtn').onclick = () => {
      people.forEach(p => scene.remove(p.group));
      people.length = 0;
    };

    // ========== UPDATE ========== 
    function updatePeople(delta) {
      // Movement + separation
      people.forEach((p, i) => {
        const pos = p.group.position;
        p.lastPos.copy(pos);

        if (pos.distanceTo(p.target) < 2.2) {
          p.target.set((Math.random()-0.5)*70, 0, (Math.random()-0.5)*70);
        }

        let dir = new THREE.Vector3().subVectors(p.target, pos);
        dir.y = 0;
        if (dir.length() < 0.01) dir.set(1, 0, 0);
        dir.normalize();

        // Separation force
        const avoid = new THREE.Vector3();
        people.forEach((other, j) => {
          if (i === j) return;
          const d = pos.distanceTo(other.group.position);
          if (d < PERSON_RADIUS * 2.5 && d > 0.01) {
            const push = new THREE.Vector3().subVectors(pos, other.group.position);
            push.y = 0;
            push.normalize();
            const strength = (PERSON_RADIUS * 2.5 - d) / (PERSON_RADIUS * 2.5);
            avoid.add(push.multiplyScalar(strength * 3.0));
          }
        });

        dir.add(avoid);
        if (dir.length() > 0.01) dir.normalize();

        const speed = p.walkSpeed * delta;
        pos.x += dir.x * speed;
        pos.z += dir.z * speed;

        pos.x = THREE.MathUtils.clamp(pos.x, -70, 70);
        pos.z = THREE.MathUtils.clamp(pos.z, -70, 70);

        p.velocity.copy(dir);
      });

      // Animation
      people.forEach(p => {
        const dir = p.velocity;
        if (dir.length() < 0.01) return;

        // Actual distance moved this frame (for better phase advance)
        const distMoved = p.group.position.distanceTo(p.lastPos);

        // Desired yaw
        const desiredYaw = Math.atan2(dir.x, dir.z);

        // Smooth body turn
        let yawDiff = desiredYaw - p.currentBodyYaw;
        yawDiff = ((yawDiff + Math.PI) % (Math.PI * 2)) - Math.PI;
        p.currentBodyYaw += yawDiff * (1 - Math.exp(-5.8 * delta));
        p.group.rotation.y = p.currentBodyYaw;

        // Head leads a little, clamped
        let headOffset = desiredYaw - p.currentBodyYaw;
        headOffset = ((headOffset + Math.PI) % (Math.PI * 2)) - Math.PI;
        headOffset = THREE.MathUtils.clamp(headOffset, -0.6, 0.6);

        p.currentHeadYaw += (headOffset - p.currentHeadYaw) * (1 - Math.exp(-7.5 * delta));
        p.headPivot.rotation.y = p.currentHeadYaw;

        p.currentHeadPitch += (-0.05 - p.currentHeadPitch) * (1 - Math.exp(-3 * delta));
        p.headPivot.rotation.x = p.currentHeadPitch;

        // ---- Improved walk cycle ----
        // Advance phase based on actual movement so feet feel more planted
        const stepLength = 0.85; // approximate stride
        p.walkPhase += (distMoved / stepLength) * Math.PI * 2;

        const t = p.walkPhase;

        // Leg swing (stronger + slight delay feel)
        const legSwing = Math.sin(t) * 0.95;
        const legSwing2 = Math.sin(t + Math.PI) * 0.95;

        p.leftLeg.rotation.x = legSwing;
        p.rightLeg.rotation.x = legSwing2;

        // Arms opposite and strong
        p.leftArm.rotation.x = Math.sin(t + Math.PI) * 0.75;
        p.rightArm.rotation.x = Math.sin(t) * 0.75;

        // Hip bob (up on pass, down on contact)
        const bob = Math.abs(Math.sin(t * 2)) * 0.08;
        p.hips.position.y = bob;

        // Side-to-side hip sway (classic walk)
        p.hips.rotation.z = Math.sin(t) * 0.06;

        // Torso counter-rotation (opposite to hips a bit)
        p.torso.rotation.y = Math.sin(t) * -0.08;

        // Lean into turns
        const lean = THREE.MathUtils.clamp(yawDiff * 0.55, -0.2, 0.2);
        p.torso.rotation.z += (lean - p.torso.rotation.z) * 0.15;

        // Shadow
        p.shadow.scale.setScalar(1.0 - bob * 1.4);
      });
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      updatePeople(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
