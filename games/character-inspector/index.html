<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Inspector - Cube People</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 240px;
    }

    #ui h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #7dffb3;
    }

    #ui p {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 6px;
      background: rgba(125, 255, 179, 0.12);
      border: 1px solid rgba(125, 255, 179, 0.35);
      color: #7dffb3;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .btn:hover { background: rgba(125, 255, 179, 0.25); }

    #info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h1>Cube People</h1>
    <p>Procedural walk + head & torso look toward walking direction</p>
    <button class="btn" id="addBtn">+ Add Person</button>
    <button class="btn" id="clearBtn">Clear All</button>
  </div>

  <div id="info">Drag to look around • Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    // ========== SCENE ========== 
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 10, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Sky
    const sky = new Sky();
    sky.scale.setScalar(450);
    scene.add(sky);
    const skyU = sky.material.uniforms;
    skyU['turbidity'].value = 4;
    skyU['rayleigh'].value = 2.2;
    skyU['mieCoefficient'].value = 0.004;
    skyU['mieDirectionalG'].value = 0.8;
    const sun = new THREE.Vector3();
    sun.setFromSphericalCoords(1, THREE.MathUtils.degToRad(78), THREE.MathUtils.degToRad(180));
    skyU['sunPosition'].value.copy(sun);

    // Lights
    const dirLight = new THREE.DirectionalLight(0xfff5e0, 2.3);
    dirLight.position.copy(sun).multiplyScalar(40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 90;
    dirLight.shadow.camera.left = -35;
    dirLight.shadow.camera.right = 35;
    dirLight.shadow.camera.top = 35;
    dirLight.shadow.camera.bottom = -35;
    dirLight.shadow.bias = -0.0003;
    scene.add(dirLight);

    scene.add(new THREE.HemisphereLight(0xb1e1ff, 0x4a7c3a, 0.55));
    const fill = new THREE.DirectionalLight(0xa0d8ff, 0.3);
    fill.position.set(-10, 8, -8);
    scene.add(fill);

    // Grass field
    const groundGeo = new THREE.PlaneGeometry(140, 140, 80, 80);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x * 0.07) * 0.35 + Math.cos(y * 0.06) * 0.3);
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
      color: 0x3d8b4a, roughness: 0.92, metalness: 0.02
    }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    for (let i = 0; i < 22; i++) {
      const p = new THREE.Mesh(
        new THREE.CircleGeometry(1.8 + Math.random() * 3.5, 20),
        new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.95 })
      );
      p.rotation.x = -Math.PI / 2;
      p.position.set((Math.random()-0.5)*100, 0.015, (Math.random()-0.5)*100);
      p.receiveShadow = true;
      scene.add(p);
    }

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 70;
    controls.maxPolarAngle = Math.PI / 2.05;

    // ========== CUBE PERSON ========== 
    const COLORS = [
      0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3,
      0xf38181, 0xaa96da, 0xfcbad3, 0xa8d8ea,
      0xff9a3c, 0x6bcb77, 0x4d96ff, 0xff6b9d
    ];

    function createPerson() {
      const group = new THREE.Group();

      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const skin = 0xffdbac;
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.65 });

      // Hips (root of body)
      const hips = new THREE.Group();
      group.add(hips);

      // Torso
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.55, 0.28),
        mat
      );
      torso.position.y = 0.55;
      torso.castShadow = true;
      hips.add(torso);

      // Head
      const headPivot = new THREE.Group();
      headPivot.position.y = 0.9;
      hips.add(headPivot);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.32, 0.32),
        skinMat
      );
      head.position.y = 0.18;
      head.castShadow = true;
      headPivot.add(head);

      // Simple face (just so direction is clear)
      const face = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.12, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x222222 })
      );
      face.position.set(0, 0.18, 0.16);
      headPivot.add(face);

      // Arms
      const leftArm = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.48, 0.12),
        mat
      );
      leftArm.position.set(-0.32, 0.55, 0);
      leftArm.geometry.translate(0, -0.24, 0);
      leftArm.castShadow = true;
      hips.add(leftArm);

      const rightArm = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.48, 0.12),
        mat
      );
      rightArm.position.set(0.32, 0.55, 0);
      rightArm.geometry.translate(0, -0.24, 0);
      rightArm.castShadow = true;
      hips.add(rightArm);

      // Legs
      const leftLeg = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.55, 0.14),
        mat
      );
      leftLeg.position.set(-0.12, 0.0, 0);
      leftLeg.geometry.translate(0, -0.275, 0);
      leftLeg.castShadow = true;
      hips.add(leftLeg);

      const rightLeg = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.55, 0.14),
        mat
      );
      rightLeg.position.set(0.12, 0.0, 0);
      rightLeg.geometry.translate(0, -0.275, 0);
      rightLeg.castShadow = true;
      hips.add(rightLeg);

      // Random start
      const angle = Math.random() * Math.PI * 2;
      const radius = 4 + Math.random() * 12;
      group.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

      const person = {
        group,
        hips,
        torso,
        headPivot,
        leftArm,
        rightArm,
        leftLeg,
        rightLeg,
        walkPhase: Math.random() * Math.PI * 2,
        walkSpeed: 1.3 + Math.random() * 0.9,
        target: new THREE.Vector3(
          (Math.random() - 0.5) * 50,
          0,
          (Math.random() - 0.5) * 50
        ),
        // smooth look angles
        currentBodyYaw: 0,
        currentHeadYaw: 0,
        currentHeadPitch: 0
      };

      scene.add(group);
      return person;
    }

    const people = [];

    function addPerson() {
      people.push(createPerson());
    }

    // start with a few
    for (let i = 0; i < 7; i++) addPerson();

    document.getElementById('addBtn').onclick = () => addPerson();
    document.getElementById('clearBtn').onclick = () => {
      people.forEach(p => scene.remove(p.group));
      people.length = 0;
    };

    // ========== ANIMATION ========== 
    function updatePeople(delta) {
      people.forEach(p => {
        const pos = p.group.position;
        const target = p.target;

        // new target when close
        if (pos.distanceTo(target) < 2.0) {
          target.set(
            (Math.random() - 0.5) * 55,
            0,
            (Math.random() - 0.5) * 55
          );
        }

        // direction of travel
        const dir = new THREE.Vector3().subVectors(target, pos);
        dir.y = 0;
        if (dir.length() < 0.01) return;
        dir.normalize();

        // move
        pos.x += dir.x * p.walkSpeed * delta;
        pos.z += dir.z * p.walkSpeed * delta;

        // desired body yaw (facing walk direction)
        const desiredYaw = Math.atan2(dir.x, dir.z);

        // smooth body turn (torso + whole person)
        p.currentBodyYaw = THREE.MathUtils.lerp(
          p.currentBodyYaw,
          desiredYaw,
          1 - Math.exp(-4.5 * delta)   // smooth but not instant
        );
        p.group.rotation.y = p.currentBodyYaw;

        // head looks a bit further toward the target (slight lead)
        // limit so neck doesn't break
        let headYawOffset = desiredYaw - p.currentBodyYaw;
        // wrap to -PI..PI
        headYawOffset = ((headYawOffset + Math.PI) % (Math.PI * 2)) - Math.PI;
        headYawOffset = THREE.MathUtils.clamp(headYawOffset, -0.7, 0.7); // max ~40°

        p.currentHeadYaw = THREE.MathUtils.lerp(p.currentHeadYaw, headYawOffset, 1 - Math.exp(-6 * delta));
        p.headPivot.rotation.y = p.currentHeadYaw;

        // tiny head pitch (looking slightly down the path)
        p.currentHeadPitch = THREE.MathUtils.lerp(p.currentHeadPitch, -0.08, 1 - Math.exp(-3 * delta));
        p.headPivot.rotation.x = p.currentHeadPitch;

        // ---- Procedural walk cycle ----
        p.walkPhase += delta * p.walkSpeed * 5.8;
        const t = p.walkPhase;
        const swing = Math.sin(t);
        const swing2 = Math.sin(t + Math.PI);

        // Legs
        p.leftLeg.rotation.x = swing * 0.65;
        p.rightLeg.rotation.x = swing2 * 0.65;

        // Arms (opposite)
        p.leftArm.rotation.x = swing2 * 0.5;
        p.rightArm.rotation.x = swing * 0.5;

        // Body bob
        p.hips.position.y = Math.abs(Math.sin(t * 2)) * 0.05;

        // slight torso lean into turn
        const lean = THREE.MathUtils.clamp((desiredYaw - p.currentBodyYaw) * 0.6, -0.15, 0.15);
        p.torso.rotation.z = THREE.MathUtils.lerp(p.torso.rotation.z, lean, 0.1);
      });
    }

    // ========== LOOP ========== 
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      updatePeople(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
